name: Apply V1.0.2 Release Prep

on:
  push:
    branches:
      - release/v1.0.2
    paths:
      - .github/workflows/apply-v102-release-prep.yml

permissions:
  contents: write

env:
  SQLALCHEMY_DATABASE_URL: mysql+pymysql://marzban:test@127.0.0.1:3306/marzban_test
  DEBUG: "false"

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - run: python -m pip install pytest PyYAML
      - run: bash .github/scripts/run_v102_release_prep.sh
