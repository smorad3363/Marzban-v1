name: Regenerate dashboard build once

on:
  push:
    branches:
      - feat/dashboard-owner-admin-v2
    paths:
      - .github/workflows/build-dashboard-v118-once.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/dashboard-owner-admin-v2
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Install dependencies
        working-directory: app/dashboard
        run: npm ci

      - name: Verify UI contracts
        working-directory: app/dashboard
        run: |
          node scripts/test-stage1-ui-contracts.cjs
          node scripts/test-autofill-contract.cjs

      - name: Build dashboard
        working-directory: app/dashboard
        run: VITE_BASE_API=/api/ npm run build

      - name: Commit canonical build
        shell: bash
        run: |
          set -Eeuo pipefail
          git add app/dashboard/build
          if git diff --cached --quiet; then
            echo "Dashboard build already matches source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: refresh dashboard artifacts"
          git push origin HEAD:feat/dashboard-owner-admin-v2
