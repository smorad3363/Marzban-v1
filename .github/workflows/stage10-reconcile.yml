name: Stage 10 Release Candidate Reconcile

on:
  push:
    branches:
      - stage10-release-candidate-audit

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage10-release-candidate-audit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply audited release-candidate cleanup
        run: python scripts/stage10_reconcile.py

      - name: Verify targeted release contracts
        run: |
          python -m pip install pytest PyYAML
          python -m pytest -q tests/test_release_contract.py tests/test_ci_matrix_contract.py
          bash -n scripts/marzban.sh

      - name: Commit reconciled candidate and remove temporary tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f scripts/stage10_reconcile.py .github/workflows/stage10-reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(release): prepare v1.0.9 release candidate audit"
          git push origin HEAD:stage10-release-candidate-audit
