name: Stage 10 Release Candidate Reconcile

on:
  push:
    branches:
      - stage10-release-candidate-audit

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage10-release-candidate-audit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply audited release-candidate cleanup
        run: python scripts/stage10_reconcile.py

      - name: Verify targeted release contracts
        run: |
          python -m pip install pytest PyYAML
          python -m pytest -q tests/test_release_contract.py tests/test_ci_matrix_contract.py
          bash -n scripts/marzban.sh

      - name: Export workflow patches
        run: |
          mkdir -p /tmp/stage10-workflows/.github/workflows
          cp .github/workflows/build.yml /tmp/stage10-workflows/.github/workflows/build.yml
          cp .github/workflows/checkpoints.yml /tmp/stage10-workflows/.github/workflows/checkpoints.yml
          cp .github/workflows/validate-v1-installer.yml /tmp/stage10-workflows/.github/workflows/validate-v1-installer.yml
          cp .github/workflows/verify-v1-image.yml /tmp/stage10-workflows/.github/workflows/verify-v1-image.yml

      - uses: actions/upload-artifact@v4
        with:
          name: stage10-workflow-patches
          path: /tmp/stage10-workflows

      - name: Commit non-workflow release-candidate material
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f scripts/stage10_reconcile.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RELEASES.md docs/RELEASE_NOTES_v1.0.9.md tests/test_release_contract.py scripts/stage10_reconcile.py
          git diff --cached --check
          git commit -m "docs(release): prepare v1.0.9 release candidate material"
          git push origin HEAD:stage10-release-candidate-audit
