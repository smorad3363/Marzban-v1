name: Stage 10 Release Candidate Reconcile

on:
  push:
    branches:
      - stage10-release-candidate-audit

permissions:
  contents: read

jobs:
  reconcile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage10-release-candidate-audit
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recover audited reconcile script from reviewed history
        run: git show 3791646354fd480f83c5a3c49c7c9176f9dd3385:scripts/stage10_reconcile.py > /tmp/stage10_reconcile.py

      - name: Apply audited release-candidate cleanup in runner workspace
        run: python /tmp/stage10_reconcile.py

      - name: Verify targeted release contracts
        run: |
          python -m pip install pytest PyYAML
          python -m pytest -q tests/test_release_contract.py tests/test_ci_matrix_contract.py
          bash -n scripts/marzban.sh

      - name: Export workflow patches
        run: |
          mkdir -p /tmp/stage10-workflows
          cp .github/workflows/build.yml /tmp/stage10-workflows/build.yml
          cp .github/workflows/checkpoints.yml /tmp/stage10-workflows/checkpoints.yml
          cp .github/workflows/validate-v1-installer.yml /tmp/stage10-workflows/validate-v1-installer.yml
          cp .github/workflows/verify-v1-image.yml /tmp/stage10-workflows/verify-v1-image.yml

      - uses: actions/upload-artifact@v4
        with:
          name: stage10-workflow-patches
          path: /tmp/stage10-workflows
