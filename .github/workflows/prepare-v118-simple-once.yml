name: Prepare v1.1.8 release candidate

on:
  push:
    branches:
      - feat/dashboard-owner-admin-v2
    paths:
      - .github/workflows/prepare-v118-simple-once.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dashboard-owner-admin-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply reviewed release preparation
        run: python scripts/prepare_v118_release_candidate.py
      - name: Compile changed Python
        run: python -m compileall -q app/routers/system.py app/utils/dashboard_metrics.py app/models/system.py tests/test_dashboard_owner_admin_v2.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci
      - name: Verify dashboard contracts
        working-directory: app/dashboard
        run: |
          node scripts/test-stage1-ui-contracts.cjs
          node scripts/test-autofill-contract.cjs
      - name: Build canonical dashboard
        working-directory: app/dashboard
        run: VITE_BASE_API=/api/ npm run build
      - name: Verify release surfaces and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "1.1.8"
          grep -Fx '__version__ = "1.1.8"' app/__init__.py
          grep -Fx 'CLI_RELEASE_VERSION="v1.1.8"' scripts/marzban.sh
          grep -Fq 'ghcr.io/smorad3363/marzban-v1:v1.1.8' docker-compose.yml
          test -s docs/RELEASE_NOTES_v1.1.8.md
          git add app .github/workflows/build.yml VERSION scripts/marzban.sh docker-compose.yml docs tests
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: prepare v1.1.8 candidate"
          git push origin HEAD:feat/dashboard-owner-admin-v2
