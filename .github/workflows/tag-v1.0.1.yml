name: Tag V1.0.1 after verified main

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

jobs:
  tag-release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify release metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "1.0.1"
          grep -Fx '__version__ = "1.0.1"' app/__init__.py
          grep -Fx 'CLI_RELEASE_VERSION="v1.0.1"' scripts/marzban.sh
          grep -Fq 'ghcr.io/smorad3363/marzban-v1:v1.0.1' docker-compose.yml
          bash -n scripts/marzban.sh

      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Verify dashboard production build
        working-directory: ./app/dashboard
        run: |
          npm ci
          VITE_BASE_API=/api/ npm run build --if-present -- --outDir /tmp/marzban-dashboard-v101-tag --assetsDir statics
          test -s /tmp/marzban-dashboard-v101-tag/index.html
          test -s /tmp/marzban-dashboard-v101-tag/404.html

      - name: Create immutable v1.0.1 tag
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          tag="v1.0.1"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            existing="$(git rev-list -n 1 "${tag}")"
            test "${existing}" = "${VERIFIED_SHA}"
            echo "${tag} already points to the verified commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" "${VERIFIED_SHA}" -m "Marzban ${tag}"
          git push origin "refs/tags/${tag}"
