name: Finalize V1.0.1 after verified main

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  finalize-release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout verified main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify release metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "1.0.1"
          grep -Fx '__version__ = "1.0.1"' app/__init__.py
          grep -Fx 'CLI_RELEASE_VERSION="v1.0.1"' scripts/marzban.sh
          grep -Fq 'ghcr.io/smorad3363/marzban-v1:v1.0.1' docker-compose.yml
          bash -n scripts/marzban.sh

      - name: Ensure v1.0.1 has not already been published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if gh release view v1.0.1 >/dev/null 2>&1; then
            echo "v1.0.1 is already published; refusing to rewrite a released version." >&2
            exit 1
          fi

      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Build and commit dashboard artifact
        id: artifact-commit
        shell: bash
        run: |
          set -Eeuo pipefail
          cd app/dashboard
          npm ci
          VITE_BASE_API=/api/ npm run build --if-present -- --outDir build --assetsDir statics
          cp build/index.html build/404.html
          test -s build/index.html
          test -s build/404.html
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/dashboard/build
          if ! git diff --cached --quiet; then
            git commit -m "build: commit v1.0.1 dashboard artifact"
            git push origin HEAD:main
          fi
          release_sha="$(git rev-parse HEAD)"
          short_sha="${release_sha:0:12}"
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"

      - name: Move unpublished tag to complete release commit
        env:
          RELEASE_SHA: ${{ steps.artifact-commit.outputs.release_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify refs/tags/v1.0.1 >/dev/null; then
            current="$(git rev-list -n 1 v1.0.1)"
            if [[ "${current}" != "${RELEASE_SHA}" ]]; then
              git push origin :refs/tags/v1.0.1
              git tag -d v1.0.1
            fi
          fi
          if ! git rev-parse -q --verify refs/tags/v1.0.1 >/dev/null; then
            git tag -a v1.0.1 "${RELEASE_SHA}" -m "Marzban v1.0.1"
            git push origin refs/tags/v1.0.1
          fi
          test "$(git rev-list -n 1 v1.0.1)" = "${RELEASE_SHA}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: image-tags
        shell: bash
        env:
          SHORT_SHA: ${{ steps.artifact-commit.outputs.short_sha }}
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/marzban-v1:v1.0.1"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/marzban-v1:latest"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/marzban-v1:sha-${SHORT_SHA}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push v1.0.1 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}

      - name: Verify published image
        run: docker buildx imagetools inspect ghcr.io/${GITHUB_REPOSITORY_OWNER}/marzban-v1:v1.0.1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh release create v1.0.1 \
            --title "Marzban v1.0.1" \
            --generate-notes \
            --verify-tag
