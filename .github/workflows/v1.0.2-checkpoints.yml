name: V1.0.2 Checkpoints

on:
  push:
    branches:
      - release/v1.0.2

permissions:
  contents: read

concurrency:
  group: v1.0.2-checkpoints-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (${{ matrix.mysql-image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql-image:
          - mysql:8.0
          - mysql:26.7.0
    services:
      mysql:
        image: ${{ matrix.mysql-image }}
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: marzban_test
          MYSQL_USER: marzban
          MYSQL_PASSWORD: marzban-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u marzban --password=marzban-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      SQLALCHEMY_DATABASE_URL: mysql+pymysql://marzban:marzban-test-password@127.0.0.1:3306/marzban_test
      TEST_MYSQL_DATABASE_URL: mysql+pymysql://marzban:marzban-test-password@127.0.0.1:3306/marzban_test
      XRAY_JSON: ./xray_config.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest httpx
      - name: Backend regression suite
        run: pytest -q

  dashboard:
    name: dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - working-directory: app/dashboard
        run: npm ci
      - working-directory: app/dashboard
        run: npm run build

  packaging:
    name: installer and compose contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer syntax
        run: bash -n scripts/marzban.sh
      - name: Compose renders with low-memory defaults
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: marzban
          MYSQL_USER: marzban
          MYSQL_PASSWORD: marzban-test-password
        run: |
          docker compose -f docker-compose.yml config > /tmp/compose.yml
          grep -F -- '--innodb-buffer-pool-size=128M' /tmp/compose.yml
          grep -F 'SQLALCHEMY_POOL_SIZE: "5"' /tmp/compose.yml
          if docker compose -f docker-compose.yml config --services | grep -qx phpmyadmin; then
            echo 'phpMyAdmin must not be part of the default service profile' >&2
            exit 1
          fi
          docker compose -f docker-compose.yml --profile tools config --services | grep -qx phpmyadmin
