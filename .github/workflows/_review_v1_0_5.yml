name: Independent v1.0.5 release review

on:
  push:
    branches:
      - release/v1.0.5

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.5
          fetch-depth: 0

      - name: Review release scope and invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --depth=1
          python - <<'PY'
          from pathlib import Path
          import subprocess

          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main...HEAD"], text=True
          ).splitlines())
          review_file = ".github/workflows/_review_v1_0_5.yml"
          allowed = {
              "VERSION",
              "app/__init__.py",
              "docker-compose.yml",
              "scripts/marzban.sh",
              "tests/test_release_contract.py",
              "docs/RELEASE_NOTES_v1.0.5.md",
              "app/dashboard/build/index.html",
              "app/dashboard/build/404.html",
              review_file,
          }
          unexpected = sorted(
              p for p in changed
              if p not in allowed and not p.startswith("app/dashboard/build/statics/")
          )
          if unexpected:
              raise SystemExit(f"unexpected release scope: {unexpected}")

          assert Path("VERSION").read_text().strip() == "1.0.5"
          assert '__version__ = "1.0.5"' in Path("app/__init__.py").read_text()
          installer = Path("scripts/marzban.sh").read_text()
          assert 'CLI_RELEASE_VERSION="v1.0.5"' in installer
          assert 'V1_LINEAGE_SOURCE_VERSION="5.2.0"' in installer
          assert 'V1_LINEAGE_SOURCE_IMAGE="ghcr.io/smorad3363/marzban-vnext:v5.2.0"' in installer
          assert 'V1_LINEAGE_TARGET_VERSION="v1.0.0"' in installer
          assert 'requested_version="latest"' in installer
          assert 'latest_published_version()' in installer
          assert 'verify_version_integrity "$requested_version"' in installer
          assert 'ghcr.io/smorad3363/marzban-v1:v1.0.5' in Path("docker-compose.yml").read_text()

          notes = Path("docs/RELEASE_NOTES_v1.0.5.md").read_text()
          assert "marzban update" in notes
          assert "marzban update --version v1.0.5" in notes
          assert "Marzban-v1/v1.0.5/scripts/marzban.sh" in notes

          forbidden_prefixes = (
              "app/routers/", "app/db/", "app/models/", "app/utils/",
              "alembic/", "node_runtime/"
          )
          for path in changed:
              if path.startswith(forbidden_prefixes):
                  raise SystemExit(f"backend/network architecture changed in release prep: {path}")

          print("independent v1.0.5 scope review: PASS")
          PY
          bash -n scripts/marzban.sh
          git diff --check origin/main...HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Verify dashboard source build parity
        working-directory: app/dashboard
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run test:admin-ux
          rm -rf /tmp/v105-dashboard
          VITE_BASE_API=/api/ npm run build -- --outDir /tmp/v105-dashboard --assetsDir statics
          diff -qr build /tmp/v105-dashboard

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify release contract independently
        run: |
          python -m pip install -r requirements.txt pytest >/dev/null
          python -m pytest -q tests/test_release_contract.py
