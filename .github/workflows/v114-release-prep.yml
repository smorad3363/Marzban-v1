name: Prepare v1.1.4 release

on:
  push:
    branches:
      - release/v1.1.4

permissions:
  contents: write

jobs:
  prepare-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.4
      - name: Apply release surfaces
        run: bash scripts/.v114-release-prep.sh
