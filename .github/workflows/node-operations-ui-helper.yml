        run: |
          test -f app/dashboard/build/index.html
          test -f app/dashboard/build/404.html
          git diff --check
          git status --short
      - name: Commit generated source and build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/src/components/NodesManagementWorkspace.tsx \
                  app/dashboard/src/components/Header.tsx \
                  app/dashboard/src/components/AppShell.tsx \
                  app/dashboard/scripts/test-stage1-ui-contracts.cjs \
                  docs/CODEX/STATE.md \
                  app/dashboard/build
          git diff --cached --check
          git commit -m "feat: unify Node Operations workspace"
          git push
