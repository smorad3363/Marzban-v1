name: Apply V1.0.2 Node IP Policy Patch

on:
  push:
    branches:
      - release/v1.0.2
    paths:
      - .github/workflows/apply-v102-node-ip-policy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply context-checked patch
        run: |
          set -Eeuo pipefail
          python .github/scripts/apply_v102_node_ip_policy.py
          python -m compileall -q app/models app/db
          git diff --check
          git status --short
      - name: Commit patch
        run: |
          set -Eeuo pipefail
          git config user.name "Eliot"
          git config user.email "42266703+smorad3363@users.noreply.github.com"
          git add app/dashboard/src/components/NodesModal.tsx \
            app/dashboard/public/statics/locales/fa.json
          git diff --cached --check
          git commit -m "fix: preserve locale and textarea escapes in node IP policy"
          git push origin HEAD:release/v1.0.2

