name: Create v1.0.8 tag once

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create immutable v1.0.8 tag on clean product commit
        shell: bash
        run: |
          set -Eeuo pipefail
          target="26c71e6b08aa5cdeee3128e1e88b510fd7b494a6"
          test "$(git show "${target}:VERSION")" = "1.0.8"
          if git rev-parse -q --verify refs/tags/v1.0.8 >/dev/null; then
            echo "v1.0.8 already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v1.0.8 "${target}" -m "Marzban v1.0.8"
          git push origin refs/tags/v1.0.8
