name: Build v1.1.2 dashboard artifacts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-v1.1.2-dashboard
  cancel-in-progress: false

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci
      - name: Build dashboard
        working-directory: app/dashboard
        run: VITE_BASE_API=/api/ npm run build
      - name: Refresh committed dashboard build
        shell: bash
        run: |
          set -Eeuo pipefail
          cp app/dashboard/build/index.html app/dashboard/build/404.html
          if git diff --quiet -- app/dashboard/build; then
            echo "Dashboard build is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/build
          git commit -m "chore: refresh v1.1.2 dashboard build"
          git push origin HEAD:release/v1.1.2
