name: Build v1.1.2 dashboard artifacts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-v1.1.2-dashboard
  cancel-in-progress: false

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.2
      - name: Prepare v1.1.2 version surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          version = "1.1.2"
          tag = f"v{version}"

          Path("VERSION").write_text(version + "\n", encoding="utf-8")

          app = Path("app/__init__.py")
          text = app.read_text(encoding="utf-8").replace('__version__ = "1.1.1"', f'__version__ = "{version}"')
          if f'__version__ = "{version}"' not in text:
              raise SystemExit("app version surface was not updated")
          app.write_text(text, encoding="utf-8")

          cli = Path("scripts/marzban.sh")
          text = cli.read_text(encoding="utf-8").replace('CLI_RELEASE_VERSION="v1.1.1"', f'CLI_RELEASE_VERSION="{tag}"')
          if f'CLI_RELEASE_VERSION="{tag}"' not in text:
              raise SystemExit("CLI release surface was not updated")
          cli.write_text(text, encoding="utf-8")

          compose = Path("docker-compose.yml")
          text = compose.read_text(encoding="utf-8").replace("ghcr.io/smorad3363/marzban-v1:v1.1.1", f"ghcr.io/smorad3363/marzban-v1:{tag}")
          if f"ghcr.io/smorad3363/marzban-v1:{tag}" not in text:
              raise SystemExit("compose release surface was not updated")
          compose.write_text(text, encoding="utf-8")

          state = Path("docs/CODEX/STATE.md")
          current = state.read_text(encoding="utf-8")
          marker = "## V1.1.2 Active Checkpoint"
          if marker not in current:
              prefix = "# V1 Continuation State\n\n" + marker + "\n\n- Release branch: `release/v1.1.2`\n- Pull request: `#32` into `main`\n- Target version: `v1.1.2`\n- Fixes committed: USER_CREDIT Admin-form crash, route render/service error separation, logout cache/history cleanup.\n- Regression coverage: Plan/manual creation modes and Admin deletion strategy.\n- Dashboard build is regenerated from source with Node.js 20 before merge.\n- NEXT EXACT TASK: remove the temporary artifact-builder workflow after the final v1.1.2 build commit, then require clean PR CI before merge/tag publication.\n\n"
              state.write_text(prefix + current.split("\n", 1)[1], encoding="utf-8")
          PY
          test -s docs/RELEASE_NOTES_v1.1.2.md
          grep -Fq 'marzban update --version v1.1.2' docs/RELEASE_NOTES_v1.1.2.md
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci
      - name: Verify v1.1.2 dashboard regressions
        working-directory: app/dashboard
        run: npm run test:v1.1.2
      - name: Build dashboard
        working-directory: app/dashboard
        run: VITE_BASE_API=/api/ npm run build
      - name: Commit v1.1.2 version surfaces and dashboard build
        shell: bash
        run: |
          set -Eeuo pipefail
          cp app/dashboard/build/index.html app/dashboard/build/404.html
          if git diff --quiet; then
            echo "v1.1.2 version surfaces and dashboard build are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION app/__init__.py scripts/marzban.sh docker-compose.yml docs/CODEX/STATE.md app/dashboard/build
          git commit -m "chore: prepare v1.1.2 release surfaces"
          git push origin HEAD:release/v1.1.2
