name: tmp v1.1.1 release verifier

on:
  push:
    branches:
      - fix/v1.1.1-release-verifier

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.1.1-release-verifier
      - name: Make release verifier DB-independent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/build.yml')
          s = p.read_text()
          old = '''          docker run --rm --platform linux/amd64 --entrypoint /usr/local/bin/python "${image}" \\
            -c "import sys; sys.path.insert(0, '/code'); import app; assert app.__version__ == '${expected_version}', app.__version__"'''
          new = '''          docker run --rm --platform linux/amd64 --entrypoint /usr/local/bin/python "${image}" \\
            -c "from pathlib import Path; image_version=Path('/code/VERSION').read_text().strip(); assert image_version == '${expected_version}', image_version"'''
          if old not in s:
              raise SystemExit('release runtime verifier marker not found')
          p.write_text(s.replace(old, new, 1))

          p = Path('tests/test_release_contract.py')
          s = p.read_text()
          marker = 'assert "docker logout ghcr.io" in build_workflow\n'
          addition = '''assert "docker logout ghcr.io" in build_workflow
          verifier_section = build_workflow.split("- name: Verify published image anonymously and at runtime", 1)[1]
          verifier_section = verifier_section.split("- name: Create immutable GitHub release", 1)[0]
          assert "import app" not in verifier_section
          assert "Path('/code/VERSION').read_text().strip()" in verifier_section
          '''
          if marker not in s:
              raise SystemExit('release contract insertion marker not found')
          p.write_text(s.replace(marker, addition, 1))
          PY
      - name: Verify workflow and release contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile tests/test_release_contract.py
          python -m pytest -q tests/test_release_contract.py
          grep -Fq "Path('/code/VERSION').read_text().strip()" .github/workflows/build.yml
          verifier="$(sed -n '/Verify published image anonymously and at runtime/,/Create immutable GitHub release/p' .github/workflows/build.yml)"
          if grep -Fq 'import app' <<< "$verifier"; then
            echo 'release verifier still imports app' >&2
            exit 1
          fi
      - name: Commit verifier fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/build.yml tests/test_release_contract.py
          git commit -m 'fix(release): verify image version without importing app'
          git push origin HEAD:fix/v1.1.1-release-verifier
