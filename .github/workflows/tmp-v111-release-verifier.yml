name: tmp v1.1.1 release verifier

on:
  push:
    branches:
      - fix/v1.1.1-release-verifier

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.1.1-release-verifier
      - name: Make release verifier DB-independent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/build.yml')
          s = p.read_text()
          old_inner = "import sys; sys.path.insert(0, '/code'); import app; assert app.__version__ == '${expected_version}', app.__version__"
          new_inner = "from pathlib import Path; image_version=Path('/code/VERSION').read_text().strip(); assert image_version == '${expected_version}', image_version"
          if old_inner in s:
              p.write_text(s.replace(old_inner, new_inner, 1))
          elif new_inner not in s:
              raise SystemExit('release runtime verifier marker not found')

          p = Path('tests/test_release_contract.py')
          s = p.read_text()
          contract_marker = 'verifier_section = build_workflow.split("- name: Verify published image anonymously and at runtime", 1)[1]'
          if contract_marker not in s:
              marker = '    assert "--generate-notes" not in build_workflow\n'
              addition = (
                  '    assert "--generate-notes" not in build_workflow\n'
                  '\n'
                  '    verifier_section = build_workflow.split("- name: Verify published image anonymously and at runtime", 1)[1]\n'
                  '    verifier_section = verifier_section.split("- name: Create immutable GitHub release", 1)[0]\n'
                  '    assert "import app" not in verifier_section\n'
                  '    assert "Path(\'/code/VERSION\').read_text().strip()" in verifier_section\n'
              )
              if marker not in s:
                  raise SystemExit('release contract insertion marker not found')
              p.write_text(s.replace(marker, addition, 1))
          PY
      - name: Verify workflow and release contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m py_compile tests/test_release_contract.py
          python -m pytest -q tests/test_release_contract.py
          grep -Fq "Path('/code/VERSION').read_text().strip()" .github/workflows/build.yml
          verifier="$(sed -n '/Verify published image anonymously and at runtime/,/Create immutable GitHub release/p' .github/workflows/build.yml)"
          if grep -Fq 'import app' <<< "$verifier"; then
            echo 'release verifier still imports app' >&2
            exit 1
          fi
      - name: Commit verifier fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/build.yml tests/test_release_contract.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix(release): verify image version without importing app'
            git push origin HEAD:fix/v1.1.1-release-verifier
          fi
