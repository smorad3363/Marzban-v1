name: Stage v1.1.5 admin deletion fix

on:
  push:
    branches: [release/v1.1.5]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.5
          fetch-depth: 0

      - name: Patch admin retirement path and regression coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          router = Path('app/routers/admin.py')
          text = router.read_text()
          old = '''    settings = db.get(MarzhelpAdminSettings, dbadmin.id)\n    if settings and (\n        int(settings.delegated_traffic or 0) > 0\n        or int(settings.total_traffic or 0) > 0\n        or int(settings.money_balance_toman or 0) != 0\n        or admin_hierarchy.own_credit_spend(db, settings) > 0\n    ):\n        raise HTTPException(\n            status_code=409,\n            detail={\n                "code": "admin_delete_credit_unsettled",\n                "message_fa": "اعتبار یا تعهد مالی این ادمین هنوز تسویه نشده است.",\n            },\n        )\n'''
          new = '''    # Financial and traffic counters are not a retirement blocker. The Admin\n    # identity is tombstoned instead of physically deleted, so immutable ledger,\n    # audit, Plan and allocation history can keep their foreign keys safely.\n    # Active policy rows are removed by crud.remove_admin after the selected user\n    # strategy is applied. This deliberately allows real-world Admins with prior\n    # usage, allocated traffic or wallet history to be retired.\n'''
          if old not in text:
              raise SystemExit('admin financial deletion guard not found')
          router.write_text(text.replace(old, new, 1))

          page = Path('app/dashboard/src/pages/admins/AdminsPage.tsx')
          text = page.read_text()
          old = '                  حذف فیزیکی فقط برای ادمین بدون زیرمجموعه، اعتبار تسویه‌نشده و سابقه حسابداری/Audit ممکن است؛ در غیر این صورت دلیل دقیق نمایش داده می‌شود و باید حساب را تعلیق یا غیرفعال کنید.\n'
          new = '                  حذف ادمین به‌صورت امن با بازنشسته‌سازی حساب انجام می‌شود؛ سابقه حسابداری و Audit حفظ می‌شود و مانده اعتبار یا ترافیک مانع حذف نیست. فقط ادمین دارای زیرمجموعه فعال باید ابتدا زیرمجموعه‌هایش را مدیریت کند.\n'
          if old not in text:
              raise SystemExit('admin deletion help text not found')
          page.write_text(text.replace(old, new, 1))

          Path('tests/test_v115_admin_deletion.py').write_text(r'''from sqlalchemy import create_engine
from sqlalchemy.orm import sessionmaker
from starlette.requests import Request

from app.db import crud
from app.db.base import Base
from app.db.models import Admin as DBAdmin, MarzhelpAdminSettings
from app.models.admin import Admin as APIAdmin, AdminCreate, AdminDeleteRequest, MarzhelpAdminPolicy
from app.routers import admin as admin_router


def test_delete_route_retires_admin_with_nonzero_accounting_state(tmp_path, monkeypatch):
    engine = create_engine(f"sqlite:///{tmp_path / 'v115-admin-delete.sqlite3'}")
    Base.metadata.create_all(engine)
    db = sessionmaker(bind=engine, expire_on_commit=False)()
    try:
        actor = crud.create_admin(
            db,
            AdminCreate(username="owner-delete-test", password="secret", is_sudo=True),
        )
        target = crud.create_admin(
            db,
            AdminCreate(username="retire-with-credit", password="secret", is_sudo=False),
        )
        settings = crud.upsert_marzhelp_admin_policy(
            db,
            target.id,
            MarzhelpAdminPolicy(
                total_traffic=100 * 1024**3,
                calculate_volume="created_traffic",
            ),
        )
        settings.used_traffic = 40 * 1024**3
        settings.delegated_traffic = 5 * 1024**3
        settings.money_balance_toman = 250_000
        db.commit()

        # Keep this regression focused on the retirement path. Scope/role behavior
        # has separate coverage; the old bug was the financial 409 before crud.remove_admin.
        monkeypatch.setattr(admin_router.admin_hierarchy, "admin_in_scope", lambda *_args, **_kwargs: True)
        monkeypatch.setattr(admin_router.admin_hierarchy, "role_code", lambda *_args, **_kwargs: "ADMIN")
        monkeypatch.setattr(admin_router.AuditLogService, "log", lambda *_args, **_kwargs: None)
        monkeypatch.setattr(admin_router.xray.config, "include_db_users", lambda: {})

        class _Core:
            started = False

        monkeypatch.setattr(admin_router.xray, "core", _Core())
        monkeypatch.setattr(admin_router.xray, "nodes", {})

        request = Request(
            {
                "type": "http",
                "method": "DELETE",
                "path": "/api/admin/retire-with-credit",
                "headers": [],
                "query_string": b"",
                "server": ("testserver", 80),
                "client": ("testclient", 1234),
                "scheme": "http",
            }
        )
        response = admin_router.remove_admin(
            request=request,
            values=AdminDeleteRequest(strategy="keep_users"),
            dbadmin=target,
            db=db,
            current_admin=APIAdmin.model_validate(actor),
        )

        assert response == {"detail": "Admin removed successfully"}
        assert crud.get_admin(db, "retire-with-credit") is None
        tombstone = db.query(DBAdmin).filter(DBAdmin.username == "retire-with-credit").one()
        assert tombstone.deleted_at is not None
        assert tombstone.hashed_password == ""
        assert db.get(MarzhelpAdminSettings, tombstone.id) is None
    finally:
        db.close()
        engine.dispose()


def test_delete_route_keeps_only_structural_blockers():
    source = __import__("inspect").getsource(admin_router.remove_admin)
    assert "admin_delete_credit_unsettled" not in source
    assert "money_balance_toman" not in source
    assert "own_credit_spend" not in source
    assert "admin_delete_has_children" in source
''')
          PY

      - name: Validate focused regression
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q tests/test_v113_admin_retirement.py tests/test_v115_admin_deletion.py

      - name: Commit fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routers/admin.py app/dashboard/src/pages/admins/AdminsPage.tsx tests/test_v115_admin_deletion.py
          git diff --cached --check
          git commit -m "fix: retire admins with accounting history"
          git push origin HEAD:release/v1.1.5
