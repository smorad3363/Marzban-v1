# armed
name: Temporary v1.1.5 release prep

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v115-release-prep.yml'

permissions:
  contents: write

jobs:
  prepare-v115:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.5
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - name: Patch CLI release version
        shell: bash
        run: |
          set -Eeuo pipefail
          python -c 'from pathlib import Path; p=Path("scripts/marzban.sh"); s=p.read_text(); old="CLI_RELEASE_VERSION=\"v1.1.4\""; new="CLI_RELEASE_VERSION=\"v1.1.5\""; assert old in s, "old CLI release version not found"; p.write_text(s.replace(old,new,1))'
          grep -F 'CLI_RELEASE_VERSION="v1.1.5"' scripts/marzban.sh
          test "$(cat VERSION)" = "1.1.5"
          grep -F '__version__ = "1.1.5"' app/__init__.py
          grep -F 'ghcr.io/smorad3363/marzban-v1:v1.1.5' docker-compose.yml
          test -f docs/RELEASE_NOTES_v1.1.5.md
      - name: Rebuild dashboard
        working-directory: app/dashboard
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run build
      - name: Commit release prep
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/marzban.sh app/dashboard/build
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "chore: finalize v1.1.5 release surfaces"
            git push origin HEAD:release/v1.1.5
          fi
