name: Verify v1.0.7 integration r3

on:
  push:
    branches: [release/v1.0.7-integration]
    paths: [.github/workflows/v107-verify-r3.yml]

permissions:
  contents: write
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.7-integration
          fetch-depth: 0

      - name: Apply release-gate corrections
        run: python .github/scripts/fix_v107_backend_contracts.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest httpx

      - name: Run focused release and node policy tests
        run: |
          set -Eeuo pipefail
          python -m pytest -q \
            tests/test_release_contract.py \
            tests/test_v102_node_ip_policy.py \
            tests/test_access_group_admin_permissions_contract.py

      - name: Recheck dashboard contracts and production build
        shell: bash
        run: |
          set -Eeuo pipefail
          cd app/dashboard
          npm ci
          node scripts/test-access-groups.cjs
          node scripts/test-admin-ux.cjs
          node scripts/test-v106-ui.cjs
          node scripts/test-v107-ui.cjs
          npm run build
          cd ../..
          git diff --check

      - name: Commit corrected v1.0.7 product tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RELEASE_NOTES_v1.0.7.md tests/test_v102_node_ip_policy.py app/dashboard/build
          git diff --cached --quiet && { echo "No corrections staged"; exit 1; }
          git commit -m "fix: preserve node IP policy in redesigned workspace"
          git push origin HEAD:release/v1.0.7-integration
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch official compatibility suite
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh workflow run build.yml \
            --ref release/v1.0.7-integration \
            -f git_ref=release/v1.0.7-integration \
            -f image_tag=v1.0.7 \
            -f tests_only=true
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --workflow build.yml --branch release/v1.0.7-integration --event workflow_dispatch --limit 10 --json databaseId,headSha --jq '.[] | select(.headSha == env.PRODUCT_SHA) | .databaseId' | head -1)"
            if [ -n "$run_id" ]; then
              echo "OFFICIAL_RUN_ID=$run_id" >> "$GITHUB_ENV"
              echo "Official compatibility run: $run_id"
              exit 0
            fi
            sleep 2
          done
          echo "Could not resolve official compatibility run" >&2
          exit 1

      - name: Wait for official compatibility suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch "$OFFICIAL_RUN_ID" --exit-status
