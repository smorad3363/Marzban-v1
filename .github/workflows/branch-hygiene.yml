name: Branch Hygiene

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-merged-head:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged repository branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          case "${HEAD_REF}" in
            main|release/v1.0.9-candidate)
              echo "Preserving ${HEAD_REF}"
              exit 0
              ;;
          esac
          encoded_ref="$(python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["HEAD_REF"], safe=""))')"
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_ref}"

  cleanup-known-superseded:
    if: >-
      github.event_name == 'push' &&
      contains(github.event.head_commit.message, 'lock final pre-v1.0.9 release gates')
    runs-on: ubuntu-latest
    steps:
      - name: Delete adjudicated superseded branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          branches=(
            'stage10-release-candidate-audit'
            'release/v1.0.4'
            'release/v1.0.5'
            'release/v1.0.6-integration'
            'hotfix/v1.0.3-interactive-node-cert'
          )
          for branch in "${branches[@]}"; do
            encoded_ref="$(BRANCH="${branch}" python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["BRANCH"], safe=""))')"
            if gh api "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded_ref}" >/dev/null 2>&1; then
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded_ref}"
              echo "Deleted ${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done
