name: Isolated Node Doctor Builder

on:
  push:
    branches:
      - codex/node-doctor-build

permissions:
  contents: write

jobs:
  build-doctor:
    if: ${{ github.event.head_commit.message == 'ci: add isolated Node doctor builder' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pytest PyYAML
      - name: Apply Node doctor product patch
        run: python scripts/node_doctor_patch.py
      - name: Verify installer and Node doctor contracts
        run: |
          set -Eeuo pipefail
          bash -n scripts/marzban.sh
          bash tests/test_installer_v1_contract.sh
          python -m pytest -q tests/test_node_deployment_contract.py tests/test_release_contract.py
          git diff --check
      - name: Commit verified product files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/marzban.sh tests/test_node_deployment_contract.py docs/NODE_OPERATIONS_V2_FA.md
          git diff --cached --check
          git commit -m "feat: add Node installer doctor diagnostics"
          git push
