name: Publish v1.1.3

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  publish-v113:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      RELEASE_SHA: 45ed74b7de3f3c06be0e5000b372856a5d87544c
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify immutable release source
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor "${RELEASE_SHA}" HEAD
          test "$(git show "${RELEASE_SHA}:VERSION" | tr -d '[:space:]')" = "1.1.3"
          test "$(git show "${RELEASE_SHA}:app/__init__.py" | grep -c '__version__ = "1.1.3"')" = "1"
          git show "${RELEASE_SHA}:scripts/marzban.sh" | grep -Fx 'CLI_RELEASE_VERSION="v1.1.3"'
          git show "${RELEASE_SHA}:docker-compose.yml" | grep -Fq 'ghcr.io/smorad3363/marzban-v1:v1.1.3'
          git cat-file -e "${RELEASE_SHA}:docs/RELEASE_NOTES_v1.1.3.md"

      - name: Create immutable tag
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin --tags
          if git rev-parse v1.1.3 >/dev/null 2>&1; then
            test "$(git rev-list -n 1 v1.1.3)" = "${RELEASE_SHA}"
          else
            git tag v1.1.3 "${RELEASE_SHA}"
            git push origin refs/tags/v1.1.3
          fi

      - name: Dispatch canonical Release workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          gh workflow run build.yml --ref main -f git_ref=v1.1.3 -f image_tag=v1.1.3 -f tests_only=false
