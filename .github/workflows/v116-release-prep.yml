name: Temporary v1.1.6 release prep

on:
  push:
    branches:
      - release/v1.1.6
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-prep:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.1.6
          fetch-depth: 0

      - name: Apply release prep
        run: python scripts/v116_release_prep.py

      - name: Verify release surfaces
        run: |
          test "$(cat VERSION)" = "1.1.6"
          grep -F '__version__ = "1.1.6"' app/__init__.py
          grep -F 'CLI_RELEASE_VERSION="v1.1.6"' scripts/marzban.sh
          grep -F 'ghcr.io/smorad3363/marzban-v1:v1.1.6' docker-compose.yml
          test -f docs/RELEASE_NOTES_v1.1.6.md

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci

      - name: Verify Stage 1 contracts
        working-directory: app/dashboard
        run: node scripts/test-stage1-ui-contracts.cjs

      - name: Build canonical dashboard
        working-directory: app/dashboard
        run: VITE_BASE_API=/api/ npm run build

      - name: Remove temporary release-prep helpers
        run: rm -f scripts/v116_release_prep.py .github/workflows/v116-release-prep.yml

      - name: Commit release prep
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare v1.1.6 release"
          git push origin HEAD:release/v1.1.6
