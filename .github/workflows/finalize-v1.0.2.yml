name: Finalize verified V1.0.2 publication

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
    branches:
      - main

permissions:
  actions: write
  contents: write
  packages: read

concurrency:
  group: finalize-v1.0.2-publication
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RELEASE_TAG: v1.0.2
      SOURCE_COMMIT: 789d1a41faf39b7b4487845d12c394fa5c097e5f
      SOURCE_RELEASE_RUN: '34045524159'
      IMAGE: ghcr.io/smorad3363/marzban-v1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 0

      - name: Verify immutable reviewed source and prior main CI
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(tr -d '[:space:]' < VERSION)" = '1.0.2'
          grep -Fx '__version__ = "1.0.2"' app/__init__.py
          grep -Fx 'CLI_RELEASE_VERSION="v1.0.2"' scripts/marzban.sh
          grep -Fq 'ghcr.io/smorad3363/marzban-v1:v1.0.2' docker-compose.yml
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RELEASE_RUN}" --jq .head_sha)" = "$SOURCE_COMMIT"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RELEASE_RUN}" --jq .conclusion)" = success
          test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RELEASE_RUN}" --jq .head_branch)" = main
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} already exists; refusing to republish." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} release already exists; refusing to republish." >&2
            exit 1
          fi

      - name: Dispatch reviewed image publisher and wait
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          before="$(gh run list --workflow release-v1.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run release-v1.yml --ref main -f git_ref="$SOURCE_COMMIT" -f image_tag="$RELEASE_TAG"
          run_id=''
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --workflow release-v1.yml --event workflow_dispatch --limit 30 --json databaseId,headSha --jq "map(select(.headSha == \"$(git ls-remote origin refs/heads/main | awk '{print $1}')\" and .databaseId > ${before})) | sort_by(.databaseId) | last | .databaseId // empty")"
            if [[ -n "$run_id" ]]; then break; fi
            sleep 2
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --exit-status

      - name: Resolve published immutable digest
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          token="$(curl -fsSL 'https://ghcr.io/token?scope=repository%3Asmorad3363%2Fmarzban-v1%3Apull&service=ghcr.io' | jq -r .token)"
          test -n "$token"
          headers="$(mktemp)"
          curl -fsSI \
            -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/smorad3363/marzban-v1/manifests/${RELEASE_TAG}" > "$headers"
          digest="$(awk 'tolower($1)=="docker-content-digest:" {gsub("\r", "", $2); print $2}' "$headers")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published digest: $digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch image verifier and release creator and wait
        id: verify
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          before="$(gh run list --workflow verify-v1-image.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run verify-v1-image.yml --ref main \
            -f digest="$DIGEST" \
            -f source_commit="$SOURCE_COMMIT" \
            -f release_tag="$RELEASE_TAG"
          run_id=''
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --workflow verify-v1-image.yml --event workflow_dispatch --limit 30 --json databaseId --jq "map(select(.databaseId > ${before})) | sort_by(.databaseId) | last | .databaseId // empty")"
            if [[ -n "$run_id" ]]; then break; fi
            sleep 2
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --exit-status

      - name: Dispatch published installer and mature-upgrade validation and wait
        id: validate
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          before="$(gh run list --workflow validate-v1-installer.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run validate-v1-installer.yml --ref main \
            -f digest="$DIGEST" \
            -f source_commit="$SOURCE_COMMIT" \
            -f release_tag="$RELEASE_TAG"
          run_id=''
          for attempt in $(seq 1 60); do
            run_id="$(gh run list --workflow validate-v1-installer.yml --event workflow_dispatch --limit 30 --json databaseId --jq "map(select(.databaseId > ${before})) | sort_by(.databaseId) | last | .databaseId // empty")"
            if [[ -n "$run_id" ]]; then break; fi
            sleep 2
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --exit-status

      - name: Verify final public release contract
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          tag_commit="$(git ls-remote origin "refs/tags/${RELEASE_TAG}^{}" | awk '{print $1}')"
          test "$tag_commit" = "$SOURCE_COMMIT"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" = false
          test "$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)" != ''
          {
            echo "### V1.0.2 publication complete"
            echo "- Source: $SOURCE_COMMIT"
            echo "- Digest: $DIGEST"
            echo "- Publish run: ${{ steps.publish.outputs.run_id }}"
            echo "- Verify run: ${{ steps.verify.outputs.run_id }}"
            echo "- Installer/upgrade validation run: ${{ steps.validate.outputs.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
