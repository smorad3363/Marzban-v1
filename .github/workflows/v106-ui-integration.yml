name: Verify v1.0.6 UI integration

on:
  push:
    branches:
      - release/v1.0.6-integration
    paths:
      - .github/workflows/v106-ui-integration.yml

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.6-integration
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Apply integration patch
        run: python .github/scripts/v106_ui_patch.py

      - name: Compile backend sources
        run: python -m compileall -q app

      - name: Install focused test runner
        run: python -m pip install -q pytest

      - name: Verify Access Group permission contract
        run: python -m pytest -q tests/test_access_group_admin_permissions_contract.py

      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci

      - name: Run dashboard contract checks
        working-directory: app/dashboard
        run: |
          node scripts/test-access-groups.cjs
          node scripts/test-admin-ux.cjs

      - name: Build dashboard
        working-directory: app/dashboard
        env:
          VITE_BASE_API: /api/
        run: |
          rm -rf build
          npm run build --if-present -- --outDir build --assetsDir statics
          test -s build/index.html
          test -s build/404.html

      - name: Commit verified integration
        run: |
          set -euo pipefail
          git rm .github/workflows/v106-ui-integration.yml .github/scripts/v106_ui_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat: unify v1.0.6 access groups and dashboard UX"
          git push origin HEAD:release/v1.0.6-integration
