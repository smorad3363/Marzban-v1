name: tmp v1.1.1 release prep

on:
  push:
    branches:
      - release/v1.1.1-prep

permissions:
  contents: write

jobs:
  prepare-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.1-prep
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - name: Prepare v1.1.1 version surfaces and notes
        shell: bash
        run: |
          set -Eeuo pipefail
          printf '1.1.1\n' > VERSION
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'app/__init__.py': ('__version__ = "1.1.0"', '__version__ = "1.1.1"'),
              'scripts/marzban.sh': ('CLI_RELEASE_VERSION="v1.1.0"', 'CLI_RELEASE_VERSION="v1.1.1"'),
              'docker-compose.yml': ('ghcr.io/smorad3363/marzban-v1:v1.1.0', 'ghcr.io/smorad3363/marzban-v1:v1.1.1'),
          }
          for name, (old, new) in replacements.items():
              p = Path(name)
              s = p.read_text()
              if old in s:
                  p.write_text(s.replace(old, new, 1))
              elif new not in s:
                  raise SystemExit(f'missing version marker in {name}')
          PY
          printf '%s' '' | base64 -d > docs/RELEASE_NOTES_v1.1.1.md
          python - <<'PY'
          from base64 import b64decode
          from pathlib import Path
          p = Path('RELEASES.md')
          s = p.read_text(encoding='utf-8')
          start = s.index('## Release target: v1.1.0') if '## Release target: v1.1.0' in s else s.index('## Release target: v1.1.1')
          end = s.index('## Release process')
          target = b64decode('').decode()
          p.write_text(s[:start] + target + s[end:], encoding='utf-8')
          PY
      - name: Verify version and release contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -q pytest
          python -m pytest -q tests/test_release_contract.py
          test "$(tr -d '[:space:]' < VERSION)" = "1.1.1"
          grep -Fx '__version__ = "1.1.1"' app/__init__.py
          grep -Fx 'CLI_RELEASE_VERSION="v1.1.1"' scripts/marzban.sh
          grep -Fq 'ghcr.io/smorad3363/marzban-v1:v1.1.1' docker-compose.yml
          test -s docs/RELEASE_NOTES_v1.1.1.md
          grep -Fq 'Release target: v1.1.1' RELEASES.md
          bash -n scripts/marzban.sh
          git diff --check
      - name: Build Dashboard from v1.1.1 source
        working-directory: app/dashboard
        run: |
          npm ci
          node scripts/test-stage1-ui-contracts.cjs
          VITE_BASE_API=/api/ npm run build
      - name: Commit tested release preparation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VERSION app/__init__.py scripts/marzban.sh docker-compose.yml RELEASES.md docs/RELEASE_NOTES_v1.1.1.md app/dashboard/build
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'chore(release): prepare v1.1.1 version surfaces and notes'
            git push origin HEAD:release/v1.1.1-prep
          fi
