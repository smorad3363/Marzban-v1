name: Apply Access Group admin permissions

on:
  push:
    branches:
      - fix/access-group-admin-permissions

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/access-group-admin-permissions
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Apply exact patch
        run: python .github/scripts/apply_access_group_admin_permissions.py

      - name: Compile Python sources
        run: python -m compileall -q app

      - name: Run backend permission contract tests
        run: python -m pytest -q tests/test_access_group_admin_permissions_contract.py

      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci

      - name: Run Access Group UI contract tests
        working-directory: app/dashboard
        run: npm run test:access-groups

      - name: Build dashboard
        working-directory: app/dashboard
        run: npm run build

      - name: Commit verified patch and remove temporary patch workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/apply_access_group_admin_permissions.py
          rm -f .github/workflows/apply-access-group-admin-permissions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce Access Group admin permissions"
          git push origin HEAD:fix/access-group-admin-permissions
