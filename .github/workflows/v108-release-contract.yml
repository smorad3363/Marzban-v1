name: Verify v1.0.8 release metadata

on:
  push:
    branches:
      - release/v1.0.8-integration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.8-integration
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply release metadata fix
        run: python .github/scripts/finalize_v108_release.py

      - name: Verify version surfaces
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(cat VERSION)" = "1.0.8"
          grep -Fq '__version__ = "1.0.8"' app/__init__.py
          grep -Fq 'CLI_RELEASE_VERSION="v1.0.8"' scripts/marzban.sh
          grep -Fq 'ghcr.io/smorad3363/marzban-v1:v1.0.8' docker-compose.yml
          test -s docs/RELEASE_NOTES_v1.0.8.md
          ! grep -Fq '__version__ = "1.0.7"' app/__init__.py
          ! grep -Fq 'CLI_RELEASE_VERSION="v1.0.7"' scripts/marzban.sh
          git diff --check

      - name: Install focused test dependencies
        run: python -m pip install pytest

      - name: Run release contract
        run: python -m pytest -q tests/test_release_contract.py

      - name: Compile application entrypoint
        run: python -m py_compile app/__init__.py

      - name: Commit verified release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/__init__.py scripts/marzban.sh tests/test_release_contract.py docs/RELEASE_NOTES_v1.0.8.md
          git diff --cached --check
          git commit -m "chore(release): finalize v1.0.8 metadata"
          git push origin HEAD:release/v1.0.8-integration
