name: Fix v1.1.8 dashboard once

on:
  push:
    branches:
      - feat/dashboard-owner-admin-v2
    paths:
      - .github/workflows/fix-dashboard-v118-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dashboard-owner-admin-v2
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Apply reviewed source fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard = Path("app/dashboard/src/components/DashboardOverview.tsx")
          text = dashboard.read_text(encoding="utf-8")
          old = '<Stack spacing={4} dir="rtl">'
          new = '<Stack spacing={4} dir="rtl" aria-live="polite">'
          assert text.count(old) == 1, "Dashboard root marker changed"
          dashboard.write_text(text.replace(old, new, 1), encoding="utf-8")

          system = Path("app/routers/system.py")
          text = system.read_text(encoding="utf-8")
          old = '''def host_update_impact(
              modified_hosts: Dict[str, List[ProxyHost]],
              db: Session = Depends(get_db), admin: Admin = Depends(Admin.check_sudo_admin),
          ):
              """Preview Access Group and active-User impact without mutating data."""
              for inbound_tag in modified_hosts:
                  if inbound_tag not in xray.config.inbounds_by_tag:
                      raise HTTPException(status_code=400, detail=f"Inbound {inbound_tag} doesn't exist")
              impact = analyze_host_update(db, modified_hosts)
              if impact.invalid_access_group_ids:
                  raise HTTPException(status_code=409, detail={"error_code": "host_change_would_invalidate_access_group", "message": "این تغییر حداقل یک Access Group را بدون Host معتبر باقی می‌گذارد.", "impact": impact.model_dump()})
              return impact
          '''
          new = '''def host_update_impact(
              modified_hosts: Dict[str, List[ProxyHost]],
              db: Session = Depends(get_db),
              admin: Admin = Depends(Admin.check_sudo_admin),
          ):
              """Preview Access Group and active-User impact without mutating data."""
              for inbound_tag in modified_hosts:
                  if inbound_tag not in xray.config.inbounds_by_tag:
                      raise HTTPException(status_code=400, detail=f"Inbound {inbound_tag} doesn't exist")
              return analyze_host_update(db, modified_hosts)
          '''
          assert old in text, "Unexpected host_update_impact body"
          system.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci

      - name: Verify dashboard contracts
        working-directory: app/dashboard
        run: |
          node scripts/test-stage1-ui-contracts.cjs
          node scripts/test-autofill-contract.cjs

      - name: Build dashboard
        working-directory: app/dashboard
        run: VITE_BASE_API=/api/ npm run build

      - name: Commit reviewed fixes and canonical build
        shell: bash
        run: |
          set -Eeuo pipefail
          git add app/routers/system.py app/dashboard/src/components/DashboardOverview.tsx app/dashboard/build
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close v1.1.8 dashboard review findings"
          git push origin HEAD:feat/dashboard-owner-admin-v2
