name: Refresh v1.1.10 Dashboard Once
on:
  push:
    branches:
      - chore/v1.1.10-repository-consolidation
    paths:
      - .github/workflows/refresh-v1.1.10-dashboard-once.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - name: Rebuild dashboard from exact branch sources
        working-directory: app/dashboard
        run: |
          npm ci
          VITE_BASE_API=/api/ npm run build
      - name: Commit refreshed assets only
        shell: bash
        run: |
          set -Eeuo pipefail
          git add app/dashboard/build
          if git diff --cached --quiet; then
            echo "Dashboard build already matches sources"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: refresh v1.1.10 dashboard committed assets'
          git push origin "HEAD:refs/heads/chore/v1.1.10-repository-consolidation"
