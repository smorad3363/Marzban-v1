name: Prepare v1.0.6 release metadata

on:
  push:
    branches:
      - release/v1.0.6-integration
    paths:
      - .github/workflows/v106-release-prep.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.6-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - name: Apply release metadata
        run: python .github/scripts/v106_release_prep.py
      - name: Compile Python
        run: python -m compileall -q app
      - name: Release and Access Group contracts
        run: |
          python -m pip install -q pytest
          python -m pytest -q tests/test_release_contract.py tests/test_access_group_admin_permissions_contract.py
          bash tests/test_installer_v1_contract.sh
      - name: Dashboard dependencies
        working-directory: app/dashboard
        run: npm ci
      - name: Dashboard UX contracts
        working-directory: app/dashboard
        run: |
          node scripts/test-access-groups.cjs
          node scripts/test-admin-ux.cjs
          node scripts/test-v106-ui.cjs
      - name: Build committed dashboard artifact
        working-directory: app/dashboard
        env:
          VITE_BASE_API: /api/
        run: |
          rm -rf build
          npm run build --if-present -- --outDir build --assetsDir statics
          test -s build/index.html
          test -s build/404.html
      - name: Show remaining historical 1.0.5 references
        shell: bash
        run: |
          echo 'Remaining 1.0.5 references (historical references may remain intentionally):'
          grep -RInE 'v?1\.0\.5' . --exclude-dir=.git --exclude-dir=node_modules --exclude='RELEASE_NOTES_v1.0.5.md' || true
      - name: Commit release preparation
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION app/__init__.py scripts/marzban.sh docker-compose.yml tests/test_release_contract.py tests/test_installer_v1_contract.sh README.md README-fa.md docs/RELEASE_NOTES_v1.0.6.md app/dashboard/build
          git diff --cached --stat
          git commit -m "release: prepare Marzban v1.0.6"
          git push origin HEAD:release/v1.0.6-integration
