name: CI Checkpoints

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-checkpoints-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend checkpoints (${{ matrix.mysql-image }})
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql-image:
          - mysql:8.0
          - mysql:26.7.0
    services:
      mysql:
        image: ${{ matrix.mysql-image }}
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: marzban_test
          MYSQL_USER: marzban
          MYSQL_PASSWORD: marzban-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u marzban --password=marzban-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      SQLALCHEMY_DATABASE_URL: mysql+pymysql://marzban:marzban-test-password@127.0.0.1:3306/marzban_test
      TEST_MYSQL_DATABASE_URL: mysql+pymysql://marzban:marzban-test-password@127.0.0.1:3306/marzban_test
      XRAY_JSON: ./xray_config.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest httpx
      - name: Backend regression suite
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --tb=short --disable-warnings \
            --ignore=tests/test_mysql_device_limit_migration.py \
            --ignore=tests/test_mysql_admin_hierarchy_migration.py \
            --ignore=tests/test_mysql_stage8_bulk_jobs.py \
            --ignore=tests/test_mysql_stage9_dashboard.py \
            --ignore=tests/test_mysql_stage10_pagination.py \
            --ignore=tests/test_mysql_stage11_operations.py \
            --deselect=tests/test_stage5_restricted_creation_namespace.py::test_seat_raw_endpoint_is_denied_even_if_creation_mode_is_free_form \
            --deselect='tests/test_stage5_restricted_creation_namespace.py::test_restricted_raw_endpoint_creates_from_simple_fields[USED_TRAFFIC]' \
            --deselect='tests/test_stage5_restricted_creation_namespace.py::test_restricted_raw_endpoint_creates_from_simple_fields[ALLOCATED_TRAFFIC]'
      - name: Verify MySQL migrations and partial-DDL recovery
        run: >-
          python -m pytest -q
          tests/test_mysql_device_limit_migration.py
          tests/test_mysql_admin_hierarchy_migration.py
      - name: Verify Stage 8-11 isolated MySQL evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mysql_container="$(docker ps --filter publish=3306 --format '{{.ID}}' | head -1)"
          test -n "${mysql_container}"

          case "${{ matrix.mysql-image }}" in
            mysql:8.0) expected_mysql_version_prefix="8.0." ;;
            mysql:26.7.0) expected_mysql_version_prefix="26.7." ;;
            *) echo "Unsupported MySQL matrix image: ${{ matrix.mysql-image }}" >&2; exit 1 ;;
          esac

          run_isolated_test() {
            local stage="$1"
            local test_file="$2"
            local database="stage${stage}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_test"
            local database_url="mysql+pymysql://root:root-test-password@127.0.0.1:3306/${database}"
            docker exec -e MYSQL_PWD=root-test-password "${mysql_container}" \
              mysql --user=root --execute \
              "CREATE DATABASE \`${database}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
            SQLALCHEMY_DATABASE_URL="${database_url}" \
              TEST_MYSQL_DATABASE_URL="${database_url}" \
              TEST_MYSQL_VERSION_PREFIX="${expected_mysql_version_prefix}" \
              python -m pytest -q "${test_file}"
          }

          run_isolated_test 8 tests/test_mysql_stage8_bulk_jobs.py
          run_isolated_test 9 tests/test_mysql_stage9_dashboard.py
          run_isolated_test 10 tests/test_mysql_stage10_pagination.py
          run_isolated_test 11 tests/test_mysql_stage11_operations.py
      - name: Verify backup checksum and restore
        shell: bash
        run: |
          set -Eeuo pipefail
          mysql_container="$(docker ps --filter publish=3306 --format '{{.ID}}' | head -1)"
          test -n "${mysql_container}"
          docker exec -e MYSQL_PWD=root-test-password "${mysql_container}" \
            mysqldump --user=root --single-transaction --routines --events --triggers --set-gtid-purged=OFF marzban_test > /tmp/marzban_test.sql
          sha256sum /tmp/marzban_test.sql | tee /tmp/marzban_test.sql.sha256
          test -s /tmp/marzban_test.sql
          docker exec -e MYSQL_PWD=root-test-password "${mysql_container}" mysql --user=root \
            -e "DROP DATABASE IF EXISTS marzban_restore; CREATE DATABASE marzban_restore CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          docker exec -i -e MYSQL_PWD=root-test-password "${mysql_container}" \
            mysql --user=root marzban_restore < /tmp/marzban_test.sql
          source_count="$(docker exec -e MYSQL_PWD=root-test-password "${mysql_container}" mysql --user=root --batch --skip-column-names -e 'SELECT COUNT(*) FROM marzban_test.admins')"
          restore_count="$(docker exec -e MYSQL_PWD=root-test-password "${mysql_container}" mysql --user=root --batch --skip-column-names -e 'SELECT COUNT(*) FROM marzban_restore.admins')"
          test "${source_count}" = "${restore_count}"
      - name: Verify v4.8.0 application rollback compatibility
        run: >-
          docker run --rm
          --add-host host.docker.internal:host-gateway
          --env SQLALCHEMY_DATABASE_URL=mysql+pymysql://marzban:marzban-test-password@host.docker.internal:3306/marzban_test
          --entrypoint python
          ghcr.io/smorad3363/marzban:v4.8.0
          -c "from app.db import engine; connection = engine.connect(); print(connection.exec_driver_sql('SELECT COUNT(*) FROM admins').scalar()); connection.close()"

  dashboard:
    name: dashboard build and parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - working-directory: app/dashboard
        run: npm ci
      - name: Verify Stage 1 UI contracts
        working-directory: app/dashboard
        run: node scripts/test-stage1-ui-contracts.cjs
      - name: Build dashboard from source
        working-directory: app/dashboard
        run: VITE_BASE_API=/api/ npm run build
      - name: Verify dashboard build output
        run: test -f app/dashboard/build/index.html && test -f app/dashboard/build/404.html
      - name: Verify committed dashboard build parity
        run: git diff --exit-code -- app/dashboard/build

  packaging:
    name: installer, panel compose and node contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pytest PyYAML
      - name: Installer syntax and contracts
        run: |
          bash -n scripts/marzban.sh
          bash tests/test_installer_v1_contract.sh
          python -m pytest -q tests/test_node_deployment_contract.py tests/test_release_contract.py
      - name: Panel compose renders with low-memory defaults and SQLAlchemy compatibility
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: marzban
          MYSQL_USER: marzban
          MYSQL_PASSWORD: marzban-test-password
        run: |
          set -Eeuo pipefail
          : > .env
          docker compose -f docker-compose.yml config > /tmp/compose.yml
          grep -F -- '--innodb-buffer-pool-size=128M' /tmp/compose.yml
          grep -F 'SQLALCHEMY_POOL_SIZE: "5"' /tmp/compose.yml
          grep -F 'SQLALCHEMY_MAX_OVERFLOW: "5"' /tmp/compose.yml
          if docker compose -f docker-compose.yml config --services | grep -qx phpmyadmin; then
            echo 'phpMyAdmin must not be part of the default service profile' >&2
            exit 1
          fi
          docker compose -f docker-compose.yml --profile tools config --services | grep -qx phpmyadmin

          SQLIALCHEMY_MAX_OVERFLOW=7 docker compose -f docker-compose.yml config > /tmp/compose-legacy-overflow.yml
          grep -F 'SQLALCHEMY_MAX_OVERFLOW: "7"' /tmp/compose-legacy-overflow.yml
          SQLALCHEMY_MAX_OVERFLOW=11 SQLIALCHEMY_MAX_OVERFLOW=7 \
            docker compose -f docker-compose.yml config > /tmp/compose-current-overflow.yml
          grep -F 'SQLALCHEMY_MAX_OVERFLOW: "11"' /tmp/compose-current-overflow.yml
      - name: Built-in Node compose is isolated and renderable
        shell: bash
        run: |
          set -Eeuo pipefail
          release_version="v$(tr -d '[:space:]' < VERSION)"
          repository="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          export MARZBAN_NODE_IMAGE="ghcr.io/${repository}:${release_version}"
          export NODE_RUNTIME_VERSION="${release_version}"
          docker compose -f docker-compose.node.yml config > /tmp/node-compose.yml
          test "$(docker compose -f docker-compose.node.yml config --services)" = "marzban-node"
          grep -F "image: ghcr.io/${repository}:${release_version}" /tmp/node-compose.yml
          grep -F 'node_runtime.main' docker-compose.node.yml
          grep -F 'SSL_CLIENT_CERT_FILE: /var/lib/marzban-node/panel-client.crt' /tmp/node-compose.yml
          if grep -Eiq 'mysql|sqlalchemy' /tmp/node-compose.yml; then
            echo 'Node compose unexpectedly contains database configuration' >&2
            exit 1
          fi
      - name: Verify 8.0 logical dump and 26.7.0 restore
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          source_volume="marzban-mysql-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          target_volume="marzban-mysql-target-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_name="marzban-mysql-upgrade"
          cleanup() {
            docker rm --force "${container_name}" >/dev/null 2>&1 || true
            docker volume rm "${source_volume}" "${target_volume}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "${source_volume}" >/dev/null
          docker volume create "${target_volume}" >/dev/null

          start_mysql() {
            local image="$1"
            local volume="$2"
            docker rm --force "${container_name}" >/dev/null 2>&1 || true
            docker run --detach --name "${container_name}" \
              --env MYSQL_ROOT_PASSWORD=root-test-password \
              --env MYSQL_DATABASE=marzban \
              --volume "${volume}:/var/lib/mysql" \
              "${image}" \
              --mysqlx=OFF \
              --bind-address=127.0.0.1 \
              --character_set_server=utf8mb4 \
              --collation_server=utf8mb4_unicode_ci \
              --host-cache-size=0 \
              --innodb-open-files=1024 \
              --innodb-buffer-pool-size=256M \
              --general_log=0 \
              --slow_query_log=1 \
              --slow_query_log_file=/var/lib/mysql/slow.log \
              --long_query_time=2 \
              --skip-log-bin >/dev/null
            for attempt in $(seq 1 120); do
              if docker exec -e MYSQL_PWD=root-test-password "${container_name}" \
                mysql --user=root --host=127.0.0.1 --batch --skip-column-names \
                --execute 'SELECT 1' 2>/dev/null | grep -qx '1'; then
                return 0
              fi
              state="$(docker inspect --format '{{.State.Status}}' "${container_name}" 2>/dev/null || true)"
              if [[ "${state}" == "exited" || "${state}" == "dead" ]]; then
                docker logs "${container_name}"
                return 1
              fi
              sleep 2
            done
            docker logs "${container_name}"
            return 1
          }

          query_mysql() {
            docker exec -e MYSQL_PWD=root-test-password "${container_name}" \
              mysql --user=root --batch --skip-column-names --execute "$1"
          }

          start_mysql mysql:8.0 "${source_volume}"
          query_mysql "CREATE TABLE marzban.upgrade_sentinel (id BIGINT PRIMARY KEY, value VARCHAR(64) NOT NULL); INSERT INTO marzban.upgrade_sentinel VALUES (1, 'preserved-through-upgrade');"
          query_mysql "SELECT VERSION(); SELECT value FROM marzban.upgrade_sentinel WHERE id = 1;"
          docker exec -e MYSQL_PWD=root-test-password "${container_name}" \
            mysqldump --user=root --databases marzban --single-transaction --routines --events --triggers --set-gtid-purged=OFF --hex-blob > /tmp/marzban-migration.sql
          sha256sum /tmp/marzban-migration.sql > /tmp/marzban-migration.sql.sha256
          docker stop --time 60 "${container_name}" >/dev/null
          sha256sum -c /tmp/marzban-migration.sql.sha256
          start_mysql mysql:26.7.0 "${target_volume}"
          docker exec -i -e MYSQL_PWD=root-test-password "${container_name}" mysql --user=root < /tmp/marzban-migration.sql
          version="$(query_mysql 'SELECT VERSION()')"
          value="$(query_mysql 'SELECT value FROM marzban.upgrade_sentinel WHERE id = 1')"
          test "${version}" = "26.7.0"
          test "${value}" = "preserved-through-upgrade"
      - name: Build release image without publishing
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        run: docker build --tag marzban-v1:ci .
      - name: Verify release image runtime contract
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          runtime_version="$(docker run --rm --entrypoint python \
            -e SQLALCHEMY_DATABASE_URL=mysql+pymysql://probe:probe@127.0.0.1/probe \
            marzban-v1:ci -c 'from app import __version__; print(__version__)')"
          test "${runtime_version}" = "${version}"
          docker run --rm --entrypoint mysqldump marzban-v1:ci --version | grep -q 'Ver 26.7.0'
          docker run --rm --entrypoint sh marzban-v1:ci -c \
            'test -s /code/app/dashboard/build/index.html && \
             test -s /code/app/dashboard/build/404.html && \
             test -x /usr/bin/marzban-cli && \
             test -f /code/node_runtime/main.py'
      - name: Verify Panel-to-Node mTLS end-to-end
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        run: bash tests/node_panel_e2e.sh marzban-v1:ci
