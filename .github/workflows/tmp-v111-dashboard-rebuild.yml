name: Temporary v1.1.1 Dashboard Rebuild

on:
  push:
    branches:
      - fix/v1.1.1-users-responsive

permissions:
  contents: write

jobs:
  rebuild-dashboard:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/v1.1.1-users-responsive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci

      - name: Verify responsive Users contract
        working-directory: app/dashboard
        run: node scripts/test-stage1-ui-contracts.cjs

      - name: Build dashboard
        working-directory: app/dashboard
        run: VITE_BASE_API=/api/ npm run build

      - name: Commit generated dashboard build
        shell: bash
        run: |
          set -Eeuo pipefail
          git add app/dashboard/build
          if git diff --cached --quiet; then
            echo "Dashboard build already matches source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(dashboard): rebuild responsive users table"
          git push origin HEAD:fix/v1.1.1-users-responsive
