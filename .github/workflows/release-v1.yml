name: Publish reviewed V1
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Exact reviewed commit to publish
        required: true
      image_tag:
        description: Exact release tag (no latest)
        required: true
        default: v1.0.0
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-reviewed-v1
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref }}
      - name: Verify exact release inputs
        env:
          RELEASE_TAG: ${{ inputs.image_tag }}
          REVIEWED_COMMIT: ${{ inputs.git_ref }}
        run: |
          set -eu
          echo "$REVIEWED_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
          test "$(git rev-parse HEAD)" = "$REVIEWED_COMMIT"
          test "$RELEASE_TAG" = "v$(tr -d '[:space:]' < VERSION)"
          test "$RELEASE_TAG" = v1.0.0
          grep -Fx '__version__ = "1.0.0"' app/__init__.py
          grep -Fx 'CLI_RELEASE_VERSION="v1.0.0"' scripts/marzban.sh
          test -s app/dashboard/build/index.html
          test -s app/dashboard/build/404.html
          test -s docs/RELEASE_NOTES_v1.0.0.md
          bash -n scripts/marzban.sh
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo 'Release tag already exists; do not publish another image for it.' >&2
            exit 1
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse overwriting an existing release image
        env:
          IMAGE: ghcr.io/smorad3363/marzban-v1:${{ inputs.image_tag }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo 'Release image already exists; verify its digest instead of overwriting.' >&2
            exit 1
          fi
      - name: Publish immutable release image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/smorad3363/marzban-v1:${{ inputs.image_tag }}
            ghcr.io/smorad3363/marzban-v1:sha-${{ inputs.git_ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/smorad3363/Marzban-v1
            org.opencontainers.image.revision=${{ inputs.git_ref }}
            org.opencontainers.image.version=${{ inputs.image_tag }}
