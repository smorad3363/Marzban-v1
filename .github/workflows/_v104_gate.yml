name: v1.0.4 release gate

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  dashboard-release:
    name: dashboard / release contracts
    if: github.head_ref == 'release/v1.0.4'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci

      - name: Build dashboard independently
        working-directory: app/dashboard
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/v104-dashboard-build
          VITE_BASE_API=/api/ npm run build -- --outDir /tmp/v104-dashboard-build --assetsDir statics
          test -f /tmp/v104-dashboard-build/index.html
          test -f /tmp/v104-dashboard-build/404.html
          diff -qr build /tmp/v104-dashboard-build

      - name: Run dashboard contracts
        working-directory: app/dashboard
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run test:access-groups
          npm run test:admin-hierarchy
          npm run test:admin-ux

      - name: Run release and Node installer contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check pytest >/dev/null
          python -m pytest -q tests/test_release_contract.py tests/test_v102_node_deployment.py
          bash tests/test_installer_v1_contract.sh

  backend:
    name: backend (${{ matrix.mysql-image }})
    if: github.head_ref == 'release/v1.0.4'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql-image:
          - mysql:8.0
          - mysql:26.7.0
    services:
      mysql:
        image: ${{ matrix.mysql-image }}
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: marzban_test
          MYSQL_USER: marzban
          MYSQL_PASSWORD: marzban-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u marzban --password=marzban-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      SQLALCHEMY_DATABASE_URL: mysql+pymysql://marzban:marzban-test-password@127.0.0.1:3306/marzban_test
      TEST_MYSQL_DATABASE_URL: mysql+pymysql://marzban:marzban-test-password@127.0.0.1:3306/marzban_test
      XRAY_JSON: ./xray_config.json
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest httpx

      - name: Run backend regression suite
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pytest -q --tb=short --disable-warnings \
            --ignore=tests/test_mysql_device_limit_migration.py \
            --ignore=tests/test_mysql_admin_hierarchy_migration.py \
            --ignore=tests/test_mysql_stage8_bulk_jobs.py \
            --ignore=tests/test_mysql_stage9_dashboard.py \
            --ignore=tests/test_mysql_stage10_pagination.py \
            --ignore=tests/test_mysql_stage11_operations.py \
            --deselect=tests/test_stage5_restricted_creation_namespace.py::test_seat_raw_endpoint_is_denied_even_if_creation_mode_is_free_form \
            --deselect='tests/test_stage5_restricted_creation_namespace.py::test_restricted_raw_endpoint_creates_from_simple_fields[USED_TRAFFIC]' \
            --deselect='tests/test_stage5_restricted_creation_namespace.py::test_restricted_raw_endpoint_creates_from_simple_fields[ALLOCATED_TRAFFIC]'

      - name: Run migration recovery tests
        run: >-
          python -m pytest -q
          tests/test_mysql_device_limit_migration.py
          tests/test_mysql_admin_hierarchy_migration.py

      - name: Run isolated stage evidence
        if: ${{ matrix.mysql-image == 'mysql:8.0' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mysql_container="$(docker ps --filter publish=3306 --format '{{.ID}}' | head -1)"
          test -n "${mysql_container}"
          run_isolated_test() {
            local stage="$1"
            local test_file="$2"
            local database="v104_stage${stage}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
            local database_url="mysql+pymysql://root:root-test-password@127.0.0.1:3306/${database}"
            docker exec -e MYSQL_PWD=root-test-password "${mysql_container}" mysql --user=root --execute \
              "CREATE DATABASE \`${database}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
            SQLALCHEMY_DATABASE_URL="${database_url}" TEST_MYSQL_DATABASE_URL="${database_url}" \
              python -m pytest -q "${test_file}"
          }
          run_isolated_test 8 tests/test_mysql_stage8_bulk_jobs.py
          run_isolated_test 9 tests/test_mysql_stage9_dashboard.py
          run_isolated_test 10 tests/test_mysql_stage10_pagination.py
          run_isolated_test 11 tests/test_mysql_stage11_operations.py

  independent-review:
    name: independent security / failure review
    if: github.head_ref == 'release/v1.0.4'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate with history
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.4
          fetch-depth: 0

      - name: Review scope and immutable release invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --depth=1
          python - <<'PY'
          from pathlib import Path
          import subprocess

          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main...HEAD"], text=True
          ).splitlines())
          allowed_exact = {
              ".github/workflows/build.yml",
              ".github/workflows/_v104_gate.yml",
              "VERSION",
              "app/__init__.py",
              "docker-compose.yml",
              "docs/RELEASE_NOTES_v1.0.4.md",
              "scripts/marzban.sh",
              "tests/test_installer_v1_contract.sh",
              "tests/test_release_contract.py",
          }
          unexpected = sorted(
              p for p in changed
              if p not in allowed_exact and not p.startswith("app/dashboard/")
          )
          if unexpected:
              raise SystemExit(f"unexpected release scope: {unexpected}")

          assert Path("VERSION").read_text().strip() == "1.0.4"
          assert '__version__ = "1.0.4"' in Path("app/__init__.py").read_text()
          assert 'ghcr.io/smorad3363/marzban-v1:v1.0.4' in Path("docker-compose.yml").read_text()

          installer = Path("scripts/marzban.sh").read_text()
          for invariant in [
              'CLI_RELEASE_VERSION="v1.0.4"',
              'V1_LINEAGE_SOURCE_VERSION="5.2.0"',
              'V1_LINEAGE_SOURCE_IMAGE="ghcr.io/smorad3363/marzban-vnext:v5.2.0"',
              'V1_LINEAGE_TARGET_VERSION="v1.0.0"',
              '-----BEGIN CERTIFICATE-----',
              '-----END CERTIFICATE-----',
              'openssl x509',
              '--client-cert-file',
          ]:
              assert invariant in installer, invariant
          start = installer.index("node_prompt_client_cert()")
          end = installer.find("\n}\n", start)
          cert_func = installer[start:end]
          assert "mktemp" in cert_func and "chmod 600" in cert_func
          assert "PRIVATE KEY" not in cert_func

          release_workflow = Path(".github/workflows/build.yml").read_text()
          expr = lambda body: "$" + "{{ " + body + " }}"
          for label in [
              "org.opencontainers.image.revision=" + expr("github.sha"),
              "org.opencontainers.image.source=https://github.com/" + expr("github.repository"),
              "org.opencontainers.image.version=" + expr("steps.release-version.outputs.version_tag || inputs.image_tag || github.ref_name"),
          ]:
              assert label in release_workflow, label

          settings = Path("app/dashboard/src/pages/Settings.tsx").read_text()
          assert 'fetch("/owner/backups/restore"' not in settings
          assert "بازیابی آنلاین برای حفاظت از داده فعال غیرفعال است" in settings

          assert not Path("scripts/_v104_prepare.py").exists()
          assert not Path(".github/workflows/_v104_prepare.yml").exists()
          print("independent v1.0.4 review: PASS")
          PY

      - name: Shell syntax and certificate failure-path replay
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/marzban.sh
          bash tests/test_installer_v1_contract.sh
