name: Tag and dispatch v1.1.2 once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tag-v1.1.2-once.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-v1.1.2-once
  cancel-in-progress: false

jobs:
  tag-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create immutable v1.1.2 tag on reviewed release commit
        env:
          TARGET_SHA: 79212a9bfdeaea2c56cd1d281b3700782372b77a
          RELEASE_TAG: v1.1.2
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${TARGET_SHA}" origin/main
          test "$(git show "${TARGET_SHA}:VERSION" | tr -d '[:space:]')" = "1.1.2"
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists; refusing to move it." >&2
            exit 1
          fi
          git tag "${RELEASE_TAG}" "${TARGET_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"
      - name: Dispatch canonical Release workflow for the immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.1.2
        shell: bash
        run: |
          set -Eeuo pipefail
          gh workflow run build.yml --ref main \
            -f git_ref="${RELEASE_TAG}" \
            -f image_tag="${RELEASE_TAG}" \
            -f tests_only=false
