name: Harden v1.0.6 MySQL release readiness r2

on:
  push:
    branches:
      - release/v1.0.6-integration

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.6-integration
          fetch-depth: 0

      - name: Replace ping-only readiness with authenticated SQL readiness
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('.github/workflows/build.yml')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r'''(?m)^              if docker exec -e MYSQL_PWD=root-test-password "\$\{container_name\}" \\\n                mysqladmin --user=root --host=127\.0\.0\.1 ping --silent >/dev/null 2>&1; then\n                return 0\n              fi'''
          )
          replacement = '''              if docker exec -e MYSQL_PWD=root-test-password "${container_name}" \\
                mysql --user=root --host=127.0.0.1 --batch --skip-column-names \\
                --execute 'SELECT 1' 2>/dev/null | grep -qx '1'; then
                return 0
              fi'''
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'expected exactly one readiness block, replaced {count}')
          p.write_text(s2, encoding='utf-8')
          PY
          git diff --check -- .github/workflows/build.yml
          grep -Fq -- "--execute 'SELECT 1'" .github/workflows/build.yml
          ! grep -Fq -- "mysqladmin --user=root --host=127.0.0.1 ping" .github/workflows/build.yml

      - name: Verify MySQL 8 to 26 authenticated logical migration
        shell: bash
        run: |
          set -Eeuo pipefail
          src="v106-r2-src-${GITHUB_RUN_ID}"; dst="v106-r2-dst-${GITHUB_RUN_ID}"; c="v106-r2-mysql"
          cleanup(){ docker rm -f "$c" >/dev/null 2>&1 || true; docker volume rm "$src" "$dst" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker volume create "$src" >/dev/null; docker volume create "$dst" >/dev/null
          start(){
            docker rm -f "$c" >/dev/null 2>&1 || true
            docker run -d --name "$c" -e MYSQL_ROOT_PASSWORD=root-test-password -e MYSQL_DATABASE=marzban -v "$2:/var/lib/mysql" "$1" --mysqlx=OFF >/dev/null
            for i in $(seq 1 120); do
              if docker exec -e MYSQL_PWD=root-test-password "$c" mysql -uroot -h127.0.0.1 -Nse 'SELECT 1' 2>/dev/null | grep -qx 1; then return 0; fi
              state="$(docker inspect --format '{{.State.Status}}' "$c" 2>/dev/null || true)"
              if [[ "$state" == exited || "$state" == dead ]]; then docker logs "$c"; return 1; fi
              sleep 2
            done
            docker logs "$c"; return 1
          }
          start mysql:8.0 "$src"
          docker exec -e MYSQL_PWD=root-test-password "$c" mysql -uroot -e "CREATE TABLE marzban.v106_sentinel(id INT PRIMARY KEY,value VARCHAR(64)); INSERT INTO marzban.v106_sentinel VALUES(1,'preserved');"
          docker exec -e MYSQL_PWD=root-test-password "$c" mysqldump -uroot --databases marzban --single-transaction --routines --events --triggers --set-gtid-purged=OFF --hex-blob > /tmp/v106.sql
          docker stop "$c" >/dev/null
          start mysql:26.7.0 "$dst"
          docker exec -i -e MYSQL_PWD=root-test-password "$c" mysql -uroot < /tmp/v106.sql
          test "$(docker exec -e MYSQL_PWD=root-test-password "$c" mysql -uroot -Nse "SELECT value FROM marzban.v106_sentinel WHERE id=1")" = preserved
          test "$(docker exec -e MYSQL_PWD=root-test-password "$c" mysql -uroot -Nse 'SELECT VERSION()')" = 26.7.0

      - name: Commit hardened permanent release workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build.yml
          git rm -f .github/workflows/v106-fix-release-mysql-readiness.yml .github/workflows/v106-fix-release-mysql-readiness-r2.yml || true
          git diff --cached --check
          git commit -m "ci: wait for authenticated MySQL readiness"
          git push origin HEAD:release/v1.0.6-integration
