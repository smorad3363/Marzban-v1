name: Create v1.0.7 tag once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tag-v107-once.yml"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create immutable v1.0.7 tag on clean product commit
        shell: bash
        run: |
          set -Eeuo pipefail
          target="$(git rev-parse HEAD^)"
          version="$(git show "${target}:VERSION" | tr -d '[:space:]')"
          test "${version}" = "1.0.7"
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.7 >/dev/null 2>&1; then
            echo 'v1.0.7 already exists' >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag v1.0.7 "${target}"
          git push origin refs/tags/v1.0.7
