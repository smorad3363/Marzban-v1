name: Temporary v1.0.3 release prep

on:
  push:
    branches:
      - hotfix/v1.0.3-interactive-node-cert
    paths:
      - scripts/_prepare_v103.py
      - scripts/_prepare_v103_contract.py
      - .github/workflows/_prepare-v103.yml

permissions:
  contents: write

jobs:
  prepare-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/v1.0.3-interactive-node-cert
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML
      - name: Apply context-checked release prep
        run: |
          python scripts/_prepare_v103.py
          python scripts/_prepare_v103_contract.py
      - name: Shell syntax
        run: bash -n scripts/marzban.sh
      - name: Focused Python contracts
        run: python -m pytest -q tests/test_v102_node_deployment.py tests/test_release_contract.py
      - name: Installer shell contract
        run: bash tests/test_installer_v1_contract.sh
      - name: Compose contracts
        shell: bash
        run: |
          set -euo pipefail
          : > .env
          docker compose config >/tmp/panel-compose.yml
          MARZBAN_NODE_IMAGE=ghcr.io/smorad3363/marzban-v1:v1.0.3 NODE_RUNTIME_VERSION=v1.0.3 docker compose -f docker-compose.node.yml config >/tmp/node-compose.yml
          grep -q 'ghcr.io/smorad3363/marzban-v1:v1.0.3' /tmp/panel-compose.yml
          grep -q 'ghcr.io/smorad3363/marzban-v1:v1.0.3' /tmp/node-compose.yml
      - name: Scope and immutable-lineage guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <({ git diff --name-only; git ls-files --others --exclude-standard; } | sort -u)
          expected=(README-fa.md README.md VERSION app/__init__.py docker-compose.yml docs/RELEASE_NOTES_v1.0.3.md scripts/marzban.sh tests/test_installer_v1_contract.sh tests/test_release_contract.py)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected_sorted[*]}"
          grep -Fq 'V1_LINEAGE_SOURCE_VERSION="5.2.0"' scripts/marzban.sh
          grep -Fq 'V1_LINEAGE_SOURCE_IMAGE="ghcr.io/smorad3363/marzban-vnext:v5.2.0"' scripts/marzban.sh
          grep -Fq 'V1_LINEAGE_TARGET_VERSION="v1.0.0"' scripts/marzban.sh
          grep -Fq 'node_prompt_client_cert' scripts/marzban.sh
          grep -Fq -- '--client-cert-file' scripts/marzban.sh
      - name: Commit tested v1.0.3 prep
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README-fa.md README.md VERSION app/__init__.py docker-compose.yml docs/RELEASE_NOTES_v1.0.3.md scripts/marzban.sh tests/test_installer_v1_contract.sh tests/test_release_contract.py
          git commit -m "release: prepare Marzban v1.0.3"
          git push origin HEAD:hotfix/v1.0.3-interactive-node-cert
