name: Temporary v1.1.6 workspace builder

on:
  push:
    branches:
      - release/v1.1.6
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-workspace:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.1.6
          fetch-depth: 0

      - name: Apply v1.1.6 product patch
        run: python scripts/v116_workspace_patch.py

      - name: Python syntax check
        run: python -m py_compile app/routers/admin.py app/db/crud.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci

      - name: Verify Stage 1 contracts
        working-directory: app/dashboard
        run: node scripts/test-stage1-ui-contracts.cjs

      - name: Build canonical dashboard
        working-directory: app/dashboard
        run: VITE_BASE_API=/api/ npm run build

      - name: Remove temporary helper files
        run: rm -f scripts/v116_workspace_patch.py .github/workflows/v116-workspace.yml

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: separate admin dashboard and users for v1.1.6"
          git push origin HEAD:release/v1.1.6
