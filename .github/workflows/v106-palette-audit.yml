name: v1.0.6 palette audit
on:
  push:
    branches: [release/v1.0.6-integration]
    paths: [.github/workflows/v106-palette-audit.yml]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: release/v1.0.6-integration }
      - name: Report legacy/non-palette color references
        shell: bash
        run: |
          echo '--- gold/purple legacy references ---'
          grep -RInE 'gold\.|purple\.|colorScheme="(gold|purple)"' app/dashboard/src app/dashboard/chakra.config.ts --include='*.tsx' --include='*.ts' --include='*.scss' || true
          echo '--- raw saturated legacy rgba/hex references in modified admin/user/plans UI ---'
          grep -RInE 'rgba\((139,92,246|167,139,250|37,99,235|96,165,250|239,68,68|248,113,113|34,197,94|74,222,128|245,158,11|6,182,212|34,211,238)' app/dashboard/src/pages/admins app/dashboard/src/components/UserDialog.tsx app/dashboard/src/pages/Plans.tsx || true
          echo '--- forbidden old theme axis ---'
          grep -RInE 'black_gold|طلایی|heisenberg' app/dashboard/src --include='*.tsx' --include='*.ts' || true
