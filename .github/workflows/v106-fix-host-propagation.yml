name: Fix v1.0.6 Access Group host propagation

on:
  push:
    branches:
      - release/v1.0.6-integration
    paths:
      - .github/workflows/v106-fix-host-propagation.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: marzban_test
          MYSQL_USER: marzban
          MYSQL_PASSWORD: marzban-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u marzban --password=marzban-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      SQLALCHEMY_DATABASE_URL: mysql+pymysql://marzban:marzban-test-password@127.0.0.1:3306/marzban_test
      TEST_MYSQL_DATABASE_URL: mysql+pymysql://marzban:marzban-test-password@127.0.0.1:3306/marzban_test
      XRAY_JSON: ./xray_config.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.6-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply maintenance-sync fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          p = Path("app/utils/access_groups.py")
          s = p.read_text(encoding="utf-8")
          start = s.index("def validated_scope(")
          end = s.index("\ndef network_options", start)
          replacement = dedent('''\
          def _validated_network_scope(
              db: Session,
              group_id: int,
          ) -> tuple[set[str], dict[str, set[int]], set[int]]:
              """Validate persisted network scope without re-authorizing an existing binding."""
              group = db.get(AccessGroup, group_id)
              if group is None or group.archived_at is not None:
                  raise admin_hierarchy.HierarchyError(
                      "access_group_unavailable", "Access Group is unavailable"
                  )
              inbounds, hosts, nodes = _scope(db, group_id)
              if not inbounds or set(hosts) != inbounds or any(not hosts[tag] for tag in inbounds):
                  raise admin_hierarchy.HierarchyError(
                      "access_group_invalid", "Access Group has incomplete network scope"
                  )
              unknown = inbounds - set(xray.config.inbounds_by_tag)
              if unknown:
                  raise admin_hierarchy.HierarchyError(
                      "access_group_inbound_unavailable",
                      f"Access Group contains unavailable inbounds: {sorted(unknown)}",
                  )
              selected_ids = {host_id for ids in hosts.values() for host_id in ids}
              active_hosts = {
                  row.id: row.inbound_tag
                  for row in db.query(ProxyHost.id, ProxyHost.inbound_tag)
                  .filter(
                      ProxyHost.id.in_(selected_ids),
                      ProxyHost.is_legacy.is_(False),
                      ProxyHost.is_disabled.is_(False),
                      ProxyHost.address != "",
                  )
                  .all()
              }
              invalid = sorted(
                  host_id
                  for tag, host_ids in hosts.items()
                  for host_id in host_ids
                  if active_hosts.get(host_id) != tag
              )
              if invalid:
                  raise admin_hierarchy.HierarchyError(
                      "access_group_host_unavailable",
                      f"Access Group contains unavailable or mismatched hosts: {invalid}",
                  )
              return inbounds, hosts, nodes


          def validated_scope(
              db: Session,
              group_id: int,
              admin_id: int,
          ) -> tuple[set[str], dict[str, set[int]], set[int]]:
              """Resolve one active Access Group and fail closed on permission or network scope."""
              group = db.get(AccessGroup, group_id)
              if group is None or group.archived_at is not None:
                  raise admin_hierarchy.HierarchyError(
                      "access_group_unavailable", "Access Group is unavailable"
                  )
              _require_group_access(db, group, admin_id)
              inbounds, hosts, nodes = _validated_network_scope(db, group_id)
              settings = db.get(MarzhelpAdminSettings, admin_id)
              if settings is None:
                  raise admin_hierarchy.HierarchyError("policy_missing", "Administrator policy is missing")
              if not settings.all_inbounds:
                  forbidden = inbounds - set(settings.allowed_inbounds or [])
                  if forbidden:
                      raise admin_hierarchy.HierarchyError(
                          "access_group_scope_forbidden",
                          f"Access Group exceeds Admin scope: {sorted(forbidden)}",
                      )
              return inbounds, hosts, nodes
          ''')
          s = s[:start] + replacement + s[end:]
          old = (
              "        for user in users:\n"
              "            apply_to_user(db, user, group_id)\n"
              "            synced.append(user.id)\n"
          )
          new = (
              "        inbounds, _, _ = _validated_network_scope(db, group_id)\n"
              "        from app.utils.admin_plans import _apply_network_to_user\n\n"
              "        for user in users:\n"
              "            # Host maintenance resyncs an existing binding; it is not a new\n"
              "            # Access Group selection, so Admin authorization is intentionally\n"
              "            # not re-evaluated here. Network validity is still fail-closed.\n"
              "            _apply_network_to_user(db, user, inbounds)\n"
              "            user.access_group_id = group_id\n"
              "            synced.append(user.id)\n"
          )
          if old not in s:
              raise SystemExit("propagation block not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Verify targeted regressions
        run: |
          python -m compileall -q app tests
          python -m pytest -q tests/test_stage2_network_sync.py tests/test_access_group_admin_permissions_contract.py
      - name: Commit verified fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/utils/access_groups.py
          git diff --cached --check
          git commit -m "fix: preserve Access Group users during host maintenance"
          git push origin HEAD:release/v1.0.6-integration
