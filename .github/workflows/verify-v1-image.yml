name: Verify published V1 image
on:
  workflow_dispatch:
    inputs:
      digest:
        description: Published multi-platform digest
        required: true
      source_commit:
        description: Exact source revision label
        required: true
permissions:
  contents: write
  packages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify manifest and AMD64 runtime
        env:
          IMAGE: ghcr.io/smorad3363/marzban-v1
          DIGEST: ${{ inputs.digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          tagged_digest="sha256:$(docker buildx imagetools inspect --raw "$IMAGE:v1.0.0" | sha256sum | awk '{print $1}')"
          test "$tagged_digest" = "$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST" > manifest.txt
          grep -q 'linux/amd64' manifest.txt
          grep -q 'linux/arm64' manifest.txt
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE_COMMIT"
          test "$(docker run --rm --platform linux/amd64 --entrypoint python \
            -e SQLALCHEMY_DATABASE_URL=mysql+pymysql://probe:probe@127.0.0.1/probe \
            "$IMAGE@$DIGEST" -c 'from app import __version__; print(__version__)')" = 1.0.0
          docker run --rm --platform linux/amd64 --entrypoint mysqldump "$IMAGE@$DIGEST" --version | grep -q 'Ver 26.7.0'
          docker run --rm --platform linux/amd64 --entrypoint sh "$IMAGE@$DIGEST" -c \
            "grep -q 'Upload Backup' /code/app/dashboard/build/statics/index.*.js && test -x /usr/bin/marzban-cli"
          echo "PUBLISHED_IMAGE_VERIFIED $IMAGE@$DIGEST $SOURCE_COMMIT"
      - name: Create immutable V1 tag and stable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v1.0.0
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          existing_commit="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
          if [[ -n "$existing_commit" && "$existing_commit" != "$SOURCE_COMMIT" ]]; then
            echo "Existing $RELEASE_TAG points to $existing_commit, not $SOURCE_COMMIT; refusing to move it." >&2
            exit 1
          fi
          if [[ -z "$existing_commit" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" "$SOURCE_COMMIT" -m "Marzban $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
            test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" = false
          else
            gh release create "$RELEASE_TAG" \
              --title "Marzban V1.0.0" \
              --notes-file docs/RELEASE_NOTES_v1.0.0.md \
              --verify-tag
          fi
