name: Verify published V1 image
on:
  workflow_dispatch:
    inputs:
      digest:
        description: Published multi-platform digest
        required: true
      source_commit:
        description: Exact source revision label
        required: true
      release_tag:
        description: Exact release tag
        required: true
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify manifest and AMD64 runtime
        env:
          IMAGE: ghcr.io/smorad3363/marzban-v1
          DIGEST: ${{ inputs.digest }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          VERSION_TEXT="$(tr -d '[:space:]' < VERSION)"
          test "$RELEASE_TAG" = "v${VERSION_TEXT}"
          test -s "docs/RELEASE_NOTES_${RELEASE_TAG}.md"
          tagged_digest="sha256:$(docker buildx imagetools inspect --raw "$IMAGE:$RELEASE_TAG" | sha256sum | awk '{print $1}')"
          test "$tagged_digest" = "$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST" > manifest.txt
          grep -q 'linux/amd64' manifest.txt
          grep -q 'linux/arm64' manifest.txt
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$SOURCE_COMMIT"
          test "$(docker run --rm --platform linux/amd64 --entrypoint python \
            -e SQLALCHEMY_DATABASE_URL=mysql+pymysql://probe:probe@127.0.0.1/probe \
            "$IMAGE@$DIGEST" -c 'from app import __version__; print(__version__)')" = "$VERSION_TEXT"
          docker run --rm --platform linux/amd64 --entrypoint mysqldump "$IMAGE@$DIGEST" --version | grep -q 'Ver 26.7.0'
          docker run --rm --platform linux/amd64 --entrypoint sh "$IMAGE@$DIGEST" -c \
            "test -s /code/app/dashboard/build/index.html && test -s /code/app/dashboard/build/404.html && test -x /usr/bin/marzban-cli && test -f /code/node_runtime/main.py"
          echo "PUBLISHED_IMAGE_VERIFIED $IMAGE@$DIGEST $SOURCE_COMMIT $RELEASE_TAG"
