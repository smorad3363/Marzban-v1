name: Stage 9 Branch Cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/stage9-branch-cleanup.yml"

permissions:
  contents: write

jobs:
  cleanup:
    name: delete reconciled and merged branches
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete only approved superseded branches
        shell: bash
        run: |
          set -Eeuo pipefail
          branches=(
            "dashboard-redesign-v2"
            "feature/dashboard-user-management-controls"
            "fix/access-group-admin-permissions"
            "fix/access-group-user-creation"
            "fix/interactive-node-cert"
            "fix/v1.0.5-installer-contract"
            "fix/v1.0.8-ui-polish"
            "hotfix/users-table-no-horizontal-scroll"
            "node-management-redesign-v1"
            "release/v1.0.6-integration-2"
            "release/v1.0.7-integration"
            "release/v1.0.8-integration"
            "stage7-mysql-version-contract"
            "test/node-dashboard-combined"
            "ui/admins-minimal-pro"
            "ui/dashboard-palette-node-speed"
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null 2>&1; then
              echo "Deleting ${branch}"
              git push origin --delete "${branch}"
            else
              echo "Already absent: ${branch}"
            fi
          done

          for branch in "${branches[@]}"; do
            if git ls-remote --heads origin "refs/heads/${branch}" | grep -q .; then
              echo "Branch still exists after cleanup: ${branch}" >&2
              exit 1
            fi
          done

      - name: Remove one-time cleanup workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage9-branch-cleanup.yml
          git commit -m "chore(repo): remove Stage 9 cleanup workflow"
          git push origin HEAD:main
