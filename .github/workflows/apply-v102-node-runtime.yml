name: Apply V1.0.2 Standalone Node Runtime

on:
  push:
    branches:
      - release/v1.0.2
    paths:
      - .github/workflows/apply-v102-node-runtime.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest httpx
      - name: Repair staged patcher quoting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_v102_node_runtime.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          matches = [
              index for index, line in enumerate(lines)
              if line.startswith("    raw = '''{") and '"api"' in line
          ]
          if len(matches) != 1:
              raise SystemExit(f'expected one nested raw fixture, found {len(matches)}')
          index = matches[0]
          line = lines[index]
          if not line.endswith("'''"):
              raise SystemExit('nested raw fixture does not end with triple quote')
          lines[index] = line.replace("raw = '''", "raw = '", 1)[:-3] + "'"
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Apply context-checked runtime patch
        run: python .github/scripts/apply_v102_node_runtime.py
      - name: Enforce runtime patch scope
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              app/xray/node.py|app/xray/node_protocol_v2.py|app/device_limit/engine.py|tests/test_v102_node_runtime_protocol.py|tests/test_v102_node_runtime.py|node_runtime/*|.github/scripts/apply_v102_node_runtime.py) ;;
              *) echo "Unexpected runtime patch path: $path" >&2; exit 1 ;;
            esac
          done
      - name: Compile runtime
        run: python -m compileall -q app node_runtime
      - name: Focused runtime tests
        run: python -m pytest -q tests/test_v102_node_runtime_protocol.py tests/test_v102_node_runtime.py
      - name: Diff hygiene
        run: git diff --check app node_runtime tests
      - name: Commit runtime checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "Eliot"
          git config user.email "42266703+smorad3363@users.noreply.github.com"
          git add app/xray/node.py app/xray/node_protocol_v2.py app/device_limit/engine.py node_runtime tests/test_v102_node_runtime_protocol.py tests/test_v102_node_runtime.py
          git diff --cached --quiet && { echo "No product changes to commit"; exit 1; }
          git commit -m "feat: add standalone node runtime v2"
          git push origin HEAD:release/v1.0.2
