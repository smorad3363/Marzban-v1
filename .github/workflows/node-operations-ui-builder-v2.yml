name: Isolated Node Operations UI Builder

on:
  push:
    branches:
      - codex/node-operations-ui-build

permissions:
  contents: write

jobs:
  build-ui:
    if: github.event.head_commit.message != 'feat: unify Node Operations workspace'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - name: Apply Node Operations UI source patch
        run: python scripts/node_operations_ui_patch.py
      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci
      - name: Verify Stage 1 UI contracts
        working-directory: app/dashboard
        run: node scripts/test-stage1-ui-contracts.cjs
      - name: Build dashboard
        working-directory: app/dashboard
        run: VITE_BASE_API=/api/ npm run build
      - name: Verify generated output and diff hygiene
        run: |
          test -f app/dashboard/build/index.html
          test -f app/dashboard/build/404.html
          git diff --check
          git status --short
      - name: Commit source and generated build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/src/components/NodesManagementWorkspace.tsx \
                  app/dashboard/src/components/Header.tsx \
                  app/dashboard/src/components/AppShell.tsx \
                  app/dashboard/scripts/test-stage1-ui-contracts.cjs \
                  app/dashboard/build
          git diff --cached --check
          git commit -m "feat: unify Node Operations workspace"
          git push
