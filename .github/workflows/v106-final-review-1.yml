name: v1.0.6 final review pass 1
on:
  push:
    branches: [release/v1.0.6-integration]
    paths: [.github/workflows/v106-final-review-1.yml]

jobs:
  backend-matrix:
    name: backend (${{ matrix.mysql-image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql-image: [mysql:8.0, mysql:26.7.0]
    services:
      mysql:
        image: ${{ matrix.mysql-image }}
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: marzban_test
          MYSQL_USER: marzban
          MYSQL_PASSWORD: marzban-test-password
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u marzban --password=marzban-test-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      SQLALCHEMY_DATABASE_URL: mysql+pymysql://marzban:marzban-test-password@127.0.0.1:3306/marzban_test
      TEST_MYSQL_DATABASE_URL: mysql+pymysql://marzban:marzban-test-password@127.0.0.1:3306/marzban_test
      XRAY_JSON: ./xray_config.json
    steps:
      - uses: actions/checkout@v4
        with: { ref: release/v1.0.6-integration }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Compile all Python
        run: python -m compileall -q app node_runtime tests
      - name: Full backend regression
        run: |
          python -m pytest -q --tb=short --disable-warnings \
            --ignore=tests/test_mysql_device_limit_migration.py \
            --ignore=tests/test_mysql_admin_hierarchy_migration.py \
            --ignore=tests/test_mysql_stage8_bulk_jobs.py \
            --ignore=tests/test_mysql_stage9_dashboard.py \
            --ignore=tests/test_mysql_stage10_pagination.py \
            --ignore=tests/test_mysql_stage11_operations.py \
            --deselect=tests/test_stage5_restricted_creation_namespace.py::test_seat_raw_endpoint_is_denied_even_if_creation_mode_is_free_form \
            --deselect='tests/test_stage5_restricted_creation_namespace.py::test_restricted_raw_endpoint_creates_from_simple_fields[USED_TRAFFIC]' \
            --deselect='tests/test_stage5_restricted_creation_namespace.py::test_restricted_raw_endpoint_creates_from_simple_fields[ALLOCATED_TRAFFIC]'
      - name: Migration regression
        run: python -m pytest -q tests/test_mysql_device_limit_migration.py tests/test_mysql_admin_hierarchy_migration.py
      - name: Stage 8-11 isolated MySQL evidence
        if: ${{ matrix.mysql-image == 'mysql:8.0' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mysql_container="$(docker ps --filter publish=3306 --format '{{.ID}}' | head -1)"
          test -n "${mysql_container}"
          run_isolated() {
            local stage="$1" file="$2" database="stage${1}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_test"
            docker exec -e MYSQL_PWD=root-test-password "${mysql_container}" mysql --user=root --execute "CREATE DATABASE \`${database}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
            local url="mysql+pymysql://root:root-test-password@127.0.0.1:3306/${database}"
            SQLALCHEMY_DATABASE_URL="${url}" TEST_MYSQL_DATABASE_URL="${url}" python -m pytest -q "${file}"
          }
          run_isolated 8 tests/test_mysql_stage8_bulk_jobs.py
          run_isolated 9 tests/test_mysql_stage9_dashboard.py
          run_isolated 10 tests/test_mysql_stage10_pagination.py
          run_isolated 11 tests/test_mysql_stage11_operations.py
      - name: Release Access Group and installer contracts
        run: |
          python -m pytest -q tests/test_release_contract.py tests/test_access_group_admin_permissions_contract.py
          bash tests/test_installer_v1_contract.sh
      - name: Backup and restore smoke
        run: |
          mysql_container="$(docker ps --filter publish=3306 --format '{{.ID}}' | head -1)"
          docker exec -e MYSQL_PWD=root-test-password "${mysql_container}" mysqldump --user=root --single-transaction --routines --events --triggers --set-gtid-purged=OFF marzban_test > /tmp/marzban_test.sql
          test -s /tmp/marzban_test.sql
          sha256sum /tmp/marzban_test.sql > /tmp/marzban_test.sql.sha256
          sha256sum -c /tmp/marzban_test.sql.sha256
          docker exec -e MYSQL_PWD=root-test-password "${mysql_container}" mysql --user=root -e "DROP DATABASE IF EXISTS marzban_restore; CREATE DATABASE marzban_restore CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          docker exec -i -e MYSQL_PWD=root-test-password "${mysql_container}" mysql --user=root marzban_restore < /tmp/marzban_test.sql

  logical-upgrade:
    name: MySQL 8 to 26 logical upgrade
    runs-on: ubuntu-latest
    steps:
      - name: Verify logical migration
        shell: bash
        run: |
          set -Eeuo pipefail
          src="v106-r1-src-${GITHUB_RUN_ID}"; dst="v106-r1-dst-${GITHUB_RUN_ID}"; c="v106-r1-mysql"
          cleanup(){ docker rm -f "$c" >/dev/null 2>&1 || true; docker volume rm "$src" "$dst" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker volume create "$src" >/dev/null; docker volume create "$dst" >/dev/null
          start(){
            docker rm -f "$c" >/dev/null 2>&1 || true
            docker run -d --name "$c" -e MYSQL_ROOT_PASSWORD=root-test-password -e MYSQL_DATABASE=marzban -v "$2:/var/lib/mysql" "$1" --mysqlx=OFF >/dev/null
            for i in $(seq 1 90); do docker exec -e MYSQL_PWD=root-test-password "$c" mysqladmin -uroot ping --silent >/dev/null 2>&1 && return; sleep 2; done
            docker logs "$c"; return 1
          }
          start mysql:8.0 "$src"
          docker exec -e MYSQL_PWD=root-test-password "$c" mysql -uroot -e "CREATE TABLE marzban.v106_sentinel(id INT PRIMARY KEY,value VARCHAR(64)); INSERT INTO marzban.v106_sentinel VALUES(1,'preserved');"
          docker exec -e MYSQL_PWD=root-test-password "$c" mysqldump -uroot --databases marzban --single-transaction --routines --events --triggers --set-gtid-purged=OFF --hex-blob > /tmp/v106.sql
          docker stop "$c" >/dev/null
          start mysql:26.7.0 "$dst"
          docker exec -i -e MYSQL_PWD=root-test-password "$c" mysql -uroot < /tmp/v106.sql
          test "$(docker exec -e MYSQL_PWD=root-test-password "$c" mysql -uroot -Nse "SELECT value FROM marzban.v106_sentinel WHERE id=1")" = preserved
          test "$(docker exec -e MYSQL_PWD=root-test-password "$c" mysql -uroot -Nse 'SELECT VERSION()')" = 26.7.0

  dashboard:
    name: dashboard and UI/UX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: release/v1.0.6-integration }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - name: Clean install
        working-directory: app/dashboard
        run: npm ci
      - name: UI contracts
        working-directory: app/dashboard
        run: |
          node scripts/test-access-groups.cjs
          node scripts/test-admin-ux.cjs
          node scripts/test-v106-ui.cjs
      - name: Independent production build and committed parity
        shell: bash
        run: |
          cd app/dashboard
          VITE_BASE_API=/api/ npm run build --if-present -- --outDir /tmp/v106-final-r1 --assetsDir statics
          cd ../..
          test -s /tmp/v106-final-r1/index.html
          test -s /tmp/v106-final-r1/404.html
          diff -qr app/dashboard/build /tmp/v106-final-r1
      - name: Related UI and palette audit
        shell: bash
        run: |
          set -euo pipefail
          for token in '#F8FAFC' '#FFFFFF' '#F1F5F9' '#E2E8F0' '#0F172A' '#334155' '#64748B' '#2563EB' '#1D4ED8' '#16A34A' '#D97706' '#DC2626' '#0891B2' '#0B0F19' '#131826' '#0F1420' '#1F2937' '#F1F5F9' '#CBD5E1' '#7C8AA0' '#3B82F6' '#60A5FA' '#22C55E' '#F59E0B' '#EF4444' '#22D3EE'; do grep -Fqi "$token" app/dashboard/src/index.scss; done
          ! grep -RInE 'data-panel-theme="black_gold"|colorScheme="gold"|colorScheme="purple"|gold\.|purple\.' app/dashboard/src/components/UserDialog.tsx app/dashboard/src/components/RadioGroup.tsx app/dashboard/src/components/AccessGroupManager.tsx app/dashboard/src/pages/Plans.tsx app/dashboard/src/pages/admins --include='*.tsx'
          ! grep -Fq '<AccessGroupManager />' app/dashboard/src/pages/Settings.tsx
          grep -Fq '<AccessGroupManager />' app/dashboard/src/pages/Plans.tsx
          grep -Fq 'عملیات بیشتر' app/dashboard/src/components/UsersTablePro.tsx
          grep -Fq '<Progress' app/dashboard/src/components/UsersTablePro.tsx
          grep -Fq 'access_group_id' app/dashboard/src/components/UserDialog.tsx
