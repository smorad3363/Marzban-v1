name: Fix V1.0.2 Node Runtime Trust

on:
  push:
    branches:
      - release/v1.0.2
    paths:
      - .github/workflows/fix-v102-node-runtime-trust.yml

permissions:
  contents: write

env:
  SQLALCHEMY_DATABASE_URL: mysql+pymysql://marzban:test@127.0.0.1:3306/marzban_test
  DEBUG: "false"

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest httpx
      - name: Apply fail-closed runtime trust patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          engine = Path('app/device_limit/engine.py')
          text = engine.read_text(encoding='utf-8')
          old = '''        if source_name.startswith("node:"):\n            if runtime_handshake is None:\n                self.forget_runtime_source_ip_trust(source_name)\n            else:\n                self.set_runtime_source_ip_trust(\n                    source_name,\n                    bool(getattr(runtime_handshake, "supports_direct_client_ip", False)),\n                )\n'''
          new = '''        if source_name.startswith("node:"):\n            if runtime_handshake is None:\n                self.set_runtime_source_ip_trust(source_name, False)\n            else:\n                self.set_runtime_source_ip_trust(\n                    source_name,\n                    bool(getattr(runtime_handshake, "supports_direct_client_ip", False)),\n                )\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one runtime trust block, found {text.count(old)}')
          engine.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_v102_node_runtime.py')
          test_text = tests.read_text(encoding='utf-8')
          marker = '''def test_device_limit_collector_prefers_durable_v2_consumer(monkeypatch):\n'''
          if test_text.count(marker) != 1:
              raise SystemExit(f'expected one durable collector test marker, found {test_text.count(marker)}')
          addition = '''def test_device_limit_missing_runtime_handshake_is_ip_untrusted(monkeypatch):\n    from app import xray\n\n    class Source:\n        _session_id = "legacy-session"\n        process = None\n        runtime_handshake = None\n\n        def consume_events(self, consumer_id, callback, should_stop):\n            assert consumer_id == "device-limit"\n            callback("2026/09/06 12:00:00 8.8.8.8:51000 accepted tcp:example.com:443 [vless >> direct] email: 42.demo.slot1")\n\n    source = Source()\n    monkeypatch.setattr(xray, "nodes", {8: source})\n    tracker = DeviceLimitEngine()\n    tracker.configure(True, "hybrid", True)\n    tracker._limited_user_ids = {42}\n    tracker._collect(source, "node:8")\n    addresses, sources, slots = tracker.live_snapshot(42, 300, 1)\n    assert addresses == set()\n    assert sources == set()\n    assert slots == {}\n    assert "node:8" in tracker.diagnostics()["untrusted_ip_sources"]\n\n\n'''
          tests.write_text(test_text.replace(marker, addition + marker, 1), encoding='utf-8')
          PY
      - name: Enforce scope
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          for path in "${changed[@]}"; do
            case "$path" in
              app/device_limit/engine.py|tests/test_v102_node_runtime.py) ;;
              *) echo "Unexpected trust patch path: $path" >&2; exit 1 ;;
            esac
          done
      - name: Focused runtime tests
        run: python -m pytest -q tests/test_v102_node_runtime_protocol.py tests/test_v102_node_runtime.py
      - name: Diff hygiene
        run: git diff --check app/device_limit/engine.py tests/test_v102_node_runtime.py
      - name: Commit trust guard
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "Eliot"
          git config user.email "42266703+smorad3363@users.noreply.github.com"
          git add app/device_limit/engine.py tests/test_v102_node_runtime.py
          git commit -m "fix: fail closed without node runtime ip capability"
          git push origin HEAD:release/v1.0.2
