name: Prepare v1.0.5 release candidate

on:
  push:
    branches:
      - release/v1.0.5

permissions:
  contents: write

concurrency:
  group: prepare-v1.0.5
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.5
          fetch-depth: 0

      - name: Prepare exact v1.0.5 metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"{path}: missing expected text {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          version = Path("VERSION")
          if version.read_text().strip() != "1.0.4":
              raise SystemExit("VERSION must start at 1.0.4")
          version.write_text("1.0.5\n", encoding="utf-8")

          replace_exact("app/__init__.py", '__version__ = "1.0.4"', '__version__ = "1.0.5"')
          replace_exact("scripts/marzban.sh", 'CLI_RELEASE_VERSION="v1.0.4"', 'CLI_RELEASE_VERSION="v1.0.5"')
          replace_exact("docker-compose.yml", 'ghcr.io/smorad3363/marzban-v1:v1.0.4', 'ghcr.io/smorad3363/marzban-v1:v1.0.5')
          replace_exact("tests/test_release_contract.py", 'assert version == "1.0.4"', 'assert version == "1.0.5"')
          replace_exact(
              "tests/test_release_contract.py",
              'current_notes = Path("docs/RELEASE_NOTES_v1.0.4.md").read_text(encoding="utf-8")',
              'current_notes = Path("docs/RELEASE_NOTES_v1.0.5.md").read_text(encoding="utf-8")',
          )
          replace_exact(
              "tests/test_release_contract.py",
              'assert "admin" in current_notes.lower()\n    assert "user" in current_notes.lower()\n    assert "org.opencontainers.image.revision" in current_notes',
              'assert "dashboard" in current_notes.lower()\n    assert "node" in current_notes.lower()\n    assert "marzban update" in current_notes',
          )

          Path("docs/RELEASE_NOTES_v1.0.5.md").write_text("""# Marzban v1.0.5\n\nThis patch release ships the reviewed dashboard UX updates accumulated after v1.0.4.\n\n## Changes\n\n- Normalizes the Dashboard palette around shared theme tokens for consistent Light, Dark, and Black Gold rendering.\n- Fixes Black Gold contrast so text remains readable on dark surfaces.\n- Removes the redundant Marzban management subtitle from the welcome header.\n- Restores the real Owner-only live Node bandwidth panel backed by the existing `/api/nodes/bandwidth` endpoint.\n- Preserves the dense RTL Users table and its no-horizontal-scroll behavior.\n- Keeps external/API-backed rotating header copy deferred; no new external API dependency is introduced.\n- Preserves the existing Plan / Access Group separation and all v1.0.4 backend behavior.\n\n## Update\n\nUpdate an existing installation to the newest published stable release:\n\n```bash\nmarzban update\n```\n\nOr pin this exact release:\n\n```bash\nmarzban update --version v1.0.5\n```\n\nThe updater creates a pre-update recovery snapshot and verifies the runtime, CLI version, source revision, image and MySQL state before reporting success.\n\n## Fresh install\n\n```bash\nsudo bash -c \"$(curl -fsSL https://raw.githubusercontent.com/smorad3363/Marzban-v1/v1.0.5/scripts/marzban.sh)\" @ install --version v1.0.5 --database mysql\n```\n\nAfter a fresh install, create the first Owner if needed:\n\n```bash\nmarzban create-owner USERNAME\n```\n\nPublished v1.0.0 through v1.0.4 remain immutable and unchanged.\n""", encoding="utf-8")
          PY
          bash -n scripts/marzban.sh
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci

      - name: Run dashboard UX contract
        working-directory: app/dashboard
        run: npm run test:admin-ux

      - name: Rebuild committed dashboard for 1.0.5
        working-directory: app/dashboard
        run: VITE_BASE_API=/api/ npm run build -- --assetsDir statics

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify release contract
        run: |
          python -m pip install -r requirements.txt pytest >/dev/null
          python -m pytest -q tests/test_release_contract.py
          test "$(tr -d '[:space:]' < VERSION)" = "1.0.5"
          grep -Fx '__version__ = "1.0.5"' app/__init__.py
          grep -Fx 'CLI_RELEASE_VERSION="v1.0.5"' scripts/marzban.sh
          grep -Fq 'ghcr.io/smorad3363/marzban-v1:v1.0.5' docker-compose.yml
          test -s docs/RELEASE_NOTES_v1.0.5.md
          git diff --check

      - name: Commit prepared release and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION app/__init__.py scripts/marzban.sh docker-compose.yml tests/test_release_contract.py docs/RELEASE_NOTES_v1.0.5.md app/dashboard/build
          git commit -m "release: prepare Marzban v1.0.5"
          git rm .github/workflows/_prepare_v1_0_5.yml
          git commit -m "ci: remove temporary v1.0.5 preparation workflow"
          git push origin HEAD:release/v1.0.5
