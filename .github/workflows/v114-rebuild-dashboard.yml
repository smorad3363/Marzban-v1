name: Rebuild v1.1.4 dashboard

on:
  push:
    branches:
      - release/v1.1.4

permissions:
  contents: write

jobs:
  rebuild-dashboard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - name: Build dashboard
        working-directory: app/dashboard
        run: |
          npm ci
          VITE_BASE_API=/api/ npm run build
      - name: Commit generated dashboard
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/dashboard/build
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'build: regenerate dashboard for v1.1.4'
          git push origin HEAD:release/v1.1.4
