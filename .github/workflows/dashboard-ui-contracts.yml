name: Dashboard UI Contracts

on:
  push:
    branches:
      - main
    paths:
      - "app/dashboard/src/**"
      - "app/dashboard/scripts/test-stage1-ui-contracts.cjs"
      - "app/dashboard/build/**"
      - "scripts/stage8_reconcile.py"
      - ".github/workflows/dashboard-ui-contracts.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/dashboard/src/**"
      - "app/dashboard/scripts/test-stage1-ui-contracts.cjs"
      - "app/dashboard/build/**"
      - ".github/workflows/dashboard-ui-contracts.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dashboard-contracts:
    name: dashboard contracts, build and parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Stage 8 reconciliation patch
        id: stage8
        shell: bash
        run: |
          if test -f scripts/stage8_reconcile.py; then
            python scripts/stage8_reconcile.py
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci

      - name: Verify Stage 1 UI contracts
        working-directory: app/dashboard
        run: node scripts/test-stage1-ui-contracts.cjs

      - name: Type-check and build dashboard
        working-directory: app/dashboard
        run: VITE_BASE_API=/api/ npm run build

      - name: Verify dashboard build output
        run: test -f app/dashboard/build/index.html && test -f app/dashboard/build/404.html

      - name: Commit reconciled source and dashboard build
        if: steps.stage8.outputs.applied == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/stage8_reconcile.py
          git add \
            app/models/admin_hierarchy.py \
            app/utils/access_groups.py \
            app/dashboard/src/types/Admin.ts \
            app/dashboard/src/components/UserDialog.tsx \
            app/dashboard/src/components/AccessGroupManager.tsx \
            tests/test_access_group_admin_assignment_validation.py \
            tests/test_access_group_admin_permissions_contract.py \
            app/dashboard/build
          git diff --cached --quiet && { echo "Stage 8 reconciliation produced no changes" >&2; exit 1; }
          git commit -m "fix(access-groups): reconcile legacy policy UI contract"
          git push origin HEAD:main

      - name: Verify committed dashboard build parity
        run: git diff --exit-code -- app/dashboard/build
