name: Apply V1.0.2 Built-in Node Deployment

on:
  push:
    branches:
      - release/v1.0.2
    paths:
      - .github/workflows/apply-v102-node-deployment.yml

permissions:
  contents: write

env:
  SQLALCHEMY_DATABASE_URL: mysql+pymysql://marzban:test@127.0.0.1:3306/marzban_test
  DEBUG: "false"

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest httpx
      - name: Apply context-checked deployment patch
        run: python .github/scripts/apply_v102_node_deployment.py
      - name: Enforce deployment patch scope
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          printf '%s\n' "${changed[@]}"
          for path in "${changed[@]}"; do
            case "$path" in
              scripts/marzban.sh|docker-compose.node.yml|tests/test_v102_node_deployment.py|.github/workflows/v1.0.2-checkpoints.yml) ;;
              *) echo "Unexpected deployment patch path: $path" >&2; exit 1 ;;
            esac
          done
          test "${#changed[@]}" -eq 4
      - name: Installer syntax and contract
        run: |
          bash -n scripts/marzban.sh
          bash tests/test_installer_v1_contract.sh
      - name: Focused deployment tests
        run: python -m pytest -q tests/test_v102_node_deployment.py tests/test_release_contract.py
      - name: Render Node compose
        env:
          MARZBAN_NODE_IMAGE: ghcr.io/smorad3363/marzban-v1:v1.0.1
          NODE_RUNTIME_VERSION: v1.0.1
        run: |
          docker compose -f docker-compose.node.yml config > /tmp/node-compose.yml
          test "$(docker compose -f docker-compose.node.yml config --services)" = "marzban-node"
          grep -F 'node_runtime.main' docker-compose.node.yml
          grep -F 'SSL_CLIENT_CERT_FILE: /var/lib/marzban-node/panel-client.crt' /tmp/node-compose.yml
          if grep -Eiq 'mysql|sqlalchemy' /tmp/node-compose.yml; then
            echo 'Node compose unexpectedly contains database configuration' >&2
            exit 1
          fi
      - name: Diff hygiene
        run: git diff --check scripts/marzban.sh docker-compose.node.yml tests/test_v102_node_deployment.py .github/workflows/v1.0.2-checkpoints.yml
      - name: Commit deployment checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "Eliot"
          git config user.email "42266703+smorad3363@users.noreply.github.com"
          git add scripts/marzban.sh docker-compose.node.yml tests/test_v102_node_deployment.py .github/workflows/v1.0.2-checkpoints.yml
          git diff --cached --quiet && { echo 'No deployment changes to commit'; exit 1; }
          git commit -m "feat: add built-in node runtime deployment"
          git push origin HEAD:release/v1.0.2
