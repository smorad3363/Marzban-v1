name: Dispatch v1.0.7 release once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dispatch-v107-once.yml"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch official Release workflow on v1.0.7
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.0.7" --jq '.object.sha' | grep -qx '09595ae03bacc88620bd3d1fa4e95ac86e98bb3e'
          gh workflow run build.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref v1.0.7 \
            -f git_ref=v1.0.7 \
            -f image_tag=v1.0.7 \
            -f tests_only=false
