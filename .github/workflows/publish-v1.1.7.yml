name: Publish v1.1.7 once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.1.7.yml

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SOURCE_SHA: c0775a624b7081f794b492e4596bbc484aa6be02
      VERSION_TAG: v1.1.7
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify immutable reviewed source
        shell: bash
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor "${SOURCE_SHA}" HEAD
          test "$(git show "${SOURCE_SHA}:VERSION" | tr -d '[:space:]')" = "1.1.7"
          test "$(git show "${SOURCE_SHA}:app/__init__.py" | grep -F '__version__ = "1.1.7"' | wc -l)" -eq 1
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION_TAG}" >/dev/null 2>&1; then
            echo "Tag ${VERSION_TAG} already exists; refusing to recreate or move it." >&2
            exit 1
          fi

      - name: Create immutable v1.1.7 tag
        shell: bash
        run: |
          set -Eeuo pipefail
          git tag "${VERSION_TAG}" "${SOURCE_SHA}"
          git push origin "refs/tags/${VERSION_TAG}"
          remote_sha="$(git ls-remote --tags origin "refs/tags/${VERSION_TAG}" | awk '{print $1}')"
          test "${remote_sha}" = "${SOURCE_SHA}"

      - name: Dispatch canonical Release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh workflow run build.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f git_ref="${VERSION_TAG}" \
            -f image_tag="${VERSION_TAG}" \
            -f tests_only=false
