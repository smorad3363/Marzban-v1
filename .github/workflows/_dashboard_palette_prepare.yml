name: Prepare dashboard palette and node bandwidth

on:
  push:
    branches:
      - ui/dashboard-palette-node-speed

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/dashboard-palette-node-speed
          fetch-depth: 0

      - name: Apply scoped dashboard updates
        run: python scripts/_dashboard_palette_prepare.py

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci

      - name: Run dashboard UX contract
        working-directory: app/dashboard
        run: npm run test:admin-ux

      - name: Build canonical dashboard
        working-directory: app/dashboard
        run: VITE_BASE_API=/api/ npm run build

      - name: Commit prepared dashboard
        shell: bash
        run: |
          set -Eeuo pipefail
          git add app/dashboard scripts/_dashboard_palette_prepare.py
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(dashboard): normalize palette and restore node bandwidth"
          git push origin HEAD:ui/dashboard-palette-node-speed
