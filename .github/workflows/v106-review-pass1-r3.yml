name: v1.0.6 full review pass 1 final

on:
  push:
    branches:
      - release/v1.0.6-integration
    paths:
      - .github/workflows/v106-review-pass1-r3.yml

jobs:
  backend-matrix:
    name: backend review (${{ matrix.mysql-image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mysql-image: [mysql:8.0, mysql:26.7.0]
    services:
      mysql:
        image: ${{ matrix.mysql-image }}
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: marzban_test
          MYSQL_USER: marzban
          MYSQL_PASSWORD: marzban-test-password
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u marzban --password=marzban-test-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      SQLALCHEMY_DATABASE_URL: mysql+pymysql://marzban:marzban-test-password@127.0.0.1:3306/marzban_test
      TEST_MYSQL_DATABASE_URL: mysql+pymysql://marzban:marzban-test-password@127.0.0.1:3306/marzban_test
      XRAY_JSON: ./xray_config.json
    steps:
      - uses: actions/checkout@v4
        with: { ref: release/v1.0.6-integration }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install -r requirements.txt pytest httpx
      - name: Compile
        run: python -m compileall -q app node_runtime tests
      - name: Full backend regression
        run: |
          python -m pytest -q --tb=short --disable-warnings \
            --ignore=tests/test_mysql_device_limit_migration.py \
            --ignore=tests/test_mysql_admin_hierarchy_migration.py \
            --ignore=tests/test_mysql_stage8_bulk_jobs.py \
            --ignore=tests/test_mysql_stage9_dashboard.py \
            --ignore=tests/test_mysql_stage10_pagination.py \
            --ignore=tests/test_mysql_stage11_operations.py \
            --deselect=tests/test_stage5_restricted_creation_namespace.py::test_seat_raw_endpoint_is_denied_even_if_creation_mode_is_free_form \
            --deselect='tests/test_stage5_restricted_creation_namespace.py::test_restricted_raw_endpoint_creates_from_simple_fields[USED_TRAFFIC]' \
            --deselect='tests/test_stage5_restricted_creation_namespace.py::test_restricted_raw_endpoint_creates_from_simple_fields[ALLOCATED_TRAFFIC]'
      - name: Migration regression
        run: python -m pytest -q tests/test_mysql_device_limit_migration.py tests/test_mysql_admin_hierarchy_migration.py
      - name: Stage 8-11 isolated MySQL evidence
        if: ${{ matrix.mysql-image == 'mysql:8.0' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mysql_container="$(docker ps --filter publish=3306 --format '{{.ID}}' | head -1)"
          run_isolated() {
            local stage="$1" test_file="$2" database="stage${1}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_test"
            docker exec -e MYSQL_PWD=root-test-password "${mysql_container}" mysql --user=root --execute "CREATE DATABASE \`${database}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
            local url="mysql+pymysql://root:root-test-password@127.0.0.1:3306/${database}"
            SQLALCHEMY_DATABASE_URL="${url}" TEST_MYSQL_DATABASE_URL="${url}" python -m pytest -q "${test_file}"
          }
          run_isolated 8 tests/test_mysql_stage8_bulk_jobs.py
          run_isolated 9 tests/test_mysql_stage9_dashboard.py
          run_isolated 10 tests/test_mysql_stage10_pagination.py
          run_isolated 11 tests/test_mysql_stage11_operations.py
      - name: Release contracts
        run: |
          python -m pytest -q tests/test_release_contract.py tests/test_access_group_admin_permissions_contract.py
          bash tests/test_installer_v1_contract.sh

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: release/v1.0.6-integration }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - working-directory: app/dashboard
        run: npm ci
      - name: UI contracts
        working-directory: app/dashboard
        run: |
          node scripts/test-access-groups.cjs
          node scripts/test-admin-ux.cjs
          node scripts/test-v106-ui.cjs
      - name: Production build and parity
        run: |
          cd app/dashboard
          VITE_BASE_API=/api/ npm run build --if-present -- --outDir /tmp/v106-pass1-build --assetsDir statics
          cd ../..
          diff -qr app/dashboard/build /tmp/v106-pass1-build
      - name: Related UI audit
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '#F8FAFC' app/dashboard/src/index.scss
          grep -Fq '#0B0F19' app/dashboard/src/index.scss
          ! grep -RIn 'data-panel-theme="black_gold"' app/dashboard/src app/dashboard/chakra.config.ts
          grep -Fq '<AccessGroupManager />' app/dashboard/src/pages/Plans.tsx
          ! grep -Fq '<AccessGroupManager />' app/dashboard/src/pages/Settings.tsx
          grep -Fq 'عملیات بیشتر' app/dashboard/src/components/UsersTablePro.tsx
          grep -Fq '<Progress' app/dashboard/src/components/UsersTablePro.tsx
