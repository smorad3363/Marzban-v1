name: Temporary v1.1.5 release publisher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v115-release-publish.yml'

permissions:
  contents: write
  actions: write

jobs:
  publish-v115:
    runs-on: ubuntu-24.04
    env:
      RELEASE_SHA: 4d3e2f8180793f2073831b2b2ef9b4744489be17
      RELEASE_TAG: v1.1.5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify immutable v1.1.5 source
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "${RELEASE_SHA}" origin/main
          test "$(git show "${RELEASE_SHA}:VERSION" | tr -d '\r\n')" = "1.1.5"
          git show "${RELEASE_SHA}:app/__init__.py" | grep -F '__version__ = "1.1.5"'
          git show "${RELEASE_SHA}:scripts/marzban.sh" | grep -F 'CLI_RELEASE_VERSION="v1.1.5"'
          git show "${RELEASE_SHA}:docker-compose.yml" | grep -F 'ghcr.io/smorad3363/marzban-v1:v1.1.5'
          git cat-file -e "${RELEASE_SHA}:docs/RELEASE_NOTES_v1.1.5.md"
          if git show "${RELEASE_SHA}:app/routers/admin.py" | grep -Fq 'admin_delete_credit_unsettled'; then
            echo 'stale Admin deletion blocker is still present' >&2
            exit 1
          fi
      - name: Create immutable tag
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --tags --force origin
          if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
            test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${RELEASE_SHA}"
          else
            git tag "${RELEASE_TAG}" "${RELEASE_SHA}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${RELEASE_SHA}"
      - name: Dispatch canonical release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh workflow run build.yml --ref main \
            -f git_ref=v1.1.5 \
            -f image_tag=v1.1.5 \
            -f tests_only=false
