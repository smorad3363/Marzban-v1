name: Rebuild v1.1.3 dashboard

on:
  push:
    branches: [release/v1.1.3]

permissions:
  contents: write

jobs:
  rebuild-dashboard:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci
      - name: Run v1.1.3 regression contracts
        working-directory: app/dashboard
        run: npm run test:v1.1.3
      - name: Build dashboard
        working-directory: app/dashboard
        run: VITE_BASE_API=/api/ npm run build
      - name: Commit dashboard build
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/build
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Dashboard build already matches source."
            exit 0
          fi
          git commit -m "build: regenerate dashboard for v1.1.3"
          git push origin HEAD:release/v1.1.3

# armed
