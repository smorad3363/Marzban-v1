name: Apply V1.0.2 IP Enforcement Guard

on:
  push:
    branches:
      - release/v1.0.2
    paths:
      - .github/workflows/apply-v102-ip-enforcement-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply context-checked guard
        run: |
          set -Eeuo pipefail
          python .github/scripts/apply_v102_ip_enforcement_guard.py
          python -m compileall -q app/device_limit app/models app/routers
          git diff --check
      - name: Run focused guard tests
        run: |
          python -m pip install -r requirements.txt pytest httpx
          python -m pytest -q tests/test_v102_node_ip_policy.py
      - name: Commit guard
        run: |
          set -Eeuo pipefail
          git config user.name "Eliot"
          git config user.email "42266703+smorad3363@users.noreply.github.com"
          git add app/device_limit/engine.py app/models/device_limit.py app/routers/node.py tests/test_v102_node_ip_policy.py
          git diff --cached --check
          git commit -m "feat: fail closed for untrusted node IP sources"
          git push origin HEAD:release/v1.0.2
