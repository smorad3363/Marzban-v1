name: Prepare v1.1.9 Once

on:
  push:
    branches:
      - release/v1.1.9

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.9
          fetch-depth: 0

      - name: Prepare release surfaces and notes
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "1.1.8"
          grep -Fx '__version__ = "1.1.8"' app/__init__.py
          grep -Fx 'CLI_RELEASE_VERSION="v1.1.8"' scripts/marzban.sh
          grep -Fq 'ghcr.io/smorad3363/marzban-v1:v1.1.8' docker-compose.yml

          printf '1.1.9\n' > VERSION
          sed -i 's/__version__ = "1\.1\.8"/__version__ = "1.1.9"/' app/__init__.py
          sed -i 's/CLI_RELEASE_VERSION="v1\.1\.8"/CLI_RELEASE_VERSION="v1.1.9"/' scripts/marzban.sh
          sed -i 's#ghcr.io/smorad3363/marzban-v1:v1\.1\.8#ghcr.io/smorad3363/marzban-v1:v1.1.9#' docker-compose.yml

          cat > RELEASES.md <<'EOF'
          # Versioned releases and rollback

          Every published release uses an immutable Git tag and permanent container tags:

          - `ghcr.io/smorad3363/marzban-v1:vX.Y.Z`
          - `ghcr.io/smorad3363/marzban-v1:sha-<commit-sha>`

          `latest` points only to the newest stable tagged release. Older version and SHA
          tags are never replaced.

          ## Release target: v1.1.9

          v1.1.9 is the next stable release target. Complete release notes are in
          `docs/RELEASE_NOTES_v1.1.9.md`.

          Update to v1.1.9 after publication:

          ```bash
          marzban update --version v1.1.9
          ```

          Fresh-install v1.1.9 with MySQL after publication:

          ```bash
          sudo bash -c "$(curl -fsSL https://raw.githubusercontent.com/smorad3363/Marzban-v1/v1.1.9/scripts/marzban.sh)" @ install --version v1.1.9 --database mysql
          ```

          The existing `v1.1.7` and `v1.1.8` source tags remain immutable, and all previously published tags and releases remain unchanged. Preparing this target does not create or move any tag or container alias.

          ## Release process

          1. Update all four version surfaces in one reviewed change: `VERSION`,
             `app.__version__`, `CLI_RELEASE_VERSION`, and the application image in
             `docker-compose.yml`.
          2. Verify the matching `docs/RELEASE_NOTES_vX.Y.Z.md` exists and contains the
             actual release notes and install/update commands.
          3. Merge only after the protected `main` required checks pass.
          4. Create immutable tag `vX.Y.Z` from the reviewed `main` commit.
          5. The tag-triggered `Release` workflow re-runs backend/migration checks, verifies
             dashboard parity and version surfaces, builds the multi-architecture image,
             publishes version/SHA tags, and creates the GitHub Release from the maintained
             notes file.
          6. Verify the published digest and installer with the manual verification
             workflows. Verification never creates or moves a release tag.

          ## Update and install

          Update to the newest stable published release:

          ```bash
          marzban update
          ```

          Update to an exact stable release:

          ```bash
          marzban update --version v1.1.9
          ```

          Fresh-install an exact release:

          ```bash
          sudo bash -c "$(curl -fsSL https://raw.githubusercontent.com/smorad3363/Marzban-v1/v1.1.9/scripts/marzban.sh)" @ install --version v1.1.9 --database mysql
          ```

          ## Rollback

          Take and verify a database backup before changing versions. Application rollback
          changes the application image only; it does not automatically downgrade database
          migrations.

          ```bash
          marzban rollback v1.1.8
          ```

          MySQL server downgrade is a separate operation and must use the physical backup
          created before a MySQL upgrade; in-place MySQL downgrade is not supported.
          EOF
          sed -i 's/^          //' RELEASES.md

          cat > docs/RELEASE_NOTES_v1.1.9.md <<'EOF'
          # Marzban v1.1.9

          ## Highlights

          - Redesign the dedicated Users Management surface into a compact, role-aware operational workspace while preserving the existing create/edit/delete/renew/enable-disable/reset/revoke/QR/Audit/Device/bulk capabilities.
          - Add authorization-scoped `/api/users/summary` aggregates for total users, current activity, near-expiry users, and low-volume attention without fetching the full user set in the browser.
          - Add pagination-safe `/api/users/management` filtering for Admin scope, current Plan/no-Plan/Trial, account status, expiry, usage, device-limit, inactivity, and attention signals while preserving hierarchy and inbound authorization.
          - Resolve current Plan metadata from the latest immutable `UserPlanAssignment` for only the visible page, avoiding per-row Plan requests.
          - Add a compact responsive table, User Details Drawer, lazy Device and Audit/Activity loading, and a sticky bulk-action surface with cross-page selection semantics preserved.
          - Keep account status separate from current-activity semantics, preserve the established 24-hour Online definition, and keep Plan as commercial entitlement while Access Group remains the network-topology authority.
          - Harden summary failure UX so a failed aggregate request renders an unavailable state instead of misleading real zero counts.
          - Preserve Owner/Admin scope, billing confidentiality, installer safeguards, Node Runtime V2, and Panel-to-Node mTLS architecture.

          ## Upgrade

          ```bash
          marzban update --version v1.1.9
          ```

          ## Fresh install

          ```bash
          sudo bash -c "$(curl -fsSL https://raw.githubusercontent.com/smorad3363/Marzban-v1/v1.1.9/scripts/marzban.sh)" @ install --version v1.1.9 --database mysql
          ```

          ## Node Runtime

          Use the same immutable release when installing or updating the built-in Node Runtime:

          ```bash
          sudo bash -c "$(curl -fsSL https://raw.githubusercontent.com/smorad3363/Marzban-v1/v1.1.9/scripts/marzban.sh)" @ install-script v1.1.9
          sudo marzban node install --version v1.1.9
          ```

          For an existing Node installation:

          ```bash
          sudo marzban node update --version v1.1.9
          sudo marzban node doctor
          ```

          ## Validation

          - Users Management backend scope, summary, pagination, Plan/no-Plan/Trial, expiry, usage, inactivity, device-limit, and attention coverage must pass on the final release source.
          - Dashboard Stage 1 contracts, authenticated-autofill contract, TypeScript production build, output verification, and committed dashboard parity must pass.
          - Backend regression, authorization/scope coverage, migrations/partial-DDL recovery, Stage 8-11 evidence, backup/restore, and v4.8.0 rollback compatibility must pass against MySQL 8.0 and MySQL 26.7.0.
          - Installer syntax/contracts, panel compose, built-in Node compose, MySQL 8.0 logical dump -> 26.7.0 restore, release-image runtime, and Panel-to-Node mTLS contracts must pass before publication.
          - The immutable `v1.1.9` tag must resolve to the exact reviewed release commit on `main`; publication must not move or recreate it.
          - The canonical Release workflow must publish and anonymously verify multi-architecture `linux/amd64` and `linux/arm64` GHCR images and create the GitHub Release from this file.
          EOF
          sed -i 's/^          //' docs/RELEASE_NOTES_v1.1.9.md

          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CODEX/STATE.md')
          text = p.read_text()
          old = '## Current State: v1.1.8 released\n'
          if old not in text:
              raise SystemExit('expected v1.1.8 state heading not found')
          current = '''## Current State: v1.1.9 release candidate\n\n- Release task: Users Management V3 + `v1.1.9` publication.\n- Pull request `#41` was squash-merged into `main`.\n- Reviewed Users Management PR head: `0a9d1780f68507cb3561211baebe46dd600298e5`.\n- Users Management main commit: `ab98e693226eeaf3fea052e1d67f9c630f687393`.\n- `v1.1.8` remains the latest published stable release until the new immutable tag and Release workflow complete.\n- Release surfaces are prepared for `1.1.9` / `v1.1.9`; no tag, container alias, or GitHub Release is created by this preparation checkpoint.\n- NEXT EXACT TASK: review and merge this release preparation, then create immutable tag `v1.1.9` from the reviewed `main` release commit and verify the canonical Release workflow.\n\n## Previous Release: v1.1.8 released\n'''
          p.write_text(text.replace(old, current, 1))
          PY

          rm .github/workflows/prepare-v1.1.9-once.yml

          bash -n scripts/marzban.sh
          test "$(tr -d '[:space:]' < VERSION)" = "1.1.9"
          grep -Fx '__version__ = "1.1.9"' app/__init__.py
          grep -Fx 'CLI_RELEASE_VERSION="v1.1.9"' scripts/marzban.sh
          grep -Fq 'ghcr.io/smorad3363/marzban-v1:v1.1.9' docker-compose.yml
          test -s docs/RELEASE_NOTES_v1.1.9.md

      - name: Commit prepared release candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add VERSION app/__init__.py scripts/marzban.sh docker-compose.yml RELEASES.md docs/RELEASE_NOTES_v1.1.9.md docs/CODEX/STATE.md .github/workflows/prepare-v1.1.9-once.yml
          git commit -m 'chore: prepare v1.1.9 release'
          git push origin HEAD:release/v1.1.9
