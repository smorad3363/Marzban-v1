name: Refresh Users Dashboard Build

on:
  push:
    branches:
      - feat/users-management-v3
    paths:
      - ".github/workflows/refresh-users-dashboard-build.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/users-management-v3
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci

      - name: Build dashboard from source
        working-directory: app/dashboard
        run: VITE_BASE_API=/api/ npm run build

      - name: Commit generated dashboard assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/build
          if git diff --cached --quiet; then
            echo "Dashboard build is already current."
            exit 0
          fi
          git commit -m "build(ui): refresh final users management dashboard"
          git push origin HEAD:feat/users-management-v3
