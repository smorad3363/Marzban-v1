name: Verify v1.0.6 palette cleanup

on:
  push:
    branches:
      - release/v1.0.6-integration
    paths:
      - .github/workflows/v106-palette-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.6-integration
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - name: Apply palette cleanup
        run: python .github/scripts/v106_palette_cleanup.py
      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci
      - name: Run all dashboard UX contracts
        working-directory: app/dashboard
        run: |
          node scripts/test-access-groups.cjs
          node scripts/test-admin-ux.cjs
          node scripts/test-v106-ui.cjs
      - name: Build dashboard
        working-directory: app/dashboard
        env:
          VITE_BASE_API: /api/
        run: |
          rm -rf build
          npm run build --if-present -- --outDir build --assetsDir statics
          test -s build/index.html
          test -s build/404.html
      - name: Assert stale dark palette is gone from active UI
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RInE '#111d17|#0c1524|#0c1712|#0e1914|#101e17|#0d1812|#0b1710|#07130e|#f1f5f2' app/dashboard/src --include='*.tsx' --include='*.scss' --include='*.ts'
          ! grep -RIn 'data-panel-theme="black_gold"' app/dashboard/src app/dashboard/chakra.config.ts
      - name: Commit verified cleanup
        run: |
          set -euo pipefail
          git rm .github/workflows/v106-palette-cleanup.yml .github/workflows/v106-ui-audit.yml .github/scripts/v106_palette_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "style: finish light and dark dashboard consistency"
          git push origin HEAD:release/v1.0.6-integration
