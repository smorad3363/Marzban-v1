name: Verify v1.0.7 integration r5

on:
  push:
    branches: [release/v1.0.7-integration]
    paths: [.github/workflows/v107-verify-r5.yml]

permissions:
  contents: write
  actions: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.7-integration
          fetch-depth: 0

      - name: Apply release-gate corrections
        run: python .github/scripts/fix_v107_backend_contracts.py

      - name: Verify corrected source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          notes = Path('docs/RELEASE_NOTES_v1.0.7.md').read_text()
          test = Path('tests/test_v102_node_ip_policy.py').read_text()
          workspace = Path('app/dashboard/src/components/NodesManagementWorkspace.tsx').read_text()
          assert 'marzban update' in notes
          assert 'NodesManagementWorkspace.tsx' in test
          assert 'name="ip_source_mode"' in workspace
          assert 'name="trusted_proxy_cidrs"' in workspace
          assert 'تنظیمات منبع IP فقط باید برای پراکسی‌های کاملاً مورد اعتماد فعال شود.' in workspace
          print('v1.0.7 corrected release/node contracts: OK')
          PY
          git diff --check

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci

      - name: Recheck all dashboard contracts
        working-directory: app/dashboard
        run: |
          set -Eeuo pipefail
          node scripts/test-access-groups.cjs
          node scripts/test-admin-ux.cjs
          node scripts/test-v106-ui.cjs
          node scripts/test-v107-ui.cjs

      - name: Build dashboard
        working-directory: app/dashboard
        run: npm run build

      - name: Commit corrected v1.0.7 product tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/RELEASE_NOTES_v1.0.7.md tests/test_v102_node_ip_policy.py app/dashboard/build
          git diff --cached --quiet && { echo "No corrections staged"; exit 1; }
          git commit -m "fix: align node IP contract with management workspace"
          git push origin HEAD:release/v1.0.7-integration
          echo "PRODUCT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch official MySQL compatibility suite
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh workflow run build.yml \
            --ref release/v1.0.7-integration \
            -f git_ref=release/v1.0.7-integration \
            -f image_tag=v1.0.7 \
            -f tests_only=true
          for attempt in $(seq 1 30); do
            run_id="$(gh run list --workflow build.yml --branch release/v1.0.7-integration --event workflow_dispatch --limit 10 --json databaseId,headSha --jq '.[] | select(.headSha == env.PRODUCT_SHA) | .databaseId' | head -1)"
            if [ -n "$run_id" ]; then
              echo "OFFICIAL_RUN_ID=$run_id" >> "$GITHUB_ENV"
              echo "Official compatibility run: $run_id"
              exit 0
            fi
            sleep 2
          done
          echo "Could not resolve official compatibility run" >&2
          exit 1

      - name: Wait for official MySQL compatibility suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch "$OFFICIAL_RUN_ID" --exit-status
