name: Trigger v1.1.3 repair builder v4

on:
  push:
    branches: [release/v1.1.3]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.3
          fetch-depth: 0

      - name: Apply reviewed repair and migration
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import ast

          source = Path('.github/workflows/patch-v1.1.3-branch.yml').read_text()
          block = source.split("python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          program = "\n".join(line[10:] if line.startswith("          ") else line for line in block.splitlines())
          marker_a = "# New Alembic head for the Admin retirement marker."
          marker_b = "# Lightweight source-contract gate for the exact v1.1.3 regressions."
          prefix, rest = program.split(marker_a, 1)
          _old_migration, suffix = rest.split(marker_b, 1)
          exec(compile(prefix, 'v1.1.3-repair-prefix', 'exec'))

          versions = Path('app/db/migrations/versions')

          def assignment_value(tree, name):
              for node in tree.body:
                  if isinstance(node, ast.Assign):
                      if any(isinstance(target, ast.Name) and target.id == name for target in node.targets):
                          return ast.literal_eval(node.value)
                  if isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name) and node.target.id == name:
                      return ast.literal_eval(node.value)
              return None

          revisions = set()
          referenced = set()
          for item in versions.glob('*.py'):
              tree = ast.parse(item.read_text())
              revision = assignment_value(tree, 'revision')
              down = assignment_value(tree, 'down_revision')
              if isinstance(revision, str):
                  revisions.add(revision)
              if isinstance(down, str):
                  referenced.add(down)
              elif isinstance(down, (tuple, list)):
                  referenced.update(value for value in down if isinstance(value, str))
          heads = sorted(revisions - referenced)
          if len(heads) != 1:
              raise SystemExit(f'Expected one Alembic head, found {heads}')
          head = heads[0]
          lines = [
              '"""add Admin retirement marker',
              '',
              'Revision ID: e7b1c4d9a213',
              f'Revises: {head}',
              '"""',
              'from alembic import op',
              'import sqlalchemy as sa',
              '',
              'revision = "e7b1c4d9a213"',
              f'down_revision = "{head}"',
              'branch_labels = None',
              'depends_on = None',
              '',
              '',
              'def upgrade():',
              '    op.add_column("admins", sa.Column("deleted_at", sa.DateTime(), nullable=True))',
              '    op.create_index("ix_admins_deleted_at", "admins", ["deleted_at"], unique=False)',
              '',
              '',
              'def downgrade():',
              '    op.drop_index("ix_admins_deleted_at", table_name="admins")',
              '    op.drop_column("admins", "deleted_at")',
              '',
          ]
          (versions / 'e7b1c4d9a213_add_admin_deleted_at.py').write_text('\n'.join(lines))
          exec(compile(marker_b + suffix, 'v1.1.3-repair-suffix', 'exec'))
          PY
          python -m compileall -q app

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Regenerate committed dashboard build
        working-directory: app/dashboard
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/test-v1.1.3-regressions.cjs')
          text = path.read_text().replace('\\n', '\n')
          old = 'const read = (path) => fs.readFileSync(path, "utf8");'
          new = '''const nodePath = require("path");
          const read = (file) => fs.readFileSync(
            file.startsWith("../../")
              ? nodePath.resolve(__dirname, file)
              : nodePath.resolve(__dirname, "..", file),
            "utf8"
          );'''
          if old not in text:
              raise SystemExit('v1.1.3 regression read helper anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          npm ci
          npm run test:v1.1.3
          VITE_BASE_API=/api/ npm run build
          cp build/index.html build/404.html

      - name: Commit repaired source and build
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests
          git diff --cached --check
          git commit -m "fix: repair admin deletion and plan access regressions"
          git push origin HEAD:release/v1.1.3
