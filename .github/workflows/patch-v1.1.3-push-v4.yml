name: Trigger v1.1.3 repair builder v4

on:
  push:
    branches: [release/v1.1.3]

permissions:
  contents: write

jobs:
  access-group-security-followup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: marzban_test
          MYSQL_USER: marzban
          MYSQL_PASSWORD: marzban-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u marzban --password=marzban-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      SQLALCHEMY_DATABASE_URL: mysql+pymysql://marzban:marzban-test-password@127.0.0.1:3306/marzban_test
      TEST_MYSQL_DATABASE_URL: mysql+pymysql://marzban:marzban-test-password@127.0.0.1:3306/marzban_test
      XRAY_JSON: ./xray_config.json
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.3
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Enforce Admin inbound ceiling for existing Access Group bindings
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("app/utils/access_groups.py")
          source = path.read_text()

          helper_anchor = "\n\ndef validated_scope(\n"
          helper = '''\n\ndef _require_admin_network_scope(\n    db: Session,\n    inbounds: set[str],\n    admin_id: int,\n) -> None:\n    \"\"\"Keep existing bindings inside the owning Admin's inbound ceiling.\"\"\"\n    settings = db.get(MarzhelpAdminSettings, admin_id)\n    if settings is None:\n        raise admin_hierarchy.HierarchyError(\"policy_missing\", \"Administrator policy is missing\")\n    if not settings.all_inbounds:\n        forbidden = inbounds - set(settings.allowed_inbounds or [])\n        if forbidden:\n            raise admin_hierarchy.HierarchyError(\n                \"access_group_scope_forbidden\",\n                f\"Access Group exceeds Admin scope: {sorted(forbidden)}\",\n            )\n'''
          if "def _require_admin_network_scope(" not in source:
              if helper_anchor not in source:
                  raise SystemExit("validated_scope helper anchor missing")
              source = source.replace(helper_anchor, helper + helper_anchor, 1)

          old = '''    settings = db.get(MarzhelpAdminSettings, admin_id)\n    if settings is None:\n        raise admin_hierarchy.HierarchyError(\"policy_missing\", \"Administrator policy is missing\")\n    if not settings.all_inbounds:\n        forbidden = inbounds - set(settings.allowed_inbounds or [])\n        if forbidden:\n            raise admin_hierarchy.HierarchyError(\n                \"access_group_scope_forbidden\",\n                f\"Access Group exceeds Admin scope: {sorted(forbidden)}\",\n            )\n    return inbounds, hosts, nodes\n'''
          new = '''    _require_admin_network_scope(db, inbounds, admin_id)\n    return inbounds, hosts, nodes\n'''
          if old not in source:
              raise SystemExit("validated_scope ceiling block missing")
          source = source.replace(old, new, 1)

          old = '''    for user in users:\n        # This is maintenance of an existing binding, not a new selection.\n        _apply_network_to_user(db, user, inbounds)\n        user.access_group_id = group.id\n'''
          new = '''    for user in users:\n        # This is maintenance of an existing binding, not a new selection.\n        # Permission revocation is intentionally ignored, but the owning Admin's\n        # inbound ceiling remains fail-closed.\n        if user.admin_id is None:\n            raise admin_hierarchy.HierarchyError(\n                \"access_group_owner_missing\", \"Access Group users require an administrator owner\"\n            )\n        _require_admin_network_scope(db, inbounds, user.admin_id)\n        _apply_network_to_user(db, user, inbounds)\n        user.access_group_id = group.id\n'''
          if old not in source:
              raise SystemExit("update maintenance loop anchor missing")
          source = source.replace(old, new, 1)

          old = '''    try:\n        _, hosts, _ = _validated_network_scope(db, user.access_group_id)\n    except admin_hierarchy.HierarchyError:\n        return {}\n    return hosts\n'''
          new = '''    try:\n        inbounds, hosts, _ = _validated_network_scope(db, user.access_group_id)\n        if user.admin_id is None:\n            return {}\n        _require_admin_network_scope(db, inbounds, user.admin_id)\n    except admin_hierarchy.HierarchyError:\n        return {}\n    return hosts\n'''
          if old not in source:
              raise SystemExit("host_scope anchor missing")
          source = source.replace(old, new, 1)

          old = '''            and inbounds <= configured\n            and all(\n'''
          new = '''            and inbounds <= configured\n            and inbounds <= allowed\n            and all(\n'''
          if old not in source:
              raise SystemExit("host_scopes configured ceiling anchor missing")
          source = source.replace(old, new, 1)

          old = '''        for user in users:\n            # Host maintenance resyncs an existing binding; it is not a new\n            # Access Group selection, so Admin authorization is intentionally\n            # not re-evaluated here. Network validity is still fail-closed.\n            _apply_network_to_user(db, user, inbounds)\n            user.access_group_id = group_id\n            synced.append(user.id)\n'''
          new = '''        for user in users:\n            # Host maintenance resyncs an existing binding; it is not a new\n            # Access Group selection, so permission is intentionally not\n            # re-evaluated. The owning Admin's inbound ceiling still applies.\n            if user.admin_id is None:\n                raise admin_hierarchy.HierarchyError(\n                    \"access_group_owner_missing\", \"Access Group users require an administrator owner\"\n                )\n            _require_admin_network_scope(db, inbounds, user.admin_id)\n            _apply_network_to_user(db, user, inbounds)\n            user.access_group_id = group_id\n            synced.append(user.id)\n'''
          if old not in source:
              raise SystemExit("host propagation maintenance loop anchor missing")
          source = source.replace(old, new, 1)
          path.write_text(source)

          behavior = Path("tests/test_access_group_admin_assignment_validation.py")
          test_source = behavior.read_text()
          if "test_revoked_binding_still_obeys_admin_network_ceiling" not in test_source:
              test_source += '''\n\ndef test_revoked_binding_still_obeys_admin_network_ceiling(db):\n    session, _, target, group = db\n    access_groups._replace_admin_access(session, group, _values(group, [target.id]))\n    user = User(\n        username=\"existing-binding-ceiling\",\n        admin_id=target.id,\n        access_group_id=group.id,\n        status=UserStatus.active,\n    )\n    session.add(user)\n    session.commit()\n\n    access_groups._replace_admin_access(session, group, _values(group, []))\n    settings = session.get(MarzhelpAdminSettings, target.id)\n    settings.all_inbounds = False\n    session.commit()\n\n    assert user.access_group_id == group.id\n    with pytest.raises(admin_hierarchy.HierarchyError) as raised:\n        access_groups._require_admin_network_scope(session, {INBOUND}, target.id)\n    assert raised.value.code == \"access_group_scope_forbidden\"\n'''
              behavior.write_text(test_source)

          contract = Path("tests/test_access_group_admin_permissions_contract.py")
          contract_source = contract.read_text()
          if "test_existing_binding_maintenance_keeps_admin_inbound_ceiling" not in contract_source:
              contract_source += '''\n\ndef test_existing_binding_maintenance_keeps_admin_inbound_ceiling():\n    source = Path(\"app/utils/access_groups.py\").read_text(encoding=\"utf-8\")\n    assert source.count(\"_require_admin_network_scope(db, inbounds, user.admin_id)\") >= 3\n    assert \"_require_admin_network_scope(db, inbounds, admin_id)\" in source\n    assert \"and inbounds <= allowed\" in source\n'''
              contract.write_text(contract_source)
          PY
          python -m compileall -q app

      - name: Run focused Access Group backend regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -r requirements.txt pytest httpx
          python -m pytest -q --tb=short --disable-warnings \
            tests/test_access_group_admin_assignment_validation.py \
            tests/test_access_group_admin_permissions_contract.py

      - name: Commit security follow-up
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/utils/access_groups.py \
            tests/test_access_group_admin_assignment_validation.py \
            tests/test_access_group_admin_permissions_contract.py
          git diff --cached --check
          git commit -m "fix: preserve Access Group inbound ceilings after permission revoke"
          git push origin HEAD:release/v1.1.3
