name: Regenerate v1.1.7 dashboard build

on:
  push:
    branches:
      - release/v1.1.7

permissions:
  contents: write

concurrency:
  group: regen-dashboard-v1.1.7
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.1.7
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci

      - name: Verify Stage 1 UI contracts
        working-directory: app/dashboard
        run: node scripts/test-stage1-ui-contracts.cjs

      - name: Build dashboard from source
        working-directory: app/dashboard
        run: VITE_BASE_API=/api/ npm run build

      - name: Verify dashboard build output
        run: test -f app/dashboard/build/index.html && test -f app/dashboard/build/404.html

      - name: Commit canonical dashboard build and self-remove
        shell: bash
        run: |
          set -Eeuo pipefail
          git status --short -- app/dashboard/build
          if git diff --quiet -- app/dashboard/build; then
            echo "Canonical dashboard build produced no diff; parity failure requires investigation." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/regen-dashboard-v1.1.7.yml
          git add app/dashboard/build .github/workflows/regen-dashboard-v1.1.7.yml
          git commit -m "build: regenerate dashboard for v1.1.7"
          git push origin HEAD:release/v1.1.7
