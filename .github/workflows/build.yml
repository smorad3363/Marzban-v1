name: Release

on:
  push:
    tags:
      - "v*"
      - "!v1.0.0"
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git tag/ref to publish
        required: true
        default: main
      image_tag:
        description: Container image tag
        required: true
        default: latest
      tests_only:
        description: Compatibility input; when true publication is skipped
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-${{ inputs.git_ref || github.ref }}
  cancel-in-progress: false

jobs:
  publish-release:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tests_only != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_ref || github.ref }}
          fetch-depth: 0

      - name: Resolve immutable release version
        id: release-version
        shell: bash
        env:
          DISPATCH_REF: ${{ inputs.git_ref }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          set -Eeuo pipefail
          source_sha="$(git rev-parse HEAD)"
          version_tag=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version_tag="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${DISPATCH_REF}" == v* ]]; then
            if ! git show-ref --verify --quiet "refs/tags/${DISPATCH_REF}"; then
              git fetch --no-tags origin "refs/tags/${DISPATCH_REF}:refs/tags/${DISPATCH_REF}"
            fi
            tag_sha="$(git rev-list -n 1 "${DISPATCH_REF}")"
            if [[ "${tag_sha}" != "${source_sha}" ]]; then
              echo "Requested release tag ${DISPATCH_REF} does not match checked-out source ${source_sha}" >&2
              exit 1
            fi
            version_tag="${DISPATCH_REF}"
          fi
          publish_tag="${version_tag:-${REQUESTED_TAG}}"
          test -n "${publish_tag}"
          echo "version_tag=${version_tag}" >> "${GITHUB_OUTPUT}"
          echo "publish_tag=${publish_tag}" >> "${GITHUB_OUTPUT}"
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Verify release tag, protected-main ancestry, version surfaces and notes
        if: steps.release-version.outputs.version_tag != ''
        env:
          VERSION_TAG: ${{ steps.release-version.outputs.version_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          tag_commit="$(git rev-list -n 1 "${VERSION_TAG}")"
          test -n "${tag_commit}"
          git merge-base --is-ancestor "${tag_commit}" origin/main
          version_text="$(tr -d '[:space:]' < VERSION)"
          test "${VERSION_TAG}" = "v${version_text}"
          grep -Fx "__version__ = \"${version_text}\"" app/__init__.py
          grep -Fx "CLI_RELEASE_VERSION=\"${VERSION_TAG}\"" scripts/marzban.sh
          grep -Fq "ghcr.io/smorad3363/marzban-v1:${VERSION_TAG}" docker-compose.yml
          test -s "docs/RELEASE_NOTES_${VERSION_TAG}.md"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci

      - name: Verify canonical dashboard UX contract
        working-directory: app/dashboard
        run: node scripts/test-stage1-ui-contracts.cjs

      - name: Build dashboard from source
        working-directory: app/dashboard
        run: VITE_BASE_API=/api/ npm run build

      - name: Verify dashboard build and committed parity
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f app/dashboard/build/index.html
          test -f app/dashboard/build/404.html
          git diff --exit-code -- app/dashboard/build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable image tags
        id: image-tags
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/marzban-v1
          PUBLISH_TAG: ${{ steps.release-version.outputs.publish_tag }}
          VERSION_TAG: ${{ steps.release-version.outputs.version_tag }}
          SOURCE_SHA: ${{ steps.release-version.outputs.source_sha }}
        run: |
          set -Eeuo pipefail
          short_sha="${SOURCE_SHA::12}"
          tags="${IMAGE_NAME}:sha-${short_sha}"$'\n'"${IMAGE_NAME}:${PUBLISH_TAG}"
          if [[ -n "${VERSION_TAG}" && "${VERSION_TAG}" != *-* ]]; then
            tags="${tags}"$'\n'"${IMAGE_NAME}:latest"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.revision=${{ steps.release-version.outputs.source_sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release-version.outputs.publish_tag }}

      - name: Verify published image anonymously and at runtime
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/marzban-v1
          PUBLISH_TAG: ${{ steps.release-version.outputs.publish_tag }}
          VERSION_TAG: ${{ steps.release-version.outputs.version_tag }}
          SOURCE_SHA: ${{ steps.release-version.outputs.source_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          image="${IMAGE_NAME}:${PUBLISH_TAG}"
          manifest="$(docker buildx imagetools inspect "${image}")"
          printf '%s\n' "${manifest}"
          grep -Fq "linux/amd64" <<<"${manifest}"
          grep -Fq "linux/arm64" <<<"${manifest}"
          docker logout ghcr.io
          docker image rm "${image}" >/dev/null 2>&1 || true
          docker pull --platform linux/amd64 "${image}"
          revision="$(docker image inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' "${image}")"
          test "${revision}" = "${SOURCE_SHA}"
          expected_version="$(tr -d '[:space:]' < VERSION)"
          docker run --rm --platform linux/amd64 --entrypoint /usr/local/bin/python "${image}" \
            -c "from pathlib import Path; image_version=Path('/code/VERSION').read_text().strip(); assert image_version == '${expected_version}', image_version"
          docker run --rm --platform linux/amd64 --entrypoint /usr/local/bin/mysqldump "${image}" --version | grep -F "26.7.0"
          docker run --rm --platform linux/amd64 --entrypoint /bin/sh "${image}" -c \
            'test -f /code/app/dashboard/build/index.html && test -x /usr/bin/marzban-cli && test -f /code/node_runtime/main.py'
          if [[ -n "${VERSION_TAG}" && "${VERSION_TAG}" != *-* ]]; then
            latest="${IMAGE_NAME}:latest"
            docker pull --platform linux/amd64 "${latest}"
            latest_revision="$(docker image inspect --format '{{ index .Config.Labels \"org.opencontainers.image.revision\" }}' "${latest}")"
            test "${latest_revision}" = "${SOURCE_SHA}"
          fi

      - name: Create immutable GitHub release
        if: steps.release-version.outputs.version_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ steps.release-version.outputs.version_tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          notes_file="docs/RELEASE_NOTES_${VERSION_TAG}.md"
          test -s "${notes_file}"
          if ! gh release view "${VERSION_TAG}" >/dev/null 2>&1; then
            release_flags=()
            if [[ "${VERSION_TAG}" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "${VERSION_TAG}" \
              --title "Marzban ${VERSION_TAG}" \
              --notes-file "${notes_file}" \
              --verify-tag \
              "${release_flags[@]}"
          fi
