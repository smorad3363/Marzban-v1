name: Apply V1.0.2 Node CLI Isolation

on:
  push:
    branches:
      - release/v1.0.2
    paths:
      - .github/workflows/apply-v102-node-cli-isolation.yml

permissions:
  contents: write

env:
  SQLALCHEMY_DATABASE_URL: mysql+pymysql://marzban:test@127.0.0.1:3306/marzban_test
  DEBUG: "false"

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt pytest httpx
      - name: Apply context-checked isolation patch
        run: python .github/scripts/apply_v102_node_cli_isolation.py
      - name: Enforce isolation patch scope
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          for path in "${changed[@]}"; do
            case "$path" in
              scripts/marzban.sh|tests/test_v102_node_deployment.py) ;;
              *) echo "Unexpected isolation patch path: $path" >&2; exit 1 ;;
            esac
          done
      - name: Verify Node deployment isolation
        run: |
          bash -n scripts/marzban.sh
          bash tests/test_installer_v1_contract.sh
          python -m pytest -q tests/test_v102_node_deployment.py tests/test_release_contract.py
          git diff --check scripts/marzban.sh tests/test_v102_node_deployment.py
      - name: Commit isolation guard
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "Eliot"
          git config user.email "42266703+smorad3363@users.noreply.github.com"
          git add scripts/marzban.sh tests/test_v102_node_deployment.py
          git diff --cached --quiet && { echo 'No isolation changes to commit'; exit 1; }
          git commit -m "fix: isolate built-in node cli from panel state"
          git push origin HEAD:release/v1.0.2
