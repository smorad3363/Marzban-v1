name: Apply V1.0.2 Node Protocol V2

on:
  push:
    branches:
      - release/v1.0.2
    paths:
      - .github/workflows/apply-v102-node-protocol-v2.yml

permissions:
  contents: write

env:
  SQLALCHEMY_DATABASE_URL: mysql+pymysql://localhost/marzban_test
  XRAY_JSON: ./xray_config.json

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.0.2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply context-checked protocol patch
        run: |
          set -Eeuo pipefail
          python .github/scripts/apply_v102_node_protocol_v2.py
          python -m compileall -q app/xray
          git diff --check
      - name: Run focused protocol tests
        run: |
          python -m pip install -r requirements.txt pytest httpx
          python -m pytest -q tests/test_v102_node_runtime_protocol.py tests/test_v102_node_ip_policy.py
      - name: Commit protocol foundation
        run: |
          set -Eeuo pipefail
          git config user.name "Eliot"
          git config user.email "42266703+smorad3363@users.noreply.github.com"
          git add app/xray/node.py app/xray/node_protocol_v2.py tests/test_v102_node_runtime_protocol.py
          git diff --cached --check
          git commit -m "feat: add explicit node runtime v2 protocol"
          git push origin HEAD:release/v1.0.2
