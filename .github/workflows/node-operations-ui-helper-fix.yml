name: One-shot Node Operations UI Helper Repair

on:
  push:
    branches:
      - codex/node-operations-ui-build

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair helper anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/node-operations-ui-helper.yml')
          text = path.read_text()

          old_condition = "    if: github.actor != 'github-actions[bot]'"
          new_condition = "    if: github.event.head_commit.message != 'feat: unify Node Operations workspace'"
          if text.count(old_condition) != 1:
              raise SystemExit('unexpected helper job condition')
          text = text.replace(old_condition, new_condition, 1)

          old_anchor = '''              "  bandwidth?: NodeBandwidthEntry;",
              "  bandwidth?: NodeBandwidthEntry;\\n  operation?: NodeOperationsEntry;"'''
          new_anchor = '''              "  node: NodeType | null;\\n  bandwidth?: NodeBandwidthEntry;\\n  status: Status;",
              "  node: NodeType | null;\\n  bandwidth?: NodeBandwidthEntry;\\n  operation?: NodeOperationsEntry;\\n  status: Status;"'''
          if text.count(old_anchor) != 1:
              raise SystemExit('unexpected NodeRow bandwidth anchor')
          path.write_text(text.replace(old_anchor, new_anchor, 1))
          PY
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/node-operations-ui-helper.yml
          git commit -m "ci: repair temporary Node Operations UI builder"
          git push
