name: One-shot Node Operations UI Helper Repair

on:
  push:
    branches:
      - codex/node-operations-ui-build

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair helper anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/node-operations-ui-helper.yml')
          lines = path.read_text().splitlines()

          condition_hits = 0
          old_arg_hits = 0
          new_arg_hits = 0
          for index, line in enumerate(lines):
              if line == "    if: github.actor != 'github-actions[bot]'":
                  lines[index] = "    if: github.event.head_commit.message != 'feat: unify Node Operations workspace'"
                  condition_hits += 1
              stripped = line.strip()
              if stripped == '"  bandwidth?: NodeBandwidthEntry;",':
                  prefix = line[:len(line) - len(line.lstrip())]
                  lines[index] = prefix + '"  node: NodeType | null;\\n  bandwidth?: NodeBandwidthEntry;\\n  status: Status;",'
                  old_arg_hits += 1
              elif stripped == '"  bandwidth?: NodeBandwidthEntry;\\n  operation?: NodeOperationsEntry;"':
                  prefix = line[:len(line) - len(line.lstrip())]
                  lines[index] = prefix + '"  node: NodeType | null;\\n  bandwidth?: NodeBandwidthEntry;\\n  operation?: NodeOperationsEntry;\\n  status: Status;"'
                  new_arg_hits += 1

          if (condition_hits, old_arg_hits, new_arg_hits) != (1, 1, 1):
              raise SystemExit(f'unexpected helper anchors: condition={condition_hits} old={old_arg_hits} new={new_arg_hits}')
          path.write_text('\n'.join(lines) + '\n')
          PY
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/node-operations-ui-helper.yml
          git commit -m "ci: repair temporary Node Operations UI builder"
          git push
