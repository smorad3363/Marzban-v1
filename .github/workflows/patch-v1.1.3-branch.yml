name: Patch v1.1.3 branch

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: github.head_ref == 'release/v1.1.3'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.1.3
          fetch-depth: 0

      - name: Apply v1.1.3 source repairs and regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              p.write_text(text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              text2, count = re.subn(pattern, replacement, text, count=1, flags=re.S | re.M)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}")
              p.write_text(text2)

          # Existing Access Group bindings remain valid after Owner revokes future Admin selection.
          regex_once(
              "app/utils/access_groups.py",
              r'''    if explicit_policy:\n        disallowed_query = db\.query\(User\.admin_id\).*?\n            \)\n    db\.query\(AccessGroupAdminAccess\)''',
              '''    # Permission policy controls future Access Group selection. Existing users\n    # keep their already-authorized binding so Owner can revoke an Admin without\n    # breaking active subscriptions or blocking later network maintenance.\n    db.query(AccessGroupAdminAccess)''',
          )
          replace_once(
              "app/utils/access_groups.py",
              '''    for user in users:\n        apply_to_user(db, user, group.id)\n    db.commit()''',
              '''    inbounds, _, _ = _validated_network_scope(db, group.id)\n    from app.utils.admin_plans import _apply_network_to_user\n\n    for user in users:\n        # This is maintenance of an existing binding, not a new selection.\n        _apply_network_to_user(db, user, inbounds)\n        user.access_group_id = group.id\n    db.commit()''',
          )
          replace_once(
              "app/utils/access_groups.py",
              '''        _, hosts, _ = validated_scope(db, user.access_group_id, user.admin_id)''',
              '''        _, hosts, _ = _validated_network_scope(db, user.access_group_id)''',
          )
          replace_once(
              "app/utils/access_groups.py",
              '''        _, _, nodes = validated_scope(db, user.access_group_id, user.admin_id)''',
              '''        _, _, nodes = _validated_network_scope(db, user.access_group_id)''',
          )
          replace_once(
              "app/utils/access_groups.py",
              '''        permission_valid = (\n            group_id not in restricted_groups\n            or user.admin_id == group_owners.get(group_id)\n            or user.admin_id in allowed_admins_by_group.get(group_id, set())\n        )\n        valid = (\n            permission_valid\n            and bool(inbounds)\n            and set(hosts) == inbounds\n            and all(hosts.get(tag) for tag in inbounds)\n            and inbounds <= configured\n            and inbounds <= allowed\n            and all(\n                active_hosts.get(host_id) == tag\n                for tag, ids in hosts.items()\n                for host_id in ids\n            )\n        )''',
              '''        # Batched Host scope resolution serves already-bound users. Permission\n        # revocation blocks future selection but must not invalidate these bindings.\n        valid = (\n            bool(inbounds)\n            and set(hosts) == inbounds\n            and all(hosts.get(tag) for tag in inbounds)\n            and inbounds <= configured\n            and all(\n                active_hosts.get(host_id) == tag\n                for tag, ids in hosts.items()\n                for host_id in ids\n            )\n        )''',
          )

          # Persist Plan-category delegation from the managed Admin contract.
          replace_once(
              "app/routers/admin.py",
              '''            admin_hierarchy.attach_new_child(\n                db,\n                actor=actor,\n                parent=actor,\n                child=dbadmin,\n                child_role=new_admin.role or admin_hierarchy.ADMIN,\n                commit=False,\n            )\n            if new_admin.plan_prices:''',
              '''            admin_hierarchy.attach_new_child(\n                db,\n                actor=actor,\n                parent=actor,\n                child=dbadmin,\n                child_role=new_admin.role or admin_hierarchy.ADMIN,\n                commit=False,\n            )\n            admin_plans.replace_admin_categories(\n                db,\n                actor=actor,\n                target=dbadmin,\n                category_ids=new_admin.plan_category_ids or [],\n            )\n            if new_admin.plan_prices:''',
          )
          replace_once(
              "app/routers/admin.py",
              '''    if modified_admin.plan_prices is not None:\n        try:\n            money_billing.replace_child_plan_prices(''',
              '''    if modified_admin.plan_category_ids is not None:\n        try:\n            admin_plans.replace_admin_categories(\n                db,\n                actor=actor,\n                target=dbadmin,\n                category_ids=modified_admin.plan_category_ids,\n            )\n        except admin_hierarchy.HierarchyError as exc:\n            db.rollback()\n            raise HTTPException(\n                status_code=400,\n                detail={"code": exc.code, "message": str(exc)},\n            )\n    if modified_admin.plan_prices is not None:\n        try:\n            money_billing.replace_child_plan_prices(''',
          )

          # Admin deletion is a tombstone operation: preserve immutable ledger/Audit FK history.
          replace_once(
              "app/routers/admin.py",
              '''        int(settings.delegated_traffic or 0) > 0\n        or int(settings.total_traffic or 0) > 0\n        or admin_hierarchy.own_credit_spend(db, settings) > 0''',
              '''        int(settings.delegated_traffic or 0) > 0\n        or int(settings.total_traffic or 0) > 0\n        or int(settings.money_balance_toman or 0) != 0\n        or admin_hierarchy.own_credit_spend(db, settings) > 0''',
          )
          regex_once(
              "app/routers/admin.py",
              r'''    historical_rows = sum\(.*?\n    target_id = dbadmin\.id''',
              '''    # Immutable accounting/Audit rows intentionally keep their Admin foreign keys.\n    # crud.remove_admin retires the account instead of deleting that identity row.\n    target_id = dbadmin.id''',
          )

          # Add an explicit retirement marker and hide retired Admins from auth/management queries.
          replace_once(
              "app/db/models.py",
              '''    created_at = Column(DateTime, default=datetime.utcnow)\n    is_sudo = Column(Boolean, default=False)''',
              '''    created_at = Column(DateTime, default=datetime.utcnow)\n    deleted_at = Column(DateTime, nullable=True, index=True)\n    is_sudo = Column(Boolean, default=False)''',
          )
          replace_once(
              "app/db/crud.py",
              '''    return db.query(Admin).filter(Admin.username == username).first()''',
              '''    return db.query(Admin).filter(\n        Admin.username == username,\n        Admin.deleted_at.is_(None),\n    ).first()''',
          )
          replace_once(
              "app/db/crud.py",
              '''    query = db.query(Admin).order_by(Admin.created_at.desc(), Admin.id.desc())''',
              '''    query = db.query(Admin).filter(Admin.deleted_at.is_(None)).order_by(\n        Admin.created_at.desc(), Admin.id.desc()\n    )''',
          )
          replace_once(
              "app/db/crud.py",
              '''    query = db.query(Admin)\n    if scope_admin_id is not None:''',
              '''    query = db.query(Admin).filter(Admin.deleted_at.is_(None))\n    if scope_admin_id is not None:''',
          )
          replace_once(
              "app/db/crud.py",
              '''    return db.query(Admin).filter(Admin.id == id).first()''',
              '''    return db.query(Admin).filter(\n        Admin.id == id,\n        Admin.deleted_at.is_(None),\n    ).first()''',
          )
          replace_once(
              "app/db/crud.py",
              '''    db.query(AdminUserPlanAccess).filter(AdminUserPlanAccess.admin_id == dbadmin.id).delete()\n    db.query(AdminHierarchy).filter(''',
              '''    db.query(AdminUserPlanAccess).filter(AdminUserPlanAccess.admin_id == dbadmin.id).delete()\n    # Tombstoning does not invoke database ON DELETE cascades, so remove mutable\n    # access/delegation rows explicitly while retaining immutable history rows.\n    from app.db.access_group_models import AccessGroupAdminAccess\n    from app.db.models import AdminPlanCategoryAccess, AdminUserPlanPrice\n\n    db.query(AccessGroupAdminAccess).filter(\n        AccessGroupAdminAccess.admin_id == dbadmin.id\n    ).delete(synchronize_session=False)\n    db.query(AdminPlanCategoryAccess).filter(\n        AdminPlanCategoryAccess.admin_id == dbadmin.id\n    ).delete(synchronize_session=False)\n    db.query(AdminUserPlanPrice).filter(\n        AdminUserPlanPrice.admin_id == dbadmin.id\n    ).delete(synchronize_session=False)\n    db.query(AdminHierarchy).filter(''',
          )
          replace_once(
              "app/db/crud.py",
              '''    db.query(MarzhelpAdminSettings).filter(\n        MarzhelpAdminSettings.admin_id == dbadmin.id\n    ).delete()\n    db.delete(dbadmin)\n    db.commit()''',
              '''    db.query(MarzhelpAdminSettings).filter(\n        MarzhelpAdminSettings.admin_id == dbadmin.id\n    ).delete()\n    dbadmin.parent_admin_id = None\n    dbadmin.external_api_enabled = False\n    dbadmin.is_sudo = False\n    dbadmin.hashed_password = ""\n    dbadmin.telegram_id = None\n    dbadmin.phone = None\n    dbadmin.discord_webhook = None\n    dbadmin.deleted_at = datetime.utcnow()\n    db.add(dbadmin)\n    db.commit()''',
          )

          # Admin form: retain and edit Plan category grants instead of silently dropping them.
          replace_once(
              "app/dashboard/src/components/AdminFormDrawer.tsx",
              '''  AccountSummary, AdminCapabilities, AdminPolicy, ManagedAdmin, ManagedAdminList, ManagedAdminPayload,\n  SubscriptionMode,''',
              '''  AccountSummary, AdminCapabilities, AdminPolicy, ManagedAdmin, ManagedAdminList, ManagedAdminPayload,\n  PlanCategory, SubscriptionMode,''',
          )
          replace_once(
              "app/dashboard/src/components/AdminFormDrawer.tsx",
              '''  const accountQuery = useQuery<AccountSummary, Error>(\n    "account-summary", () => fetch("/account/summary"),\n    { enabled: isOpen, staleTime: 15000 }\n  );''',
              '''  const accountQuery = useQuery<AccountSummary, Error>(\n    "account-summary", () => fetch("/account/summary"),\n    { enabled: isOpen, staleTime: 15000 }\n  );\n  const categoriesQuery = useQuery<PlanCategory[], Error>(\n    "plan-categories", () => fetch("/plan-categories"),\n    { enabled: isOpen, staleTime: 15000 }\n  );''',
          )
          replace_once(
              "app/dashboard/src/components/AdminFormDrawer.tsx",
              '''        plan_category_ids: [], plan_prices: undefined, initial_money_credit_toman: 0,''',
              '''        plan_category_ids: admin.plan_category_ids ?? [], plan_prices: admin.plan_prices, initial_money_credit_toman: 0,''',
          )
          replace_once(
              "app/dashboard/src/components/AdminFormDrawer.tsx",
              '''    if (!allowedCreationModes.includes(normalizedCreationMode)) return showWarning("روش ساخت کاربر با دسترسی والد سازگار نیست");\n    if (mode === "USED_TRAFFIC"''',
              '''    if (!allowedCreationModes.includes(normalizedCreationMode)) return showWarning("روش ساخت کاربر با دسترسی والد سازگار نیست");\n    if (normalizedCreationMode !== "FORM_ONLY" && !form.plan_category_ids.length) return showWarning("حداقل یک دسته‌بندی پلن برای این روش ساخت کاربر انتخاب کنید");\n    if (mode === "USED_TRAFFIC"''',
          )
          replace_once(
              "app/dashboard/src/components/AdminFormDrawer.tsx",
              '''  const toggleInbound = (tag: string, checked: boolean) => setPolicy("allowed_inbounds", (checked''',
              '''  const togglePlanCategory = (categoryId: number, checked: boolean) => setField(\n    "plan_category_ids",\n    checked\n      ? [...new Set([...form.plan_category_ids, categoryId])].sort((a, b) => a - b)\n      : form.plan_category_ids.filter((value) => value !== categoryId)\n  );\n  const toggleInbound = (tag: string, checked: boolean) => setPolicy("allowed_inbounds", (checked''',
          )
          replace_once(
              "app/dashboard/src/components/AdminFormDrawer.tsx",
              '''                  {mode === "USER_CREDIT" && <Text mt={1} color="var(--panel-text-muted)" fontSize="xs">حساب «سقف اکانت» طبق قرارداد Backend همیشه فقط با پلن کار می‌کند.</Text>}\n                </Box>\n\n                <SimpleGrid mt={4}''',
              '''                  {mode === "USER_CREDIT" && <Text mt={1} color="var(--panel-text-muted)" fontSize="xs">حساب «سقف اکانت» طبق قرارداد Backend همیشه فقط با پلن کار می‌کند.</Text>}\n                </Box>\n\n                {normalizedCreationMode !== "FORM_ONLY" && (\n                  <Box mt={4} pt={4} borderTopWidth="1px" borderColor="var(--panel-border)">\n                    <Text fontSize="sm" fontWeight="800">دسترسی پلن</Text>\n                    <Text mt={1} color="var(--panel-text-muted)" fontSize="xs">دسته‌بندی‌هایی را انتخاب کنید که پلن‌هایشان برای این ادمین در ساخت کاربر قابل مشاهده باشد.</Text>\n                    {categoriesQuery.isLoading ? <Skeleton mt={2} h="52px" borderRadius="10px" /> : categoriesQuery.isError ? (\n                      <Alert mt={2} status="error" borderRadius="10px"><AlertIcon />دسته‌بندی‌های پلن بارگذاری نشد.</Alert>\n                    ) : (\n                      <SimpleGrid mt={2} columns={{ base: 1, md: 2 }} gap={2}>\n                        {(categoriesQuery.data || []).map((category) => (\n                          <Checkbox key={category.id} isChecked={form.plan_category_ids.includes(category.id)} onChange={(e) => togglePlanCategory(category.id, e.target.checked)}>\n                            {category.name} · {category.plan_count} پلن\n                          </Checkbox>\n                        ))}\n                      </SimpleGrid>\n                    )}\n                    {!categoriesQuery.isLoading && !categoriesQuery.isError && (categoriesQuery.data || []).length === 0 && (\n                      <Alert mt={2} status="warning" borderRadius="10px"><AlertIcon />ابتدا در بخش پلن‌ها یک دسته‌بندی و پلن فعال بسازید.</Alert>\n                    )}\n                  </Box>\n                )}\n\n                <SimpleGrid mt={4}''',
          )

          # Editing a Plan must preserve existing direct access metadata.
          replace_once(
              "app/dashboard/src/pages/Plans.tsx",
              '''        allowed_admin_ids: [],\n        include_subtree: false,''',
              '''        allowed_admin_ids: editing ? editing.allowed_admin_ids : [],\n        include_subtree: editing ? editing.include_subtree : false,''',
          )

          # Focused backend regressions.
          access_test = Path("tests/test_access_group_admin_assignment_validation.py")
          text = access_test.read_text()
          text = text.replace(
              '''    MarzhelpAdminSettings,\n    SystemOwner,''',
              '''    MarzhelpAdminSettings,\n    SystemOwner,\n    User,''',
              1,
          )
          text = text.replace(
              '''from app.models.admin_hierarchy import AccessGroupInput\nfrom app.utils import access_groups, admin_hierarchy''',
              '''from app.models.admin_hierarchy import AccessGroupInput\nfrom app.models.user import UserStatus\nfrom app.utils import access_groups, admin_hierarchy''',
              1,
          )
          text += '''\n\ndef test_revoking_admin_permission_preserves_existing_user_binding(db):\n    session, _, target, group = db\n    access_groups._replace_admin_access(session, group, _values(group, [target.id]))\n    session.flush()\n    user = User(\n        username="existing-binding",\n        admin_id=target.id,\n        access_group_id=group.id,\n        status=UserStatus.active,\n    )\n    session.add(user)\n    session.commit()\n\n    access_groups._replace_admin_access(session, group, _values(group, []))\n    session.commit()\n\n    assert user.access_group_id == group.id\n    with pytest.raises(admin_hierarchy.HierarchyError) as raised:\n        access_groups._require_group_access(session, group, target.id)\n    assert raised.value.code == "access_group_forbidden"\n'''
          access_test.write_text(text)

          Path("tests/test_v113_admin_retirement.py").write_text('''from sqlalchemy import create_engine\nfrom sqlalchemy.orm import sessionmaker\n\nfrom app.db import crud\nfrom app.db.base import Base\nfrom app.db.models import Admin, AdminMoneyTransaction, User\nfrom app.models.admin import AdminCreate\nfrom app.models.user import UserStatus\n\n\ndef test_admin_retirement_preserves_immutable_money_history_and_hides_account(tmp_path):\n    engine = create_engine(f"sqlite:///{tmp_path / 'v113-retire.sqlite3'}")\n    Base.metadata.create_all(engine)\n    db = sessionmaker(bind=engine, expire_on_commit=False)()\n    try:\n        admin = crud.create_admin(\n            db, AdminCreate(username="retire-me", password="secret", is_sudo=False)\n        )\n        user = User(username="retired-user", admin_id=admin.id, status=UserStatus.active)\n        db.add(user)\n        db.add(AdminMoneyTransaction(\n            operation_key="v113-history", operation_type="grant",\n            admin_id=admin.id, actor_admin_id=admin.id, counterparty_admin_id=None,\n            delta_toman=1000, balance_before=0, balance_after=1000,\n        ))\n        db.commit()\n\n        assert crud.remove_admin(db, admin, "keep_users") == 1\n        assert crud.get_admin(db, "retire-me") is None\n        tombstone = db.query(Admin).filter(Admin.username == "retire-me").one()\n        assert tombstone.deleted_at is not None\n        assert tombstone.parent_admin_id is None\n        assert db.query(AdminMoneyTransaction).filter(\n            AdminMoneyTransaction.operation_key == "v113-history"\n        ).count() == 1\n        assert db.query(User).filter(User.username == "retired-user").one().admin_id is None\n        admins, total = crud.get_admins_with_count(db)\n        assert total == 0\n        assert admins == []\n    finally:\n        db.close()\n        engine.dispose()\n''')

          # New Alembic head for the Admin retirement marker.
          versions = Path("app/db/migrations/versions")
          revision_re = re.compile(r'^revision(?:\s*:\s*[^=]+)?\s*=\s*["\\\']([^"\\\']+)', re.M)
          down_re = re.compile(r'^down_revision(?:\s*:\s*[^=]+)?\s*=\s*["\\\']([^"\\\']+)', re.M)
          revisions = set()
          referenced = set()
          for item in versions.glob("*.py"):
              body = item.read_text()
              match = revision_re.search(body)
              if match:
                  revisions.add(match.group(1))
              match = down_re.search(body)
              if match:
                  referenced.add(match.group(1))
          heads = sorted(revisions - referenced)
          if len(heads) != 1:
              raise SystemExit(f"Expected one Alembic head, found {heads}")
          migration = versions / "e7b1c4d9a213_add_admin_deleted_at.py"
          migration.write_text(f'''"""add Admin retirement marker\n\nRevision ID: e7b1c4d9a213\nRevises: {heads[0]}\n"""\nfrom alembic import op\nimport sqlalchemy as sa\n\nrevision = "e7b1c4d9a213"\ndown_revision = "{heads[0]}"\nbranch_labels = None\ndepends_on = None\n\n\ndef upgrade():\n    op.add_column("admins", sa.Column("deleted_at", sa.DateTime(), nullable=True))\n    op.create_index("ix_admins_deleted_at", "admins", ["deleted_at"], unique=False)\n\n\ndef downgrade():\n    op.drop_index("ix_admins_deleted_at", table_name="admins")\n    op.drop_column("admins", "deleted_at")\n''')

          # Lightweight source-contract gate for the exact v1.1.3 regressions.
          Path("app/dashboard/scripts/test-v1.1.3-regressions.cjs").write_text(r'''const fs = require("fs");\nconst assert = require("assert");\nconst read = (path) => fs.readFileSync(path, "utf8");\nconst adminForm = read("src/components/AdminFormDrawer.tsx");\nconst plans = read("src/pages/Plans.tsx");\nconst backendAdmin = read("../../routers/admin.py");\nconst accessGroups = read("../../utils/access_groups.py");\nconst crud = read("../../db/crud.py");\nassert(adminForm.includes("plan_category_ids: admin.plan_category_ids ?? []"));\nassert(adminForm.includes('fetch("/plan-categories")'));\nassert(adminForm.includes("حداقل یک دسته‌بندی پلن"));\nassert(plans.includes("allowed_admin_ids: editing ? editing.allowed_admin_ids : []"));\nassert((backendAdmin.match(/replace_admin_categories\(/g) || []).length >= 2);\nassert(!accessGroups.includes("access_group_permission_in_use"));\nassert(accessGroups.includes("_validated_network_scope(db, user.access_group_id)"));\nassert(crud.includes("Admin.deleted_at.is_(None)"));\nassert(crud.includes("dbadmin.deleted_at = datetime.utcnow()"));\nconsole.log("v1.1.3 regressions: assertions passed");\n''')
          package = Path("app/dashboard/package.json")
          body = package.read_text()
          needle = '    "test:v1.1.2": "node scripts/test-v1.1.2-regressions.cjs",\n'
          if needle not in body:
              raise SystemExit("package.json v1.1.2 test script anchor missing")
          package.write_text(body.replace(needle, needle + '    "test:v1.1.3": "node scripts/test-v1.1.3-regressions.cjs",\n', 1))
          PY
          python -m compileall -q app

      - name: Build and verify dashboard
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - name: Regenerate committed dashboard build
        shell: bash
        working-directory: app/dashboard
        run: |
          set -Eeuo pipefail
          npm ci
          npm run test:v1.1.3
          VITE_BASE_API=/api/ npm run build
          cp build/index.html build/404.html

      - name: Commit repaired source and build
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests
          git diff --cached --check
          git commit -m "fix: repair admin deletion and plan access regressions"
          git push origin HEAD:release/v1.1.3
