name: Dashboard palette independent review

on:
  push:
    branches:
      - ui/dashboard-palette-node-speed

permissions:
  contents: read

jobs:
  independent-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/dashboard-palette-node-speed
          fetch-depth: 0

      - name: Review scope, permissions and palette invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main --depth=1
          python - <<'PY'
          from pathlib import Path
          import subprocess

          changed = set(subprocess.check_output(
              ["git", "diff", "--name-only", "origin/main...HEAD"], text=True
          ).splitlines())
          review_file = ".github/workflows/_dashboard_palette_review.yml"
          allowed_sources = {
              "app/dashboard/src/pages/Dashboard.tsx",
              "app/dashboard/src/components/DashboardOverviewCompact.tsx",
              "app/dashboard/src/components/NodeBandwidthPanel.tsx",
              "app/dashboard/src/components/FiltersCompact.tsx",
              "app/dashboard/src/components/BulkUserActions.tsx",
              "app/dashboard/src/components/UsersTablePro.tsx",
              "app/dashboard/src/components/Header.tsx",
              "app/dashboard/src/index.scss",
              "app/dashboard/scripts/test-admin-ux.cjs",
              "app/dashboard/build/index.html",
              "app/dashboard/build/404.html",
              review_file,
          }
          unexpected = sorted(
              p for p in changed
              if p not in allowed_sources and not p.startswith("app/dashboard/build/statics/")
          )
          if unexpected:
              raise SystemExit(f"unexpected scope: {unexpected}")

          for forbidden in ["VERSION", "scripts/marzban.sh", "docker-compose.yml", ".github/workflows/build.yml", "app/routers/node.py"]:
              if forbidden in changed:
                  raise SystemExit(f"forbidden release/backend change: {forbidden}")

          dashboard = Path("app/dashboard/src/pages/Dashboard.tsx").read_text()
          node_panel = Path("app/dashboard/src/components/NodeBandwidthPanel.tsx").read_text()
          node_router = Path("app/routers/node.py").read_text()
          styles = Path("app/dashboard/src/index.scss").read_text()
          filters = Path("app/dashboard/src/components/FiltersCompact.tsx").read_text()
          bulk = Path("app/dashboard/src/components/BulkUserActions.tsx").read_text()
          users = Path("app/dashboard/src/components/UsersTablePro.tsx").read_text()
          header = Path("app/dashboard/src/components/Header.tsx").read_text()

          assert "مرکز مدیریت کاربران و سرویس‌های Marzban" not in dashboard
          assert "{isOwner && <NodeBandwidthPanel />}" in dashboard
          assert 'fetch("/nodes/bandwidth")' in node_panel
          assert '@router.get("/nodes/bandwidth"' in node_router
          assert "Admin.check_sudo_admin" in node_router

          # API-backed rotating header copy is intentionally deferred.
          assert "const shortMessages = [" in dashboard
          assert "messageForToday()" in dashboard
          assert "https://" not in dashboard and "http://" not in dashboard

          for token in [
              "--panel-text:",
              "--panel-text-muted:",
              "--panel-accent:",
              "--panel-accent-soft:",
              "--panel-accent-contrast:",
              "--panel-success:",
              "--panel-warning:",
              "--panel-danger:",
              'html[data-panel-theme="black_gold"]',
              "color: var(--panel-text) !important;",
          ]:
              assert token in styles, token

          for source, forbidden_tokens in [
              (filters, ['colorScheme="yellow"', 'tone="blue"', 'tone="yellow"']),
              (bulk, ['colorScheme="teal"', 'rgba(45, 212, 191']),
              (header, ['colorScheme={isAuditPage ? "cyan"']),
          ]:
              for token in forbidden_tokens:
                  assert token not in source, token

          assert 'tableLayout: "fixed"' in users
          assert 'minW="1680px"' not in users
          assert 'overflowX="hidden"' in users
          print("independent dashboard palette review: PASS")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci

      - name: Run dashboard UX contract
        working-directory: app/dashboard
        run: npm run test:admin-ux

      - name: Verify canonical production build parity
        working-directory: app/dashboard
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf /tmp/dashboard-palette-build
          VITE_BASE_API=/api/ npm run build -- --outDir /tmp/dashboard-palette-build --assetsDir statics
          diff -qr build /tmp/dashboard-palette-build
