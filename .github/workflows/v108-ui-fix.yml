name: Verify v1.0.8 UI fixes

on:
  push:
    branches:
      - release/v1.0.8-integration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.8-integration
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Apply requested v1.0.8 fixes
        run: |
          python .github/scripts/apply_v108_ui_fix.py
          python .github/scripts/update_v108_contracts.py

      - name: Verify source diff
        run: |
          git diff --check
          test "$(cat VERSION)" = "1.0.8"
          grep -Fq 'ghcr.io/smorad3363/marzban-v1:v1.0.8' docker-compose.yml
          ! grep -Fq 'Operations workspace' app/dashboard/src/components/Header.tsx
          ! grep -Fq 'onResetAllUsage' app/dashboard/src/components/Header.tsx
          ! grep -Fq 'ResetAllUsageModal' app/dashboard/src/pages/Dashboard.tsx
          grep -Fq '<CoreSettingsModal />' app/dashboard/src/components/AppShell.tsx

      - name: Install dashboard dependencies
        working-directory: app/dashboard
        run: npm ci

      - name: Run UI contract tests
        working-directory: app/dashboard
        run: |
          node scripts/test-v108-ui.cjs
          node scripts/test-v107-ui.cjs
          node scripts/test-access-groups.cjs
          node scripts/test-admin-hierarchy-authorization.cjs
          node scripts/test-admin-ux.cjs
          node scripts/test-ui-errors.cjs

      - name: Build dashboard production bundle
        working-directory: app/dashboard
        run: npm run build

      - name: Verify generated bundle and source
        run: |
          git diff --check
          test -s app/dashboard/build/index.html
          ! grep -R -F 'وضعیت روشن، تصمیم بهتر، سرویس پایدارتر.' app/dashboard/src
          ! grep -Fq 'Operations workspace' app/dashboard/src/components/Header.tsx

      - name: Commit verified v1.0.8 product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION docker-compose.yml RELEASES.md app/dashboard/chakra.config.ts app/dashboard/src app/dashboard/scripts/test-v108-ui.cjs app/dashboard/scripts/test-v107-ui.cjs app/dashboard/scripts/test-admin-ux.cjs app/dashboard/build
          git diff --cached --check
          git commit -m "fix(ui): repair navigation and modal UX for v1.0.8"
          git push origin HEAD:release/v1.0.8-integration
