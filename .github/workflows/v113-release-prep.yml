name: Prepare v1.1.3 release

on:
  push:
    branches: [release/v1.1.3]

permissions:
  contents: write

jobs:
  prepare-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.3
          fetch-depth: 0

      - name: Patch release surfaces
        run: python scripts/prepare_v113_release.py

      - name: Verify shell syntax
        run: bash -n scripts/marzban.sh

      - name: Commit release preparation
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION app/__init__.py scripts/marzban.sh docker-compose.yml RELEASES.md docs/RELEASE_NOTES_v1.1.3.md
          git diff --cached --check
          git commit -m "chore: prepare v1.1.3 release"
          git push origin HEAD:release/v1.1.3
