name: Temporary v1.1.6 release publisher

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  publish-v116:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      RELEASE_SHA: b6056e3e3f91828a18c39ea71df8252608562216
      RELEASE_TAG: v1.1.6
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify immutable release source
        shell: bash
        run: |
          set -Eeuo pipefail
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "${RELEASE_SHA}" HEAD
          test "$(git show "${RELEASE_SHA}:VERSION")" = "1.1.6"
          git show "${RELEASE_SHA}:app/__init__.py" | grep -F '__version__ = "1.1.6"'
          git show "${RELEASE_SHA}:scripts/marzban.sh" | grep -F 'CLI_RELEASE_VERSION="v1.1.6"'
          git show "${RELEASE_SHA}:docker-compose.yml" | grep -F 'ghcr.io/smorad3363/marzban-v1:v1.1.6'
          git cat-file -e "${RELEASE_SHA}:docs/RELEASE_NOTES_v1.1.6.md"
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists; refusing to move it." >&2
            exit 1
          fi

      - name: Create immutable release tag
        shell: bash
        run: |
          set -Eeuo pipefail
          git tag "${RELEASE_TAG}" "${RELEASE_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Dispatch canonical Release workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          gh workflow run build.yml \
            --repo "${GITHUB_REPOSITORY}" \
            -f git_ref="${RELEASE_TAG}" \
            -f image_tag="${RELEASE_TAG}" \
            -f tests_only=false
