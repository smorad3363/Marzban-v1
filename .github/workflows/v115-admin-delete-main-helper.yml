name: Temporary v1.1.5 admin deletion helper

on:
  push:
    branches: [main]
    paths: [.github/workflows/v115-admin-delete-main-helper.yml]

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.5
          fetch-depth: 0

      - name: Apply definitive Admin retirement fix
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          router = Path('app/routers/admin.py')
          text = router.read_text()
          old = '''    settings = db.get(MarzhelpAdminSettings, dbadmin.id)\n    if settings and (\n        int(settings.delegated_traffic or 0) > 0\n        or int(settings.total_traffic or 0) > 0\n        or int(settings.money_balance_toman or 0) != 0\n        or admin_hierarchy.own_credit_spend(db, settings) > 0\n    ):\n        raise HTTPException(\n            status_code=409,\n            detail={\n                "code": "admin_delete_credit_unsettled",\n                "message_fa": "اعتبار یا تعهد مالی این ادمین هنوز تسویه نشده است.",\n            },\n        )\n'''
          new = '''    # Financial and traffic counters are not retirement blockers. The Admin\n    # identity is tombstoned rather than physically deleted, so immutable ledger,\n    # audit, Plan and allocation history can safely retain their foreign keys.\n    # Active policy/access state is removed by crud.remove_admin after applying\n    # the selected owned-user strategy.\n'''
          if old not in text:
              raise SystemExit('admin financial deletion guard not found')
          router.write_text(text.replace(old, new, 1))

          page = Path('app/dashboard/src/pages/admins/AdminsPage.tsx')
          text = page.read_text()
          old = '                  حذف فیزیکی فقط برای ادمین بدون زیرمجموعه، اعتبار تسویه‌نشده و سابقه حسابداری/Audit ممکن است؛ در غیر این صورت دلیل دقیق نمایش داده می‌شود و باید حساب را تعلیق یا غیرفعال کنید.\n'
          new = '                  حذف ادمین به‌صورت امن با بازنشسته‌سازی حساب انجام می‌شود؛ سابقه حسابداری و Audit حفظ می‌شود و مانده اعتبار یا ترافیک مانع حذف نیست. فقط ادمین دارای زیرمجموعه فعال باید ابتدا زیرمجموعه‌هایش را مدیریت کند.\n'
          if old not in text:
              raise SystemExit('admin deletion help text not found')
          page.write_text(text.replace(old, new, 1))

          Path('tests/test_v115_admin_deletion.py').write_text(r'''import inspect

from sqlalchemy import create_engine
from sqlalchemy.orm import sessionmaker
from starlette.requests import Request

from app.db import crud
from app.db.base import Base
from app.db.models import Admin as DBAdmin, AdminMoneyTransaction, MarzhelpAdminSettings, User
from app.models.admin import Admin as APIAdmin, AdminCreate, AdminDeleteRequest, MarzhelpAdminPolicy
from app.models.user import UserStatus
from app.routers import admin as admin_router


def _request(username: str) -> Request:
    return Request(
        {
            "type": "http",
            "method": "DELETE",
            "path": f"/api/admin/{username}",
            "headers": [],
            "query_string": b"",
            "server": ("testserver", 80),
            "client": ("testclient", 1234),
            "scheme": "http",
        }
    )


def test_delete_route_retires_admin_with_nonzero_accounting_state(tmp_path, monkeypatch):
    engine = create_engine(f"sqlite:///{tmp_path / 'v115-admin-delete.sqlite3'}")
    Base.metadata.create_all(engine)
    db = sessionmaker(bind=engine, expire_on_commit=False)()
    try:
        actor = crud.create_admin(
            db,
            AdminCreate(username="owner-delete-test", password="secret", is_sudo=True),
        )
        target = crud.create_admin(
            db,
            AdminCreate(username="retire-with-credit", password="secret", is_sudo=False),
        )
        owned_user = User(
            username="retire-owned-user",
            admin_id=target.id,
            status=UserStatus.active,
        )
        db.add(owned_user)
        settings = crud.upsert_marzhelp_admin_policy(
            db,
            target.id,
            MarzhelpAdminPolicy(
                total_traffic=100 * 1024**3,
                calculate_volume="created_traffic",
            ),
        )
        settings.used_traffic = 40 * 1024**3
        settings.delegated_traffic = 5 * 1024**3
        settings.money_balance_toman = 250_000
        db.add(
            AdminMoneyTransaction(
                operation_key="v115-delete-history",
                operation_type="grant",
                admin_id=target.id,
                actor_admin_id=actor.id,
                counterparty_admin_id=actor.id,
                delta_toman=250_000,
                balance_before=0,
                balance_after=250_000,
            )
        )
        db.commit()

        monkeypatch.setattr(admin_router.admin_hierarchy, "admin_in_scope", lambda *_args, **_kwargs: True)
        monkeypatch.setattr(admin_router.admin_hierarchy, "role_code", lambda *_args, **_kwargs: "ADMIN")
        monkeypatch.setattr(admin_router.AuditLogService, "log", lambda *_args, **_kwargs: None)
        monkeypatch.setattr(admin_router.xray.config, "include_db_users", lambda: {})
        monkeypatch.setattr(admin_router.xray.core, "started", False)
        monkeypatch.setattr(admin_router.xray, "nodes", {})

        response = admin_router.remove_admin(
            request=_request(target.username),
            values=AdminDeleteRequest(strategy="keep_users"),
            dbadmin=target,
            db=db,
            current_admin=APIAdmin.model_validate(actor),
        )

        assert response == {"detail": "Admin removed successfully"}
        assert crud.get_admin(db, target.username) is None
        tombstone = db.query(DBAdmin).filter(DBAdmin.username == target.username).one()
        assert tombstone.deleted_at is not None
        assert tombstone.hashed_password == ""
        assert tombstone.is_sudo is False
        assert db.get(MarzhelpAdminSettings, tombstone.id) is None
        assert db.query(User).filter(User.username == owned_user.username).one().admin_id is None
        assert db.query(AdminMoneyTransaction).filter(
            AdminMoneyTransaction.operation_key == "v115-delete-history"
        ).count() == 1
    finally:
        db.close()
        engine.dispose()


def test_delete_route_no_longer_blocks_accounting_balances():
    source = inspect.getsource(admin_router.remove_admin)
    assert "admin_delete_credit_unsettled" not in source
    assert "money_balance_toman" not in source
    assert "own_credit_spend" not in source
    assert "admin_delete_has_children" in source
    assert "admin_delete_owner_or_self_forbidden" in source
''')
          PY

      - name: Run focused backend deletion regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install -r requirements.txt
          pytest -q tests/test_v113_admin_retirement.py tests/test_admin_management.py tests/test_v115_admin_deletion.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Build dashboard and committed parity output
        working-directory: app/dashboard
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          VITE_BASE_API=/api/ npm run build
          cp build/index.html build/404.html

      - name: Commit source tests and dashboard build
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routers/admin.py app/dashboard/src/pages/admins/AdminsPage.tsx app/dashboard/build tests/test_v115_admin_deletion.py
          git diff --cached --check
          git commit -m "fix: retire admins with accounting history"
          git push origin HEAD:release/v1.1.5
