name: v1.0.4 production dashboard rebuild

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.head_ref == 'release/v1.0.4'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Build canonical production dashboard
        working-directory: app/dashboard
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          rm -rf build
          VITE_BASE_API=/api/ npm run build -- --outDir build --assetsDir statics
          test -f build/index.html
          test -f build/404.html
          npm run test:access-groups
          npm run test:admin-hierarchy
          npm run test:admin-ux

      - name: Commit canonical build only
        shell: bash
        run: |
          set -Eeuo pipefail
          git add app/dashboard/build
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Canonical production build already committed.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: regenerate v1.0.4 production dashboard"
          git push origin HEAD:release/v1.0.4
