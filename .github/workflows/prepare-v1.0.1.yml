name: Prepare V1.0.1

on:
  push:
    branches:
      - release/v1.0.1

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message != 'chore: prepare v1.0.1 release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v1.0.1
          fetch-depth: 0

      - name: Apply release metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace("VERSION", "1.0.0\n", "1.0.1\n")
          replace("app/__init__.py", '__version__ = "1.0.0"', '__version__ = "1.0.1"')
          replace("scripts/marzban.sh", 'CLI_RELEASE_VERSION="v1.0.0"', 'CLI_RELEASE_VERSION="v1.0.1"')
          replace("docker-compose.yml", "ghcr.io/smorad3363/marzban-v1:v1.0.0", "ghcr.io/smorad3363/marzban-v1:v1.0.1")
          replace(
              "README.md",
              "https://raw.githubusercontent.com/smorad3363/Marzban-v1/v1.0.0/scripts/marzban.sh)\" @ install --version v1.0.0 --database mysql",
              "https://raw.githubusercontent.com/smorad3363/Marzban-v1/v1.0.1/scripts/marzban.sh)\" @ install --version v1.0.1 --database mysql",
          )
          replace(
              "README-fa.md",
              "sudo bash -c \"$(curl -sL https://raw.githubusercontent.com/smorad3363/Marzban/master/scripts/marzban.sh)\" @ install --database mysql",
              "sudo bash -c \"$(curl -fsSL https://raw.githubusercontent.com/smorad3363/Marzban-v1/v1.0.1/scripts/marzban.sh)\" @ install --version v1.0.1 --database mysql",
          )
          replace("tests/test_release_contract.py", 'assert version == "1.0.0"', 'assert version == "1.0.1"')
          replace(
              "tests/test_release_contract.py",
              "    assert 'git tag -a \"${VERSION_TAG}\" \"${GITHUB_SHA}\"' not in build_workflow\n",
              "    assert \"Create v1.0.1 release tag\" in build_workflow\n",
          )

          workflow = Path(".github/workflows/build.yml")
          text = workflow.read_text(encoding="utf-8")
          marker = "  tag-v1-0-1:\n"
          if marker not in text:
              text += '''\n  tag-v1-0-1:\n    name: Create v1.0.1 release tag\n    needs:\n      - test-mysql\n      - test-mysql-upgrade\n    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout tested commit\n        uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n\n      - name: Setup nodejs\n        uses: actions/setup-node@v4\n        with:\n          node-version: 20\n          cache: npm\n          cache-dependency-path: app/dashboard/package-lock.json\n\n      - name: Install dashboard dependencies\n        working-directory: ./app/dashboard\n        run: npm ci\n\n      - name: Verify dashboard production build\n        working-directory: ./app/dashboard\n        run: VITE_BASE_API=/api/ npm run build --if-present -- --outDir /tmp/marzban-dashboard-v101 --assetsDir statics\n\n      - name: Verify release metadata and create tag\n        shell: bash\n        run: |\n          set -Eeuo pipefail\n          version=\"$(tr -d '[:space:]' < VERSION)\"\n          test \"${version}\" = \"1.0.1\"\n          grep -Fx '__version__ = \"1.0.1\"' app/__init__.py\n          grep -Fx 'CLI_RELEASE_VERSION=\"v1.0.1\"' scripts/marzban.sh\n          grep -Fq 'ghcr.io/smorad3363/marzban-v1:v1.0.1' docker-compose.yml\n          test -s /tmp/marzban-dashboard-v101/index.html\n          test -s /tmp/marzban-dashboard-v101/404.html\n          tag=\"v1.0.1\"\n          if git ls-remote --exit-code --tags origin \"refs/tags/${tag}\" >/dev/null 2>&1; then\n            echo \"${tag} already exists; leaving immutable release tag unchanged.\"\n            exit 0\n          fi\n          git config user.name \"github-actions[bot]\"\n          git config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\n          git tag -a \"${tag}\" \"${GITHUB_SHA}\" -m \"Marzban ${tag}\"\n          git push origin \"refs/tags/${tag}\"\n'''
              workflow.write_text(text, encoding="utf-8")
          PY

      - name: Verify shell and release contract
        shell: bash
        run: |
          bash -n scripts/marzban.sh
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_release_contract.py

      - name: Setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Verify dashboard build
        working-directory: ./app/dashboard
        run: |
          npm ci
          VITE_BASE_API=/api/ npm run build --if-present -- --outDir /tmp/marzban-dashboard-v101-prep --assetsDir statics
          test -s /tmp/marzban-dashboard-v101-prep/index.html
          test -s /tmp/marzban-dashboard-v101-prep/404.html

      - name: Commit prepared release
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION app/__init__.py scripts/marzban.sh docker-compose.yml README.md README-fa.md tests/test_release_contract.py .github/workflows/build.yml
          if git diff --cached --quiet; then
            echo "No release metadata changes to commit."
            exit 0
          fi
          git commit -m "chore: prepare v1.0.1 release"
          git push origin HEAD:release/v1.0.1
