name: tmp v1.1.1 global errors

on:
  push:
    branches:
      - fix/v1.1.1-global-api-errors

permissions:
  contents: write

jobs:
  test-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.1.1-global-api-errors
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json
      - name: Add required UI regression contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/dashboard/scripts/test-stage1-ui-contracts.cjs')
          s = p.read_text()
          if 'Global API errors must expose a stable code' not in s:
              insert = r'''
          // Global API errors must expose a stable code, actionable Persian text and context.
          const apiError = read("src/utils/apiError.ts");
          const toastHandler = read("src/utils/toastHandler.ts");
          const httpService = read("src/service/http.ts");
          assert.ok(apiError.includes("candidate?.response?.data"), "API error parser must accept Axios-compatible response.data as well as ofetch data");
          assert.ok(apiError.includes("[${info.code}] ${info.message}"), "Visible errors must include an error code and message");
          assert.ok(apiError.includes("فیلد: ${field}"), "Visible errors must identify the failing field when available");
          assert.ok(apiError.includes("کد پیگیری: ${info.requestId}"), "Visible errors must expose the request tracking id");
          assert.ok(toastHandler.includes("localizedApiError(e, field)"), "Validation field errors must use the contextual formatter");
          assert.ok(httpService.includes("error.message = localizedApiError(error)"), "All shared fetch failures must normalize legacy error.message");
          '''
              s = s.replace('\nconsole.log("stage 1 UI contracts: assertions passed");', insert + '\nconsole.log("stage 1 UI contracts: assertions passed");')
              p.write_text(s)
          PY
      - name: Audit direct error rendering
        shell: bash
        run: |
          echo '--- direct raw error references (reviewed; global fetch message is normalized) ---'
          grep -RInE 'response\.?(_data|data).*detail|\.message' app/dashboard/src --include='*.ts' --include='*.tsx' | head -250 || true
      - name: Static backend error contract
        shell: bash
        run: |
          python -m py_compile app/utils/api_errors.py tests/test_api_error_contract.py
          grep -Fq 'ERROR_CODE_PATTERN' app/utils/api_errors.py
          grep -Fq 'duration_preset_required' app/utils/api_errors.py
          grep -Fq 'request_id' app/utils/api_errors.py
      - name: Install and test dashboard
        working-directory: app/dashboard
        run: |
          npm ci
          node scripts/test-stage1-ui-contracts.cjs
          VITE_BASE_API=/api/ npm run build
      - name: Commit regression and dashboard build
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/dashboard/scripts/test-stage1-ui-contracts.cjs app/dashboard/build
          if ! git diff --cached --quiet; then
            git commit -m 'test(errors): lock dashboard error context and build'
            git push origin HEAD:fix/v1.1.1-global-api-errors
          fi
