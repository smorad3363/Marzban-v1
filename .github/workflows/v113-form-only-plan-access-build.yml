name: Build v1.1.3 FORM_ONLY plan access fix

on:
  push:
    branches: [release/v1.1.3]

permissions:
  contents: write

jobs:
  patch-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.1.3
          fetch-depth: 0

      - name: Make Plan category assignment independent from creation mode
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('app/dashboard/src/components/AdminFormDrawer.tsx')
          source = path.read_text()
          old_open = '''                {normalizedCreationMode !== "FORM_ONLY" && (\n                  <Box mt={4} pt={4} borderTopWidth="1px" borderColor="var(--panel-border)">\n                    <Text fontSize="sm" fontWeight="800">دسترسی پلن</Text>\n                    <Text mt={1} color="var(--panel-text-muted)" fontSize="xs">دسته‌بندی‌هایی را انتخاب کنید که پلن‌هایشان برای این ادمین در ساخت کاربر قابل مشاهده باشد.</Text>'''
          new_open = '''                <Box mt={4} pt={4} borderTopWidth="1px" borderColor="var(--panel-border)">\n                  <Text fontSize="sm" fontWeight="800">دسترسی پلن</Text>\n                  <Text mt={1} color="var(--panel-text-muted)" fontSize="xs">دسته‌بندی‌هایی را انتخاب کنید که پلن‌هایشان برای این ادمین قابل مشاهده باشد. در حالت «فقط فرم دلخواه»، این دسترسی فقط فهرست پلن‌ها را فراهم می‌کند و اجازه ساخت کاربر از پلن را فعال نمی‌کند.</Text>'''
          if old_open not in source:
              raise SystemExit('FORM_ONLY Plan access opening anchor missing')
          source = source.replace(old_open, new_open, 1)
          old_close = '''                  </Box>\n                )}\n\n                <SimpleGrid mt={4} pt={4} borderTopWidth="1px" borderColor="var(--panel-border)" columns={{ base: 1, lg: 2 }} gap={3}>'''
          new_close = '''                </Box>\n\n                <SimpleGrid mt={4} pt={4} borderTopWidth="1px" borderColor="var(--panel-border)" columns={{ base: 1, lg: 2 }} gap={3}>'''
          if old_close not in source:
              raise SystemExit('FORM_ONLY Plan access closing anchor missing')
          source = source.replace(old_close, new_close, 1)
          path.write_text(source)

          test = Path('app/dashboard/scripts/test-v1.1.3-regressions.cjs')
          text = test.read_text()
          anchor = 'assert(adminForm.includes("حداقل یک دسته‌بندی پلن"));\n'
          addition = '''assert(adminForm.includes("حداقل یک دسته‌بندی پلن"));\nassert(!adminForm.includes('{normalizedCreationMode !== "FORM_ONLY" && ('));\nassert(adminForm.includes('normalizedCreationMode !== "FORM_ONLY" && !form.plan_category_ids.length'));\nassert(adminForm.includes('در حالت «فقط فرم دلخواه»، این دسترسی فقط فهرست پلن‌ها را فراهم می‌کند'));\n'''
          if anchor not in text:
              raise SystemExit('v1.1.3 regression anchor missing')
          test.write_text(text.replace(anchor, addition, 1))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/dashboard/package-lock.json

      - name: Test and regenerate committed dashboard
        working-directory: app/dashboard
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci
          npm run test:v1.1.3
          VITE_BASE_API=/api/ npm run build
          cp build/index.html build/404.html

      - name: Commit source, regression and build
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/src/components/AdminFormDrawer.tsx \
            app/dashboard/scripts/test-v1.1.3-regressions.cjs \
            app/dashboard/build
          git diff --cached --check
          git commit -m "fix: keep Plan access assignable for custom-form Admins"
          git push origin HEAD:release/v1.1.3
