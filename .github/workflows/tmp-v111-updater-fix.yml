name: tmp v1.1.1 updater fix

on:
  push:
    branches:
      - fix/v1.1.1-updater-runtime

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.1.1-updater-runtime
      - name: Apply updater/runtime fixes and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script_path = Path('scripts/marzban.sh')
          text = script_path.read_text()

          old = '''is_marzban_up() {
              if [ -z "$($COMPOSE -f $COMPOSE_FILE ps -q -a)" ]; then
                  return 1
              else
                  return 0
              fi
          }'''
          new = '''is_marzban_up() {
              local container_id
              container_id=$(running_service_container marzban)
              [ -n "$container_id" ]
          }'''
          if old not in text:
              raise SystemExit('is_marzban_up marker not found')
          text = text.replace(old, new, 1)

          old = '''    current_version=$(runtime_app_version | tr -d '\\r[:space:]')
              if ! is_release_version "$requested_version" || ! is_release_version "v${current_version}"; then
                  colorized_echo red "Production update requires a known runtime and exact release version."
                  exit 1
              fi'''
          new = '''    if ! current_version=$(runtime_app_version | tr -d '\\r[:space:]') || [ -z "$current_version" ]; then
                  colorized_echo red "Unable to read the running Marzban version. Ensure the marzban service is running, then retry the update."
                  exit 1
              fi
              if ! is_release_version "$requested_version" || ! is_release_version "v${current_version}"; then
                  colorized_echo red "Production update requires an exact release version; running version is '${current_version:-unavailable}'."
                  exit 1
              fi'''
          if old not in text:
              raise SystemExit('runtime-version marker not found')
          text = text.replace(old, new, 1)
          script_path.write_text(text)

          test_path = Path('tests/test_installer_v1_contract.sh')
          test = test_path.read_text()
          marker = '''check_running_as_root() { :; }
          is_marzban_installed() { return 0; }
          detect_compose() { COMPOSE=mock_compose; }
          is_marzban_up() { return 0; }'''
          replacement = '''# is_marzban_up must only report a running application service as up.
          # A stopped/exited container may still appear with `compose ps -a`, so the
          # production predicate must use the running-service query instead.
          COMPOSE=mock_compose_state
          mock_compose_state() {
            case "$*" in
              *"ps -q marzban"*) printf '%s\\n' "running-marzban-id" ;;
              *) return 0 ;;
            esac
          }
          is_marzban_up

          mock_compose_state() { return 0; }
          if is_marzban_up; then
            echo "is_marzban_up treated a stopped service as running" >&2
            exit 1
          fi

          check_running_as_root() { :; }
          is_marzban_installed() { return 0; }
          detect_compose() { COMPOSE=mock_compose; }
          is_marzban_up() { return 0; }'''
          if marker not in test:
              raise SystemExit('installer contract marker not found')
          test = test.replace(marker, replacement, 1)

          # Lock the explicit runtime diagnostic and rollback restart contract.
          test += '''
          grep -Fq 'Unable to read the running Marzban version.' scripts/marzban.sh
          grep -Fq 'update_command --version "$1"' scripts/marzban.sh
          python - <<'PY_INNER'
          from pathlib import Path
          s = Path('scripts/marzban.sh').read_text()
          start = s.index('update_command() {')
          end = s.index('rollback_command() {', start)
          update = s[start:end]
          assert 'down_marzban\n    up_marzban' in update, 'update/rollback path must restart the restored target image'
          PY_INNER
          '''
          test_path.write_text(test)
          PY
      - name: Validate installer contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/marzban.sh
          bash tests/test_installer_v1_contract.sh
      - name: Commit fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/marzban.sh tests/test_installer_v1_contract.sh
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'fix(installer): detect stopped services during updates'
            git push origin HEAD:fix/v1.1.1-updater-runtime
          fi
